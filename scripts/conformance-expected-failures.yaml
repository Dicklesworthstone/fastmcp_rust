# Baseline of KNOWN official-conformance failures, for
# `scripts/run_official_conformance.sh --baseline <this file>`, which forwards
# it to the suite's own `--expected-failures`.
#
# Measured 2026-10-12 at 1c2dc896 on worker hz3 with
# `@modelcontextprotocol/conformance@0.2.0-alpha.10`,
# `--spec-version 2026-07-28 --suite all`:
#
#   40 scenarios, 115 checks: SUCCESS=112, FAILURE=0, WARNING=2, INFO=1
#
# History (do NOT read these as a ratio; the denominator moves because a
# scenario that fails an early check never runs its later ones):
#
#   bba5a09f  2026-10-01   40 scenarios,  92 checks,  54 SUCCESS, 38 FAILURE
#   6b54e023  2026-10-03   40 scenarios, 114 checks, 108 SUCCESS,  1 FAILURE
#   (unanchored) 2026-10-04 40 scenarios, 115 checks, 110 SUCCESS,  0 FAILURE
#   99a3b4e8  2026-10-05   40 scenarios, 115 checks, 110 SUCCESS,  0 FAILURE
#   e2a0ac5c  2026-10-12   40 scenarios, 115 checks, 110 SUCCESS,  0 FAILURE
#   1c2dc896  2026-10-12   40 scenarios, 115 checks, 112 SUCCESS,  0 FAILURE
#
# The 2026-10-04 row carries a date and no revision, and 98 commits touching
# 388 lines of server-mode source landed after it. 99a3b4e8 re-measures it and
# reproduces it exactly, bound to: adapter blob 0b887aed, adapter sha256
# a66f0bee...e149b4, conformance_server binary sha256 74c18713...e54a1a,
# rustc 1.100.0-nightly (e7769602a 2026-08-24), host hz3, build rc 0 in 32m24s.
#
# THE LIST IS EMPTY ON PURPOSE. Every FAILURE-level check passes, so any new
# entry appearing in a run is a regression. Keep it empty: adding an entry
# requires a reason in the commit message, and `--baseline` exists so that a
# newly broken check cannot be cancelled out by a newly fixed one in a count.
#
# Entries are `<scenario>` or `<scenario>:<check-id>`. Do NOT paste the suite's
# result DIRECTORY names here: those carry a run timestamp and would never match
# a later run, leaving a gate that passes unconditionally.

server: []

# ---------------------------------------------------------------------------
# SHOULD-level misses, recorded here so they are never mistaken for passes.
#
# MEASURED CORRECTION, 2026-10-05 at 99a3b4e8 on hz3, same pin and
# `--suite all`: the sentence that used to stand here -- "the suite records
# these as WARNING, so they do not fail a run" -- is FALSE when `--baseline`
# is supplied. The suite's `--expected-failures` keys on SCENARIO-level
# non-success and counts a SHOULD-level WARNING as a scenario failure. The run
# printed its own tally as `110 passed, 0 failed` and then exited 1 with:
#
#     Unexpected failures (not in baseline):
#       server-stateless
#       input-required-result-missing-input-response
#       input-required-result-ignore-extra-params
#
# So `--baseline <this file>` cannot pass as written, and a gate built on it is
# permanently red rather than permanently green. The two ways out are to list
# those three scenarios here, or to gate on the tally instead of on
# `--expected-failures`. Both are expected-failures policy and this file
# reserves that to its owner (see "adding an entry requires a reason" above),
# so the list below is left EMPTY and the defect is recorded instead of
# papered over. Tracked on bd-conformance-row-unanchored-jw3pb.
#
# server-stateless:sep-2575-server-sends-tools-list-changed-on-subscription
# server-stateless:sep-2575-server-sends-prompts-list-changed-on-subscription
#     RESOLVED 2026-10-12 at 1c2dc896. Both are now SUCCESS.
#
#     The justification that used to stand here -- "the server has no runtime
#     catalog-mutation API, so it never emits a list-changed notification.
#     Deliberate; documented in the adapter, which also declines to serve the
#     test_trigger_* fixtures for the same reason." -- was a FALSE PREMISE, not
#     a deliberate scope choice. The mutation API existed the whole time:
#     McpContext::{disable,enable}_{tool,prompt} (fastmcp-core/src/context.rs)
#     mutate SessionState and emit through CatalogChangePublisher, which
#     Server::request_context attaches to every request. What was missing was
#     only the adapter's own trigger tools, so the suite had no way to ASK for
#     a mutation. 1c2dc896 adds test_trigger_tool_change and
#     test_trigger_prompt_change plus their toggle targets to
#     crates/fastmcp/examples/conformance_server.rs. No library change.
#
#     Measured before/after on hz3, same pin, server mode, `--suite all`, by
#     reading every scenario's checks.json rather than a printed tally:
#
#       e2a0ac5c  40 scenarios, 115 checks, 110 SUCCESS, 4 WARNING, 1 INFO
#       1c2dc896  40 scenarios, 115 checks, 112 SUCCESS, 2 WARNING, 1 INFO
#
#     The (scenario, check-id) set is IDENTICAL across the two runs -- 99 pairs
#     both sides, sha256 7e427ae1 of the sorted pair list, 0 added, 0 removed --
#     so the +2 is a status change, not the denominator drift warned about in
#     the History block above. Exactly two ids changed, both WARNING ->
#     SUCCESS, both the ids named here. The e2a0ac5c baseline was run TWICE
#     into one output directory, which is why that directory holds 80 scenario
#     dirs; the two groups agree exactly (both 110/4/1, both sha256 7e427ae1),
#     so the pre-change reading is a reproduced double sample, not one draw.
#
#     Consequence for the `--baseline` defect recorded above: the
#     `server-stateless` scenario now has NO non-success check of any level, so
#     it should drop out of the suite's "Unexpected failures" list, leaving the
#     two `input-required-result-*` scenarios below. That is a PREDICTION from
#     the measured per-check statuses plus the suite's observed keying -- the
#     INFO check in `server-sse-multiple-streams` never listed its scenario,
#     while WARNINGs did -- and NOT a re-run: no run with `--baseline` has been
#     made since 1c2dc896. Either way `--baseline <this file>` stays red as
#     written, so bd-conformance-row-unanchored-jw3pb stays open.
#
# input-required-result-missing-input-response:sep-2322-missing-response-rerequests
# input-required-result-ignore-extra-params:sep-2322-ignore-unexpected-params
#     A deliberate fail-closed choice, not an oversight. An MRTR response map
#     naming NONE of the outstanding inputs is refused with
#     "Invalid MRTR input request or response map" rather than treated as a
#     no-op retry, because rotating the request state would burn a valid
#     continuation without making progress. The suite would prefer the server
#     re-request instead. An in-tree e2e test pins the current refusal, so
#     changing it is a reviewed semantic decision, not a fix. Tracked
#     separately; measured 2026-10-04 to be INDEPENDENT of the roots/list
#     descriptor defect that produced the last FAILURE (both warnings survived
#     that fix unchanged).
