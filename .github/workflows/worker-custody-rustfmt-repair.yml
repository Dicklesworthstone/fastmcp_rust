name: One-shot worker custody formatting repair

on:
  push:
    branches: [main]
    paths: [.github/workflows/worker-custody-rustfmt-repair.yml]

permissions:
  contents: read

jobs:
  repair-and-validate:
    if: >-
      github.event.head_commit.message == 'ci: isolate one-shot worker custody formatting repair'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-25
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: modern-no-legacy

      - name: Format and commit Rust sources only
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', '-z']).split(b'\0')
          unexpected = [p for p in paths if p and not p.endswith(b'.rs')]
          if unexpected:
              raise SystemExit(f'Refusing non-Rust changes: {unexpected!r}')
          PY
          git add -- '*.rs'
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: apply rustfmt to worker custody and workspace'
            # Refuse concurrent main changes instead of overwriting them.
            git push origin HEAD:main
          fi
          printf 'Source revision: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD

      - name: Verify committed formatting
        run: cargo fmt --all -- --check

      - name: Test blocking handler worker custody
        if: ${{ !cancelled() }}
        run: cargo test --locked -p fastmcp-server --no-default-features --lib providers::blocking -- --nocapture

      - name: Test shipped no-legacy integrations
        if: ${{ !cancelled() }}
        run: cargo test --locked -p fastmcp-server --no-default-features --test srv_02_b --test srv_65_modern_multi_request -- --nocapture

      - name: Lint shipped no-legacy server and integrations
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p fastmcp-server --no-default-features --lib --test srv_02_b --test srv_65_modern_multi_request -- -D warnings
