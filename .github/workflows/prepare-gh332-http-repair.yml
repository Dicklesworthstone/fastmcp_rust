name: Prepare and validate GH332 HTTP repair

on:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-gh332-http-repair.yml]

permissions:
  contents: read

jobs:
  prepare-and-test:
    # One explicit source snapshot only; this never pushes or changes a ref.
    if: >-
      github.repository == 'Dicklesworthstone/fastmcp_rust' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'ci: prepare GH332 HTTP repair on pinned source'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-08-25
          components: rustfmt

      - name: Prepare exact repair and publish immutable candidate blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          source_path = Path('crates/fastmcp-transport/src/http.rs')
          tests_path = Path('crates/fastmcp-transport/tests/http_empty_header_values.rs')
          expected_source = 'e11bfbe6f62174321d0ad30bea261da26c9b5e94'
          expected_tests = '807647b0bfb3fd092d7d11eb99d0ad8b11cb1359'
          api = 'https://api.github.com/repos/Dicklesworthstone/fastmcp_rust'

          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          def request(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(api + path, data=data, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          original = source_path.read_bytes()
          assert blob_sha(original) == expected_source, 'source changed; refusing stale repair'
          assert not tests_path.exists(), 'regression file already exists; refusing overwrite'
          source = original.decode()

          def replace_once(old, new):
              global source
              assert source.count(old) == 1, 'repair context missing or ambiguous: ' + old[:100]
              source = source.replace(old, new, 1)

          replace_once(
              'if !is_valid_http_header_value(origin) {',
              'if !is_valid_http_field_value("origin", origin) {',
          )
          for indent, diagnostic in [
              ('        ', 'invalid value for request header {name}'),
              ('            ', 'invalid value for header {name}'),
              ('            ', 'invalid value for response header {name}'),
          ]:
              old = (indent + 'if !is_valid_http_header_value(value) {\n'
                     + indent + '    return Err(HttpError::InvalidHeader(format!(\n'
                     + indent + '        "' + diagnostic + '"')
              replace_once(old, old.replace('is_valid_http_header_value(value)',
                                           'is_valid_http_field_value(name, value)'))
          replace_once(
              '&& reason.is_some_and(is_valid_http_header_value)',
              '&& reason.is_some_and(|reason| {\n'
              '                    !reason.is_empty() && is_valid_http_header_value(reason)\n'
              '                })',
          )
          old_validator = r'''fn is_valid_http_header_value(value: &str) -> bool {
              !value.is_empty()
                  && value
                      .bytes()
                      .all(|byte| byte == b'\t' || byte >= b' ' && byte != 0x7f)
          }'''
          new_validator = r'''fn is_valid_http_header_value(value: &str) -> bool {
              // RFC 9110 section 5.5: field-value = *field-content. Empty extension
              // fields are syntactically valid; field-specific requirements belong
              // below, not in the shared control-byte check.
              value
                  .bytes()
                  .all(|byte| byte == b'\t' || byte >= b' ' && byte != 0x7f)
          }

          fn is_valid_http_field_value(name: &str, value: &str) -> bool {
              if !is_valid_http_header_value(value) {
                  return false;
              }
              if !value.trim_matches([' ', '\t']).is_empty() {
                  return true;
              }

              // Preserve nonempty values for the framing, authentication, origin and
              // MCP metadata fields this transport relies on. This is a minimum bound,
              // not a replacement for their existing field-specific parsers/policies.
              // Match without allocating or depending on an adapter normalizing names.
              ![
                  "authorization",
                  "proxy-authorization",
                  "www-authenticate",
                  "proxy-authenticate",
                  "content-type",
                  "content-length",
                  "content-encoding",
                  "transfer-encoding",
                  "host",
                  "origin",
                  "access-control-allow-origin",
                  "access-control-request-method",
                  "mcp-protocol-version",
                  "mcp-session-id",
                  "mcp-method",
                  "mcp-name",
              ]
              .iter()
              .any(|required| name.eq_ignore_ascii_case(required))
          }'''
          replace_once(old_validator, new_validator)
          source_path.write_bytes(source.encode())

          test_blob = request('/git/blobs/' + expected_tests)
          tests = base64.b64decode(test_blob['content'])
          assert blob_sha(tests) == expected_tests, 'test blob content mismatch'
          extra_tests = r'''
          #[test]
          fn gh332_wire_empty_fields_preserve_consecutive_request_boundaries() {
              let mut wire = wire_request("Tailscale-User-Profile-Pic", "");
              wire.extend(wire_request("X-Optional-Metadata", " \t "));
              let mut transport = HttpTransport::new(Cursor::new(wire), Vec::new());
              let first = transport.read_request().expect("first request");
              let second = transport.read_request().expect("second request");
              assert_eq!(first.header("tailscale-user-profile-pic"), Some(""));
              assert_eq!(second.header("x-optional-metadata"), Some(""));
              assert_eq!(first.body, INITIALIZE.as_bytes());
              assert_eq!(second.body, INITIALIZE.as_bytes());
              assert!(matches!(transport.read_request(), Err(HttpError::Closed)));
          }

          #[test]
          fn gh332_empty_accept_reaches_semantic_negotiation() {
              let handler = HttpRequestHandler::new();
              let request = HttpRequest::new(HttpMethod::Post, "/mcp/v1")
                  .with_header("Content-Type", "application/json")
                  .with_header("MCP-Protocol-Version", "2026-07-28")
                  .with_header("Mcp-Method", "server/discover")
                  .with_header("Accept", "")
                  .with_header("Tailscale-User-Profile-Pic", "")
                  .with_body(br#"{"jsonrpc":"2.0","id":332,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}"#.to_vec());
              assert!(matches!(handler.admit_modern_request(&request), Err(HttpError::NotAcceptable)));
              let admitted = request.with_header("Accept", "application/json");
              assert!(handler.admit_modern_request(&admitted).is_ok());
          }

          #[test]
          fn gh332_transport_round_trip_dispatches_initialize_with_empty_extension() {
              use asupersync::Cx;
              use fastmcp_protocol::{JsonRpcMessage, JsonRpcResponse, RequestId};
              use fastmcp_transport::Transport;

              let mut output = Vec::new();
              {
                  let mut transport = HttpTransport::new(
                      Cursor::new(wire_request("Tailscale-User-Profile-Pic", "")),
                      &mut output,
                  );
                  let cx = Cx::for_testing();
                  let message = transport.recv(&cx).expect("initialize reaches dispatch");
                  assert!(matches!(message, JsonRpcMessage::Request(ref request)
                      if request.method == "initialize" && request.id == Some(RequestId::Number(1))));
                  transport.send(&cx, &JsonRpcMessage::Response(JsonRpcResponse::success(
                      RequestId::Number(1), serde_json::json!({"accepted": true}),
                  ))).expect("response completes the admitted exchange");
              }
              let wire = String::from_utf8(output).expect("UTF-8 response");
              assert!(wire.starts_with("HTTP/1.1 200 OK\r\n"));
              assert!(wire.contains(r#""accepted":true"#));
          }
          '''
          tests_path.write_bytes(tests + extra_tests.encode())
          subprocess.run(['rustfmt', '--edition', '2024', str(tests_path)], check=True)
          # Parse the full production module without rewriting unrelated formatting.
          subprocess.run(['rustfmt', '--edition', '2024', '--emit', 'stdout', str(source_path)],
                         stdout=subprocess.DEVNULL, check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)

          manifest = {
              'base_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'source_base_blob': expected_source,
              'source_path': str(source_path),
              'tests_path': str(tests_path),
              'test_count': 11,
          }
          for label, path in [('source', source_path), ('tests', tests_path)]:
              content = path.read_bytes()
              result = request('/git/blobs', {'content': content.decode(), 'encoding': 'utf-8'})
              assert result['sha'] == blob_sha(content), 'published blob mismatch'
              manifest[label + '_blob'] = result['sha']

          export = Path('gh332-candidate')
          export.mkdir()
          (export / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (export / 'http.rs').write_bytes(source_path.read_bytes())
          (export / 'http_empty_header_values.rs').write_bytes(tests_path.read_bytes())
          (export / 'production.patch').write_bytes(subprocess.check_output(['git', 'diff', '--', str(source_path)]))
          print(json.dumps(manifest, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## GH332 candidate (no ref changed)\n```json\n' + json.dumps(manifest, indent=2) + '\n```\n')
          PY

      - name: Export candidate for review and direct main commit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gh332-http-candidate
          path: gh332-candidate/
          if-no-files-found: error
          retention-days: 3

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: gh332-http-transport

      - name: Run public HTTP regression tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fastmcp-transport --test http_empty_header_values -- --nocapture 2>&1 | tee gh332-default-tests.log

      - name: Run regression tests with legacy HTTP enabled
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fastmcp-transport --features legacy-2024-11-05 --test http_empty_header_values -- --nocapture 2>&1 | tee gh332-legacy-tests.log

      - name: Export exact test transcripts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gh332-http-test-results
          path: gh332-*-tests.log
          if-no-files-found: ignore
          retention-days: 3
