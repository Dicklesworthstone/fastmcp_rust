name: Export exact source snapshot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-source-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    name: Exact source snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Archive exact checkout
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > SOURCE_HEAD
          tar --exclude=.git -czf "$RUNNER_TEMP/source-snapshot.tar.gz" .

      - name: Upload exact checkout
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fastmcp-source-${{ github.sha }}
          path: ${{ runner.temp }}/source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
