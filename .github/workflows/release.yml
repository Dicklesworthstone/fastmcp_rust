name: Release Quarantine Verification

# This checked-in definition is source quarantine only. Provider-side
# disablement of the historical workflow identity and removal/rotation of any
# ambient publication credential remain separate, mandatory stop-the-line work.

on:
  workflow_dispatch:

concurrency:
  group: release-quarantine
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Quarantine verification
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-07-11
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: release-preflight-${{ runner.os }}-nightly-2026-07-11

      - name: Verify workspace package versions agree
        run: |
          set -euo pipefail
          workspace_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er \
            '[.packages[].version] | unique | if length == 1 then .[0] else error("workspace package versions differ") end')
          printf 'workspace version: %s\n' "${workspace_version}"

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Verify workspace
        run: |
          set -euo pipefail
          cargo check --locked --workspace --all-targets --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets
          cargo test --locked --workspace --all-targets --all-features
          cargo test --locked --workspace --doc
          cargo test --locked --workspace --doc --all-features

      - name: Install cargo-audit
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed
        with:
          tool: cargo-audit@0.22.2
          checksum: true
          fallback: none

      - name: Audit locked dependency graph
        run: cargo audit --deny warnings

      # These archives remain ephemeral runner-local diagnostics only. They are
      # not release assets, registry upload bodies, or publication candidates.
      - name: Stage local diagnostic package archives
        run: |
          set -euo pipefail
          for crate in \
            fastmcp-derive \
            fastmcp-core \
            fastmcp-protocol \
            fastmcp-transport \
            fastmcp-console \
            fastmcp-client \
            fastmcp-server \
            fastmcp-cli \
            fastmcp-rust
          do
            cargo package -p "${crate}" --locked --no-verify
          done

  build:
    name: Diagnostic build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: fastmcp
            asset: fastmcp-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: fastmcp
            asset: fastmcp-linux-arm64
          - os: macos-15
            target: x86_64-apple-darwin
            artifact: fastmcp
            asset: fastmcp-darwin-amd64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: fastmcp
            asset: fastmcp-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: fastmcp.exe
            asset: fastmcp-windows-amd64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # FND-01: pin the exact dated nightly from rust-toolchain.toml (not floating "nightly").
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-07-11
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: release-${{ matrix.target }}-nightly-2026-07-11

      - name: Build optimized CLI diagnostic
        run: cargo build --release --locked -p fastmcp-cli --target "${{ matrix.target }}"

      - name: Create tarball (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p dist
          binary="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          test -f "${binary}"
          tar -C "target/${{ matrix.target }}/release" -cJf "dist/${{ matrix.asset }}.tar.xz" "${{ matrix.artifact }}"
          (cd dist && shasum -a 256 "${{ matrix.asset }}.tar.xz" > "${{ matrix.asset }}.tar.xz.sha256")

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $binary = "target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          if (-not (Test-Path $binary)) { throw "missing release binary: $binary" }
          Compress-Archive -Path $binary -DestinationPath "dist/${{ matrix.asset }}.zip"
          Push-Location dist
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset }}.zip").Hash.ToLower()
          "$hash  ${{ matrix.asset }}.zip" | Out-File -Encoding ASCII "${{ matrix.asset }}.zip.sha256"
          Pop-Location

      # Short-lived repository Actions diagnostic only; no release job consumes it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quarantine-diagnostic-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3
