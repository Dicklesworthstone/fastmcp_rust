name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false  # Never cancel releases

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: fastmcp
            asset: fastmcp-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: fastmcp
            asset: fastmcp-linux-arm64
          - os: macos-15
            target: x86_64-apple-darwin
            artifact: fastmcp
            asset: fastmcp-darwin-amd64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: fastmcp
            asset: fastmcp-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: fastmcp.exe
            asset: fastmcp-windows-amd64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # FND-01: pin the exact dated nightly from rust-toolchain.toml (not floating "nightly").
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-11
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: release-${{ matrix.target }}-nightly-2026-07-11

      - name: Build release CLI binary
        run: cargo build --release --locked -p fastmcp-cli --target ${{ matrix.target }}

      - name: Create tarball (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p dist
          binary="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          test -f "${binary}"
          tar -C "target/${{ matrix.target }}/release" -cJf "dist/${{ matrix.asset }}.tar.xz" "${{ matrix.artifact }}"
          (cd dist && shasum -a 256 "${{ matrix.asset }}.tar.xz" > "${{ matrix.asset }}.tar.xz.sha256")

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $binary = "target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          if (-not (Test-Path $binary)) { throw "missing release binary: $binary" }
          Compress-Archive -Path $binary -DestinationPath "dist/${{ matrix.asset }}.zip"
          Push-Location dist
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset }}.zip").Hash.ToLower()
          "$hash  ${{ matrix.asset }}.zip" | Out-File -Encoding ASCII "${{ matrix.asset }}.zip.sha256"
          Pop-Location

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/ || echo "No artifacts found"

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "version=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: FastMCP Rust ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}

    outputs:
      version: ${{ steps.version.outputs.version }}

  publish-crates:
    name: Publish to crates.io
    # Decoupled from the binary-build matrix (no `needs:`): crates are platform-independent and
    # must NOT wait on throttled GitHub-hosted x86_64-linux/Windows runners — that coupling is
    # what stranded the asupersync 0.3.4 -> fastmcp 0.3.2 -> beads_rust#353 chain for 4.5h.
    # Runs on ubuntu-24.04-arm (consistently serviceable) in parallel with `build`/`release`, so
    # crate publishing proceeds even while the binary matrix is queued. `cargo publish --locked`
    # verify-builds each crate, so compilation is still gated before any upload, and the loop
    # skips already-published versions (so a tag push and a re-dispatch coexist safely).
    if: ${{ !contains(github.ref, '-') }}  # skip prereleases (tag like v1.2.3-rc1); main has no '-'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # FND-01: same dated nightly contract as rust-toolchain.toml / build matrix.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-11
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: publish-${{ runner.os }}-nightly-2026-07-11

      - name: Ensure crates.io token
        if: ${{ env.CARGO_REGISTRY_TOKEN == '' }}
        run: |
          echo "CARGO_REGISTRY_TOKEN is not set. Configure it in repo secrets."
          exit 1

      - name: Publish crates
        run: |
          set -euo pipefail

          publish_crate() {
            local crate="$1"
            local attempt=1
            local max_attempts=12
            local wait_seconds=600

            while true; do
              echo "Publishing ${crate} (attempt ${attempt}/${max_attempts})..."
              if output=$(cargo publish -p "${crate}" --locked 2>&1); then
                echo "${output}"
                return 0
              fi

              echo "${output}"
              if echo "${output}" | grep -qi "already uploaded"; then
                echo "Crate ${crate} already published. Skipping."
                return 0
              fi

              if [ "${attempt}" -ge "${max_attempts}" ]; then
                echo "Publishing ${crate} failed after ${max_attempts} attempts."
                return 1
              fi

              echo "Waiting ${wait_seconds}s before retrying ${crate}..."
              sleep "${wait_seconds}"
              attempt=$((attempt + 1))
            done
          }

          publish_crate fastmcp-derive
          publish_crate fastmcp-core
          publish_crate fastmcp-protocol
          publish_crate fastmcp-transport
          publish_crate fastmcp-console
          publish_crate fastmcp-client
          publish_crate fastmcp-server
          publish_crate fastmcp-cli
          publish_crate fastmcp-rust
