name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-11
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-11

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ matrix.os }}

      # FND-01: redis/JWT optional features removed from the default graph;
      # Redis Tasks remains a later optional work package (TASKR-01).
      - name: Run default-feature tests
        run: cargo test --locked --workspace --all-targets --verbose

      - name: Run all-feature tests
        run: cargo test --locked --workspace --all-targets --all-features --verbose

      - name: Compile renamed facade-only macro consumer
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test --locked -p fastmcp-rust --test trybuild_tests \
            renamed_facade_only_consumer_compiles_every_macro_family \
            -- --exact --ignored

      - name: Run default-feature doc tests
        run: cargo test --locked --workspace --doc

      - name: Run all-feature doc tests
        run: cargo test --locked --workspace --doc --all-features

      - name: Upload test trace artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-traces-${{ matrix.os }}
          path: |
            crates/**/test_traces/**/*.json
            crates/**/test_traces/**/*.txt
          if-no-files-found: ignore
          retention-days: 7

  check:
    name: Check (all targets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-11

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Check all targets
        run: cargo check --locked --workspace --all-targets --all-features

  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-11
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed
        with:
          tool: cargo-llvm-cov@0.8.7
          checksum: true
          fallback: none

      - name: Run coverage
        run: |
          set -euo pipefail
          cargo llvm-cov --locked --all-features --workspace \
            --lcov --output-path lcov.info \
            --fail-under-lines 80

      - name: Generate coverage summary JSON
        # `cargo llvm-cov report` reuses the profraw data already on disk
        # from the previous step, so we don't re-run the test suite.  The
        # old `--no-run --no-clean` combo is no longer accepted (cargo-llvm-cov
        # rejects both flags together as of recent releases).
        run: |
          set -euo pipefail
          cargo llvm-cov report --json --summary-only \
            --output-path coverage-summary.json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-reports
          path: |
            lcov.info
            coverage-summary.json
          if-no-files-found: error
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-11

      - name: Install cargo-audit
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed
        with:
          tool: cargo-audit@0.22.2
          checksum: true
          fallback: none

      - name: Run security audit
        run: cargo audit --deny warnings

  build:
    name: Build (${{ matrix.target }})
    needs: [lint, test, check, security]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-11
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --workspace --target "${{ matrix.target }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fastmcp-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/fastmcp*
            !target/${{ matrix.target }}/release/*.d
          if-no-files-found: error
          retention-days: 7

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-11

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Pinned Nightly Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # FND-01: exact dated nightly is the compiler contract (not floating nightly).
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-11

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Check with pinned toolchain
        run: cargo check --locked --workspace --all-targets
