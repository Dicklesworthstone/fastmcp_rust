name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-25
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-25

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.os }}

      # FND-01: redis/JWT optional features removed from the default graph;
      # Redis Tasks remains a later optional work package (TASKR-01).
      - name: Run default-feature tests
        run: cargo test --locked --workspace --all-targets --verbose

      - name: Run all-feature tests
        run: cargo test --locked --workspace --all-targets --all-features --verbose

      - name: Prove revived facade E2E binaries reached libtest completion
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          status=0
          transcript="$(cargo test --locked -p fastmcp-rust \
            --features testing-lab,legacy-2024-11-05,tasks,proxy \
            --test e2e_protocol --test e2e_workflow 2>&1)" || status=$?
          printf '%s\n' "$transcript"
          test "$status" -eq 0

          result_for() {
            local target="$1"
            printf '%s\n' "$transcript" | awk -v target="$target" '
              $0 ~ "Running .*" target { active = 1; next }
              active && /^test result: / { print; exit }
            '
          }

          protocol_result="$(result_for e2e_protocol)"
          workflow_result="$(result_for e2e_workflow)"
          case "$protocol_result" in
            "test result: ok. 163 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;"*) ;;
            *) printf 'e2e_protocol did not complete its exact 163-test inventory: %s\n' "$protocol_result" >&2; exit 1 ;;
          esac
          case "$workflow_result" in
            "test result: ok. 79 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;"*) ;;
            *) printf 'e2e_workflow did not complete its exact 79-test inventory: %s\n' "$workflow_result" >&2; exit 1 ;;
          esac

      - name: Prove the shipped CLI and echo server compose under every policy
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          cargo build --locked -p fastmcp-rust \
            --features legacy-2024-11-05,tasks \
            --bin echo_server
          status=0
          transcript="$(FASTMCP_ECHO_SERVER_BIN="$PWD/target/debug/echo_server" \
            cargo test --locked -p fastmcp-cli \
            --features tasks,e2e-fixture \
            --test e2e_test \
            -- --include-ignored 2>&1)" || status=$?
          printf '%s\n' "$transcript"
          test "$status" -eq 0
          result="$(printf '%s\n' "$transcript" | awk '/^test result: / { print; exit }')"
          case "$result" in
            "test result: ok. 41 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;"*) ;;
            *) printf 'CLI E2E proof did not complete its exact 41-test inventory: %s\n' "$result" >&2; exit 1 ;;
          esac

      - name: Compile renamed facade-only macro consumer
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test --locked -p fastmcp-rust --test trybuild_tests \
            renamed_facade_only_consumer_compiles_every_macro_family \
            -- --exact --ignored

      - name: Run default-feature doc tests
        run: cargo test --locked --workspace --doc

      - name: Run all-feature doc tests
        run: cargo test --locked --workspace --doc --all-features

      - name: Upload test trace artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-traces-${{ matrix.os }}
          path: |
            crates/**/test_traces/**/*.json
            crates/**/test_traces/**/*.txt
          if-no-files-found: ignore
          retention-days: 7

  check:
    name: Check (all targets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-25

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Check all targets
        run: cargo check --locked --workspace --all-targets --all-features

  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-25
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: cargo-llvm-cov@0.8.7
          checksum: true
          fallback: none

      - name: Run coverage
        run: |
          set -euo pipefail
          cargo llvm-cov --locked --all-features --workspace \
            --lcov --output-path lcov.info \
            --fail-under-lines 80

      - name: Generate coverage summary JSON
        # `cargo llvm-cov report` reuses the profraw data already on disk
        # from the previous step, so we don't re-run the test suite.  The
        # old `--no-run --no-clean` combo is no longer accepted (cargo-llvm-cov
        # rejects both flags together as of recent releases).
        run: |
          set -euo pipefail
          cargo llvm-cov report --json --summary-only \
            --output-path coverage-summary.json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-reports
          path: |
            lcov.info
            coverage-summary.json
          if-no-files-found: error
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-25

      - name: Install cargo-audit
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: cargo-audit@0.22.2
          checksum: true
          fallback: none

      - name: Run security audit
        # These are unmaintained notices, not vulnerabilities: bincode and
        # yaml-rust are owned by rich_rust -> syntect, while rustls-pemfile is
        # owned by asupersync TLS. Remove each exception as soon as that owner
        # moves off the package. Vulnerability advisories are never ignored.
        # Yanked chacha20 0.10.1 remains non-fatal until FND-01's exact TCB
        # source evidence is deliberately rebound; vulnerabilities still fail.
        run: cargo audit --deny unmaintained --deny unsound --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2024-0320

  build:
    name: Build (${{ matrix.target }})
    needs: [lint, test, check, security]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-25
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --workspace --target "${{ matrix.target }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fastmcp-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/fastmcp*
            !target/${{ matrix.target }}/release/*.d
          if-no-files-found: error
          retention-days: 7

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-25

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Pinned Nightly Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # FND-01: exact dated nightly is the compiler contract (not floating nightly).
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-25

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Check with pinned toolchain
        run: cargo check --locked --workspace --all-targets
