name: Modern-only production graph

on:
  push:
    branches: [main]
    paths:
      - crates/fastmcp-server/**
      - crates/fastmcp-core/**
      - crates/fastmcp-protocol/**
      - crates/fastmcp-transport/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/modern-no-legacy.yml
  pull_request:
    branches: [main]
    paths:
      - crates/fastmcp-server/**
      - crates/fastmcp-core/**
      - crates/fastmcp-protocol/**
      - crates/fastmcp-transport/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/modern-no-legacy.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  production-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-25
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: modern-no-legacy

      - name: Check formatting
        id: formatting
        run: cargo fmt --all -- --check

      # Keep every check fatal, but do not let a formatting failure hide
      # compilation errors or regressions in the worker-custody tests.
      - name: Test blocking handler worker custody
        if: ${{ !cancelled() }}
        run: cargo test --locked -p fastmcp-server --no-default-features --lib providers::blocking -- --nocapture

      - name: Test shipped no-legacy server graph
        if: ${{ !cancelled() }}
        run: cargo test --locked -p fastmcp-server --no-default-features --test srv_02_b -- --nocapture

      - name: Test shipped no-legacy multi-request lifecycle (GH #65)
        if: ${{ !cancelled() }}
        run: cargo test --locked -p fastmcp-server --no-default-features --test srv_65_modern_multi_request -- --nocapture

      - name: Lint shipped no-legacy server graph and worker-custody tests
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p fastmcp-server --no-default-features --lib --test srv_02_b --test srv_65_modern_multi_request -- -D warnings

      - name: Capture rustfmt repair for the exact failing checkout
        if: ${{ !cancelled() && steps.formatting.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git rev-parse HEAD > "$RUNNER_TEMP/formatting-source-head.txt"
          git diff --binary > "$RUNNER_TEMP/rustfmt.patch"
          git diff --name-only -z | tar --null -T - -czf "$RUNNER_TEMP/rustfmt-sources.tar.gz"

      - name: Upload rustfmt repair
        if: ${{ !cancelled() && steps.formatting.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustfmt-repair-${{ github.sha }}
          path: |
            ${{ runner.temp }}/formatting-source-head.txt
            ${{ runner.temp }}/rustfmt.patch
            ${{ runner.temp }}/rustfmt-sources.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Temporary recovery for one explicitly named, trusted main push only.
  # Remove this job after the source-only repair commit has been verified.
  format-repair:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'ci: run one-shot validated rustfmt repair'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Require the inspected source parent
        env:
          EXPECTED_PARENT: 4f920ca1a995896a0601f26edcaa817130664703
        run: test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-25
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: modern-no-legacy

      - name: Apply and verify rustfmt
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

      - name: Validate formatted worker-custody tests
        run: cargo test --locked -p fastmcp-server --no-default-features --lib providers::blocking -- --nocapture

      - name: Validate formatted no-legacy integration tests
        run: cargo test --locked -p fastmcp-server --no-default-features --test srv_02_b --test srv_65_modern_multi_request -- --nocapture

      - name: Lint formatted server and integration tests
        run: cargo clippy --locked -p fastmcp-server --no-default-features --lib --test srv_02_b --test srv_65_modern_multi_request -- -D warnings

      - name: Commit only validated Rust formatting to main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', '-z']).split(b'\0')
          unexpected = [p for p in paths if p and not p.endswith(b'.rs')]
          if unexpected:
              raise SystemExit(f'Refusing non-Rust changes: {unexpected!r}')
          PY
          git add -- '*.rs'
          if git diff --cached --quiet; then
            echo 'No Rust formatting changes are necessary.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply validated rustfmt to worker custody and workspace'
          # A normal fast-forward push rejects concurrent changes; never force.
          git push origin HEAD:main
