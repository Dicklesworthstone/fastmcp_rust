name: CI retry on infrastructure failure

# Hosted-runner VMs have been dying mid-compile with SIGTERM to the runner
# agent (exit 143, run conclusion "failure", no repo-side cancellation).
# Short jobs survive; long compile-heavy jobs die before completion, which
# also skips the rust-cache save and forces another cold build next run.
# This workflow re-runs ONLY the failed jobs of a failed main-branch run,
# exactly once (run_attempt == 1 guard prevents loops): an infrastructure
# death gets a fresh runner; a real code failure fails twice and stays red.

on:
  workflow_run:
    workflows:
      - CI
      - Modern-only production graph
    types:
      - completed

permissions:
  actions: write

concurrency:
  group: ci-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun-failed:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run failed jobs once
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcbf347bc9d9f # v7.0.1
        with:
          script: |
            const run = context.payload.workflow_run;
            core.info(`Re-running failed jobs of ${run.name} run ${run.id} (attempt ${run.run_attempt})`);
            await github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
