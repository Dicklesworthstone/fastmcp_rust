[package]
name = "fastmcp-console"
version.workspace = true
edition.workspace = true
description = "Rich console output for FastMCP servers"
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/fastmcp-console"
keywords = ["mcp", "console", "logging", "stderr", "rich"]
categories = ["command-line-interface", "development-tools"]

[dependencies]
rich_rust = { workspace = true }
log = { workspace = true, features = ["std"] }
regex = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
fastmcp-core = { workspace = true }
fastmcp-protocol = { workspace = true }
strip-ansi-escapes = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
serde_json = { workspace = true }

[[example]]
name = "test_server"
path = "examples/test_server.rs"

[features]
default = []
full = ["rich_rust/full"]
syntax = ["rich_rust/syntax"]
markdown = ["rich_rust/markdown"]
json = ["rich_rust/json"]

[lints]
workspace = true
