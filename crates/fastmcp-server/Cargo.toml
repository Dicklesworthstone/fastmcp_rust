[package]
name = "fastmcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MCP server implementation for FastMCP"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
documentation = "https://docs.rs/fastmcp-server"
keywords = ["mcp", "server", "json-rpc", "async", "tools"]
categories = ["network-programming", "development-tools"]

[dependencies]
fastmcp-core.workspace = true
fastmcp-client.workspace = true
fastmcp-console.workspace = true
fastmcp-protocol.workspace = true
fastmcp-transport.workspace = true
asupersync.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
chrono.workspace = true
base64.workspace = true
getrandom.workspace = true
sha2.workspace = true
hmac.workspace = true
redis = { workspace = true, optional = true }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"], optional = true }

[dev-dependencies]
fastmcp-derive.workspace = true

[lints]
workspace = true

[features]
jwt = ["dep:jsonwebtoken"]
redis = ["dep:redis"]
