[package]
name = "fastmcp-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MCP protocol types and JSON-RPC implementation"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
documentation = "https://docs.rs/fastmcp-protocol"
keywords = ["mcp", "json-rpc", "protocol", "schema", "serialization"]
categories = ["network-programming", "api-bindings"]

[features]
default = []
legacy-2024-11-05 = []
tasks = []
apps = []
# Placeholder for JOSE/JWT support gated by the server auth features
# (enterprise-auth, oauth-client-credentials, builtin-auth-server,
# jwt-resource-auth). No protocol code is gated on it yet; it exists so
# those optional server features resolve.
jose = []

[dependencies]
fastmcp-core.workspace = true
base64.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
regex.workspace = true

[lints]
workspace = true
