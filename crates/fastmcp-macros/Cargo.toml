[package]
name = "fastmcp-derive"
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
description = "Procedural macros for FastMCP (#[tool], #[resource], #[prompt])"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
documentation = "https://docs.rs/fastmcp-derive"
keywords = ["mcp", "proc-macro", "macros", "json-schema", "handlers"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[features]
# This enables Apps types for the proc-macro host. Direct subcrate consumers
# must also enable `fastmcp-protocol/apps` for their target dependency because
# Cargo does not unify proc-macro host features with target features.
apps = ["fastmcp-protocol/apps"]
tasks = []

[dependencies]
fastmcp-protocol.workspace = true
proc-macro2 = "=1.0.107"
proc-macro-crate.workspace = true
quote = "=1.0.47"
syn = { version = "=3.0.3", features = ["full", "parsing", "extra-traits"] }

[lints]
workspace = true
