[workspace]
resolver = "3"
members = [
    "crates/fastmcp",
    "crates/fastmcp-core",
    "crates/fastmcp-transport",
    "crates/fastmcp-protocol",
    "crates/fastmcp-server",
    "crates/fastmcp-client",
    "crates/fastmcp-macros",
    "crates/fastmcp-console",
    "crates/fastmcp-cli",
]

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "MIT"
# Cargo lower-bound check only; the supported compiler is the dated nightly
# pinned in rust-toolchain.toml (nightly-2026-07-11 / rustc 1.99.0-nightly).
rust-version = "1.99"
repository = "https://github.com/Dicklesworthstone/fastmcp_rust"
homepage = "https://github.com/Dicklesworthstone/fastmcp_rust"
readme = "README.md"

[workspace.dependencies]
# Runtime (our own)
#
# `test-internals` STOPGAP (tracked follow-up): asupersync 0.3.4 moved the
# standalone capability-context constructors (`Cx::for_request`,
# `Cx::for_request_with_budget`, `Cx::for_testing*`) and the `Cx::set_current`
# /`RegionId::new_for_test`/`TaskId::new_for_test` helpers behind
# `#[cfg(any(test, feature = "test-internals"))]` to stop production code from
# minting fully-capable contexts out of band (asupersync br-asupersync-2x6hbi /
# -ovztin). FastMCP's current synchronous, thread-per-connection design mints
# such root/request contexts directly in its `run_*` entry points, request
# dispatch, the synchronous `Transport::close` path, the client config helpers,
# and the shipped `fastmcp_rust::testing` helpers — none of which run inside a
# `Runtime::block_on`, so `Cx::current()` is unavailable there. asupersync
# exposes NO public production replacement that synchronously yields a
# standalone, capability-bearing `Cx` (the blessed path,
# `Runtime::request_cx_with_budget`, is `pub(crate)`). The genuine fix is an
# architectural migration to runtime-managed contexts (wrap entry points in a
# runtime, obtain a genuinely owned child region once asupersync exposes that
# public primitive, and plumb `&Cx` into `Transport::close`). The current
# `Cx::scope()` and `Cx::scope_with_budget()` APIs remain in the same region and
# are not request-isolation substitutes. Until the upstream prerequisite is
# resolved, we opt into `test-internals` to keep the constructors visible.
# NOTE: `fastmcp-core::block_on` does NOT rely on this feature; it uses the
# ambient `Cx` installed by `Runtime::block_on`.
asupersync = { version = "=0.3.10", features = ["test-internals"] }
rich_rust = { version = "=0.2.2" }
# Safe readiness polling for interruptible Unix child-stdout reads and
# signal-free process-group existence probes after a managed leader is reaped.
# The non-Unix std::process pipe path remains explicitly frame-boundary-only.
rustix = { version = "=1.1.4", default-features = false }

# Serialization (only these)
serde = { version = "=1.0.229", features = ["derive"] }
# FND-01 ROOT-SERDE-JSON: exact version + arbitrary_precision for protocol numbers
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
serde_yaml = { version = "=0.9.34" }

# Logging (facade only, zero-cost when disabled)
log = { version = "=0.4.33" }

# Opaque cursor encoding for pagination
base64 = { version = "=0.22.1" }
# FND-01 ROOT-SEMVER (facade evidence / future gates; CLI must not depend on this)
semver = { version = "=1.0.28" }
# FND-01 ROOT-FLATE2 (facade evidence / supply archive paths)
flate2 = { version = "=1.1.9" }

# Date/time
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }

# File watching
notify = { version = "=8.2.0" }
glob = { version = "=0.3.4" }

# Console output
console = { version = "=0.16.4" }

# Configuration file parsing
toml = { version = "=1.1.3" }
dirs = { version = "=6.0.0" }

# FND-01 foundation pins (exact feature surfaces)
url = { version = "=2.5.8", default-features = false, features = ["std"] }
getrandom = { version = "=0.4.3", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
hmac = { version = "=0.12.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc", "derive"] }
# FND-01 ROOT-RING-EVIDENCE / JOSE RS256 (alloc only on the direct edge)
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }
# FND-01 ROOT-PROC-MACRO2-EVIDENCE (facade evidence harness)
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }
# Resolve the public facade (including dependency renames) from procedural
# macro expansion sites instead of assuming downstream crate names.
proc-macro-crate = { version = "=3.5.0" }
# Capability-relative filesystem access.  Keep this surface exact: built-in
# filesystem resources must traverse and open beneath retained directory
# handles instead of validating a pathname and reopening it later.
cap-std = { version = "=4.0.2", default-features = false }
cap-fs-ext = { version = "=4.0.2", default-features = false, features = ["std"] }

# Regex (JSON Schema `pattern` validation)
regex = { version = "=1.13.1" }

# CLI argument parsing
clap = { version = "=4.6.4", features = ["derive", "env", "wrap_help"] }

# Testing
trybuild = { version = "=1.0.118", default-features = false }

# Internal crates
fastmcp-rust = { version = "0.3.2", path = "crates/fastmcp" }
fastmcp-core = { version = "0.3.2", path = "crates/fastmcp-core" }
fastmcp-transport = { version = "0.3.2", path = "crates/fastmcp-transport" }
fastmcp-protocol = { version = "0.3.2", path = "crates/fastmcp-protocol" }
fastmcp-server = { version = "0.3.2", path = "crates/fastmcp-server" }
fastmcp-client = { version = "0.3.2", path = "crates/fastmcp-client" }
fastmcp-derive = { version = "0.3.2", path = "crates/fastmcp-macros" }
fastmcp-console = { version = "0.3.2", path = "crates/fastmcp-console" }
fastmcp-cli = { version = "0.3.2", path = "crates/fastmcp-cli" }

[workspace.lints.rust]
unsafe_code = "forbid"
# Admit the FND-01 bootstrap harness custom cfg only; all other unexpected_cfgs
# remain fatal under -D warnings.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fnd01_bootstrap)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow these during early development
doc_markdown = "allow"
missing_const_for_fn = "allow"
doc_link_with_quotes = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
uninlined_format_args = "allow"
unused_self = "allow"
cast_precision_loss = "allow"
format_push_string = "allow"
needless_continue = "allow"
map_unwrap_or = "allow"
cast_possible_truncation = "allow"
similar_names = "allow"
must_use_candidate = "allow"
cast_lossless = "allow"
return_self_not_must_use = "allow"
match_same_arms = "allow"
collapsible_if = "allow"
clone_on_copy = "allow"
match_wildcard_for_single_variants = "allow"
manual_assert = "allow"
if_not_else = "allow"
trivially_copy_pass_by_ref = "allow"
struct_excessive_bools = "allow"
should_implement_trait = "allow"
vec_init_then_push = "allow"
unreadable_literal = "allow"
ref_option = "allow"
manual_pattern_char_comparison = "allow"
implicit_clone = "allow"
decimal_bitwise_operands = "allow"
cast_sign_loss = "allow"
needless_pass_by_value = "allow"
field_reassign_with_default = "allow"
# Additional pedantic lints allowed for early development
cast_possible_wrap = "allow"
assigning_clones = "allow"
derivable_impls = "allow"
manual_div_ceil = "allow"
manual_split_once = "allow"
unchecked_time_subtraction = "allow"
redundant_closure_for_method_calls = "allow"
missing_fields_in_debug = "allow"
manual_let_else = "allow"
single_match_else = "allow"
len_zero = "allow"
needless_borrows_for_generic_args = "allow"
io_other_error = "allow"
mut_range_bound = "allow"
ptr_arg = "allow"
approx_constant = "allow"
manual_string_new = "allow"
redundant_else = "allow"
unnecessary_unwrap = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
too_many_lines = "allow"
items_after_statements = "allow"
