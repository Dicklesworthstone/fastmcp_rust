# FND-02 authoritative source registry.
#
# Every input the traceability checker reads is bound here by its Git blob
# identity -- `git hash-object <path>` -- and the checker re-derives that
# identity from the bytes on disk on every run.
#
# Blob identity, not commit SHA, deliberately: `main` is rebased in this
# repository, so a commit SHA stops resolving while the content it named is
# untouched. A blob hash addresses the bytes themselves.
#
# When one of these files legitimately changes, the gate turns red. That is
# the mechanism working, not a defect: a changed authority means the trace
# rows derived from it must be re-reviewed before the binding is updated.
# Never refresh a binding to force green -- that is precisely the failure
# FND-01's six silently-stale bindings demonstrated.

