# FND-02 requirement trace table.
#
# One row maps one observable requirement clause to the implementation and the
# tests that are supposed to demonstrate it. Thirteen fields are recorded on
# every row and all of them are checked.
#
# `covers_item` must name an item the authoritative corpus actually contains.
# The corpus is parsed on every run -- the 2026-07-28 changelog's Major and
# Minor items, plus the frozen upstream conformance scenarios -- rather than
# frozen as a count, because a count is a measurement of mutable content and
# measurements rot. Coverage is checked as an exact set in both directions, so
# a row covering a vanished item and an item with no row are both failures.
#
# `source_revision` carries an exact immutable revision. An `auth:` prefix
# routes the row through the authorization rule, where a floating "OAuth 2.1"
# is rejected: a clause inherited from -13 is not the same clause in -14.
#
# `positive_test_id` and `negative_test_id` name the owning package's frozen
# canonical test IDs. This table records the contract; it does not yet assert
# that each named test exists and runs -- see the submission note on that gap.

schema = "fnd-02-trace-table-v1"

