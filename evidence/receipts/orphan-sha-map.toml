# Orphaned-commit-sha map for batch-verify receipts.
#
# WHY THIS FILE EXISTS. Two history rewrites left commit shas cited in bead receipts
# unreachable from HEAD. The content survived; the names did not. Receipts are NOT edited:
# a receipt records what was verified when it was written, and rewriting its shas would
# make it say something the verification never said. This map is ADDITIVE and is joined
# against by orphan sha.
#
# HOW TO USE IT. Given an unreachable sha in a receipt, look it up under [[twinned]] and
# read `twin`. Verify the pairing yourself rather than trusting it:
#     git show <orphan> | git patch-id --stable
#     git show <twin>   | git patch-id --stable
# Both must print the `patch_id` recorded on the row. Include a pair you expect to DIFFER
# in any such check: an errored comparison returns empty==empty and reports every pair
# equivalent, which is the failure mode this file is most likely to be read through.
#
# URGENCY. The orphans currently resolve as dangling objects and are readable today. They
# are garbage-collectable. After a `git gc` the left-hand column becomes unresolvable and
# this map becomes the only record that the pairing was ever established.

