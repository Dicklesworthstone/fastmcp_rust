generated          = "2026-09-20"
generated_by       = "MagentaOsprey"
bead               = "bd-receipt-sha-orphan-map-j6ag2"
path_ruled_by      = "WildMountain"
head_at_generation = "28ecaeb6501671f4c5a05db7fd9dd5cce164fe73"

# METHOD, so every figure is re-derivable.
#   population : every bead in .beads/issues.jsonl (1130 records) - title, description,
#                close_reason and all comments; tokens matching [0-9a-f]{7,40}
#   resolution : git cat-file --batch-check  (2319 tokens -> 1090 commits)
#   reachability: membership in `git rev-list HEAD` (3074 commits) -> 188 unreachable
#   pairing    : git patch-id --stable over all 2997 patch-ids derivable from HEAD
#                (77 of 3074 commits yield none: merges and empties; 0 orphans are merges)
# CONTROLS THAT PASSED, without which the results above are not load-bearing:
#   discrimination : a deliberately mismatched pair (a93c9777 vs bf569927) -> DIFFERS
#   resolvability  : "deadbeefdeadbeef" -> fatal: Not a valid object name
#   citation reality: sampled orphans appear as prose citations ("MEASURED AT 20941c47")
# WITHDRAWN during derivation, recorded so the figures are not silently revised:
#   "113 twinless" - an artifact of a 900-commit patch-id window; full history moved 29
#                    of them to twinned. The twinless figure is 84.
#   "0 genuine losses" - a false zero from a zsh `[ "$a" \> "$b" ]` that errors rather
#                    than compares, defaulting every row to one branch.

[summary]
orphan_shas_total   = 188
beads_citing_orphan = 84   # closed 50, in_progress 14, review 11, open 8, deferred 1
twinned             = 104
twinless            = 84

