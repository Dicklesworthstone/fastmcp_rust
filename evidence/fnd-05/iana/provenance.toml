prefix = "2001:1::1/128"
name = "Port Control Protocol Anycast"
reason = "WAVE16 rulings #23 option (b): 2001::/23 (global=False) is denied whole, fail-closed, which also denies this global=True sub-allocation; reversible by a reviewed narrowing"

