[refresh_procedure]
# MANUAL AND HUMAN-DECIDED, never automated. RCH cannot fetch during a build and
# this repository forbids network dependencies, so an auto-refresh is both
# impossible and undesirable.
step_1 = "fetch both source_url values with the AGENTS.md user agent"
step_2 = "READ the retrieved documents; confirm registry_id, title and <updated> are present and the record counts are plausible"
step_3 = "diff against the vendored copies and REVIEW every added, removed or changed record on its merits"
step_4 = "update byte_length, sha256, registry_updated, record_count and retrieved_at here in the same change"
step_5 = "re-run the comparison; any newly admitted globally-unreachable prefix is a FINDING to be reported, never an entry to add to known_uncloseable_gap"
prohibition = "never refresh this snapshot to clear a failing gate (RH-3). A gate that goes red because the registry changed is the gate working; the correct response is to review the change and, where needed, close the classifier gap."
