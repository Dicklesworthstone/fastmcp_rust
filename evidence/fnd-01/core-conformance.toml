[derived_negative_policy]
algorithm_negative_requirement = "Derive one separately hashed, one-variable algorithm negative from a conforming RS256 baseline and preserve its exact provenance and diff."
raw_fixture_rule = "No raw negative, local derivative, or source-adjusted fixture may be labeled passing upstream conformance."
positive_requirement = "Stable or experimental auth claims require independent, nonempty RS256 real-peer positives."
real_peer_exclusions = [
  "in-process mock",
  "FastMCP issuer path",
  "source-adjusted conformance fixture",
  "loopback-cleartext waiver",
  "self-test against the same implementation",
  "test-only adapter",
]

[fixture_provenance]
adjacent_manifest = "evidence/fnd-01/core-conformance.toml"
vendored_root = "evidence/fnd-01/vendor/core"
policy = "Each vendored fixture is an unmodified upstream response body. Its adjacent artifact table records repository, immutable revision, upstream path, URLs, retrieval date, byte length, Git blob SHA-1, and SHA-256."
headers_added_to_vendored_bytes = false
reason_no_inline_header = "Adding a header would alter the authoritative upstream bytes and invalidate their checksums."

[manual_update]
review_required = true
floating_revision_allowed = false
source_rewriting_generator_allowed = false
steps = [
  "Open a reviewed evidence change that names the proposed immutable core and conformance revisions; never start from a default branch, rendered page, floating package range, or latest draft URL.",
  "Resolve the core tag with git ls-remote and resolve each repository commit and tree through the upstream Git object API.",
  "Fetch every artifact from its raw immutable commit URL without content transformation; retain the exact response body.",
  "Compute and record the byte length, SHA-256, upstream Git blob SHA-1, retrieval URL, source page URL, and UTC retrieval date before changing this manifest.",
  "Review semantic diffs for both schema.ts and schema.json against the currently frozen bytes. A generated-schema-only or TypeScript-only change is insufficient.",
  "Review the dated normative prose and changelog diff against the schema diff. Any final prose/schema conflict is a blocking upstream ambiguity.",
  "Review both auth source files and package.json at the proposed conformance revision. Re-enumerate exact scenario IDs and every check, skip, filter, xfail, forced incompatibility, weak oracle, and missing production-evidence category.",
  "Do not promote the conformance revision unless its vendored schema matches the final tagged schema and its traceability-backed 2026-07-28 scenario inventory is complete.",
  "Review the complete Section 5 ambiguity register and add, remove, or resolve entries only through a semantic evidence review.",
  "Add new immutable vendored paths rather than silently replacing prior evidence. Make repository changes only through apply_patch and never run a source-rewriting generator.",
  "Run TOML parsing, local byte/hash verification, Git blob verification, source-revision checks, exact error-code checks, exact scenario-inventory checks, provenance checks, and all drift negatives.",
  "Require maintainer review of schema, prose, conformance, ambiguity, and provenance diffs before changing the baseline or switching CI drift from warning to blocking.",
]

[verification]
local_sha256_command = "shasum -a 256 <vendored_path>"
local_byte_length_command = "wc -c < <vendored_path>"
remote_sha256_command = "curl --fail --silent --show-error --location <retrieval_url> | shasum -a 256"
remote_byte_length_command = "curl --fail --silent --show-error --location <retrieval_url> | wc -c"
git_blob_command = "curl --fail --silent --show-error --location <retrieval_url> | git hash-object --stdin"
core_tag_command = "git ls-remote https://github.com/modelcontextprotocol/modelcontextprotocol.git refs/tags/2026-07-28"
toml_parse_command = "python3 -c 'import pathlib,tomllib; tomllib.loads(pathlib.Path(\"evidence/fnd-01/core-conformance.toml\").read_text())'"
required_negative_cases = [
  "missing artifact",
  "swapped artifact paths",
  "truncated artifact",
  "wrong byte length",
  "wrong SHA-256",
  "wrong Git blob",
  "changed retrieval URL",
  "floating revision or latest URL",
  "missing provenance field",
  "duplicate or missing scenario ID",
  "missing, duplicate, or changed scenario-local declared check ID",
  "expected-success versus conditional-failure check-role mismatch",
  "incomplete transitive helper inventory mislabeled complete",
  "file-level auth scenario classification",
  "nonfatal missing cache header mislabeled as forced input",
  "empty-scope omission mislabeled as a forced signed-scope failure",
  "missing exact-issuer ID-JAG policy mislabeled as production-only evidence",
  "expected policy rejection mislabeled as upstream pass",
  "wrong final error code",
  "missing or duplicate Section 5 ambiguity entry",
]

