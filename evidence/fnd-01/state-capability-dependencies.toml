[[target_projection]]
candidate = "envelope"
targets = ["x86_64-unknown-linux-gnu", "x86_64-apple-darwin"]
static_delta = "cpufeatures is reachable through the x86-only chacha20 and poly1305 edges, but its libc edges are a lock-only false cross-product because they require aarch64/loongarch64. Ordinary x86 runtime dispatch reaches AVX512 when chacha20_avx512 is set; forced AVX512 additionally requires chacha20_backend=avx512 plus compile-time avx512f and avx512vl. AVX2/SSE2, poly1305 AVX2/autodetect, and cmov x86 assembly are also reachable; exact native cfg/codegen verification remains pending."
compile_verified = false

[[target_projection]]
candidate = "envelope"
targets = ["aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
static_delta = "chacha20 AArch64/NEON and cmov AArch64 assembly are statically reachable. cpufeatures and libc are not reachable because both parent cpufeatures edges are x86-only; exact native cfg/codegen and constant-time verification remains pending."
compile_verified = false

