[[prerequisites]]
id = "FND-04-P1"
name = "ambient-Cx-owned-child-region"
required_contract = "From an ambient &Cx, a public consumer can create a genuinely owned child region whose cancellation, close, drain, and quiescence are independent and observable."
status = "unresolved"
candidate_result = "fail"
release_consequence = "Blocks 0.3.10 release pin."
observations = [
  "Cx::scope documentation calls the implementation Phase 0 and says it binds to the current region.",
  "Cx::scope constructs Scope with self.region_id().",
  "Cx::scope_with_budget also constructs Scope with self.region_id().",
  "Cx::scope_with_budget_and_capability_budget delegates to scope_with_budget and preserves that scope's region_id().",
  "The APIs that actually call create_child_region_with_capability_budget_and_priority are Scope::region* and require &mut RuntimeState.",
]
source_ranges = [
  "src/cx/cx.rs:3707-3731",
  "src/cx/cx.rs:3733-3807",
  "src/cx/cx.rs:3810-3831",
  "src/cx/scope.rs:545-715",
]
minimum_acceptable_resolution = "A supported public API callable from ambient &Cx must create and own a distinct child region and expose cancellation plus close/drain/quiescence semantics without consumer access to RuntimeState."

[[prerequisites]]
id = "FND-04-P2"
name = "ambient-Cx-guaranteed-non-inline-bounded-blocking"
required_contract = "From the ambient &Cx available to FastMCP, a public bounded blocking facility is detectable and guarantees the closure does not execute inline on an async worker."
status = "unresolved"
candidate_result = "fail"
release_consequence = "Blocks 0.3.10 release pin."
observations = [
  "Cx::spawn_blocking documentation explicitly states that the closure runs inline when the Cx lacks a blocking-pool handle.",
  "Cx::spawn_blocking executes f(child) directly in the None arm.",
  "Cx::spawn_blocking_in has the same inline None arm.",
  "The pool-handle accessor is crate-private, so FastMCP cannot reliably preflight and reject the inline path through public API.",
  "Runtime- and RuntimeState-level blocking handles exist, but FastMCP deliberately receives only the consumer runtime's ambient &Cx and cannot recover either owner object from that context through public API.",
  "The free runtime spawn_blocking helper also runs inline for a current Cx without a pool.",
]
source_ranges = [
  "src/cx/cx.rs:4142-4188",
  "src/cx/cx.rs:4190-4223",
  "src/runtime/builder.rs:3547-3577",
  "src/runtime/builder.rs:3731-3765",
  "src/runtime/spawn_blocking.rs",
]
minimum_acceptable_resolution = "A public ambient-Cx API must either guarantee pool execution or return a detectable error before invoking the closure when no bounded blocking executor is available."

