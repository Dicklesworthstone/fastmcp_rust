release_consequence = "Blocks 0.3.10 release pin."
observations = [
  "ChildStdin is public, but its non-Unix poll_write and poll_flush return io::ErrorKind::Unsupported.",
  "ChildStdin poll_shutdown has no platform split and returns Poll::Ready(Ok(())) on every platform; it is not part of the Unsupported finding.",
  "ChildStdout and ChildStderr are public, but their non-Unix poll_read implementations return io::ErrorKind::Unsupported.",
  "Windows wait_with_output documents that std::process anonymous pipes are blocking and drains stdout/stderr on bounded helper threads.",
  "spawn_process_output_reader creates a distinct std::thread for each captured stream.",
  "The exact archive's public API inventory contains child-process pipe accessors but no own-process async stdin/stdout adapter.",
]
