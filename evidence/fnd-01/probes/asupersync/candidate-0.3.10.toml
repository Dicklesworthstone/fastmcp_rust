name = "cross-platform-own-and-child-process-async-stdio"
required_contract = "Public cancel-aware own-process and spawned-child stdin/stdout work on Linux, macOS, and Windows without private drivers, test-only internals, per-stream threads, or blocking-pipe fallbacks."
status = "unresolved"
