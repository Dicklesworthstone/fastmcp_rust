[[ambiguities]]
id = "section-5.6-auth-profile-wire-negotiation"
source_artifacts = [
  "mcp-enterprise-managed-authorization",
  "mcp-oauth-client-credentials",
  "conformance-enterprise-managed-authorization",
  "conformance-client-credentials",
]
decision = "Treat the commit-pinned repository prose as the profile wire authority. Select both profiles through local OAuth deployment policy plus exact authorization-server metadata, never an invented MCP core capability. Follow the metadata/harness HTTP Basic interpretation for client credentials."
must_reject = [
  "Registering, advertising, requiring, or parsing an invented io.modelcontextprotocol core extension capability for either profile.",
  "Promoting rendered-document identifiers from tracked drift evidence to normative wire authority.",
  "Sending client_id, client_secret, or both in the client-credentials token request body, or combining body credentials with HTTP Basic.",
  "Trailing-slash normalization of the private_key_jwt assertion audience, or omission of bounded exp and unique jti controls.",
  "Treating stable enterprise authorization and experimental client credentials as one profile or as core MCP conformance.",
  "Omitting the first token exchange resource without explicit single-resource configuration that binds the canonical MCP resource through ID-JAG validation and the final access-token audience policy.",
]

[[ambiguities]]
id = "section-5.24-id-jag-response-grants"
source_artifacts = ["id-jag-04", "mcp-enterprise-managed-authorization"]
decision = "Require the composed EnterpriseAccessTokenResponse overlay after generic OAuth admission: one required JSON string resource equal to the exact canonical MCP resource, and explicit final scope when nonempty."
distinct_scope_sets = [
  "RequestedEnterpriseScopeSet: the one bounded literal set frozen before the first exchange",
  "G: the distinct bounded literal set granted and signed by the IdP",
  "FinalGrantedEnterpriseScopeSet: the distinct bounded literal set granted by the resource authorization server",
]
scope_invariants = [
  "For a nonempty request, G is nonempty, signed in the ID-JAG, and a literal subset of RequestedEnterpriseScopeSet.",
  "For an empty request, the ID-JAG scope claim and first-stage top-level scope are absent.",
  "The first-stage top-level scope may be absent only when G exactly equals the nonempty requested set; after narrowing it is present and exactly equals G.",
  "For a nonempty final grant, stage-two scope is present, equals FinalGrantedEnterpriseScopeSet, and is a literal subset of G.",
  "For an empty final grant, stage-two scope is absent.",
]
must_reject = [
  "Missing, null, boolean, number, array, object, duplicate, additional, noncanonical, or textually foreign stage-two resource.",
  "Missing signed ID-JAG scope or a zero-scope grant for a nonempty request.",
  "Signed scope on an empty request, or empty, malformed, mismatched, broadened, or unrequested scope at either stage.",
  "Omitted first-stage top-level scope after IdP narrowing, or a top-level scope differing from signed G.",
  "Omitted stage-two scope for a nonempty final grant, a final scope not a literal subset of G, or any stage-two scope for an empty final grant.",
  "Omitting stage-two resource because an admitted single-resource mapping allowed first-stage resource omission.",
  "Using the examples' omissions to override the ID-JAG -04 Section 4.4.1 grant requirement.",
]

[[ambiguities]]
id = "section-5.25-enterprise-cimd-revision"
source_artifacts = ["cimd-00", "mcp-enterprise-managed-authorization"]
decision = "Ordinary core OAuth uses CIMD -00. Stable enterprise authorization uses exact issuer-bound preregistration for all three relationships and admits neither URL-form/portable CIMD nor DCR."
must_reject = [
  "Applying core CIMD -00 semantics to an enterprise URL-form client ID.",
  "Silently substituting the enterprise profile's linked CIMD -01 for final-core CIMD -00.",
  "Portable CIMD reuse, DCR, mixed registration origins, or one registration standing in for another.",
]

[[ambiguities]]
id = "section-5.26-oidc-invalid-client-status"
source_artifacts = ["oidc-core-errata2", "oauth-2.1-13"]
decision = "Admit a closed client-side transport variant: HTTP 400 with an admitted OIDC/OAuth token-error body, or HTTP 401 only for invalid_client after Basic authentication and exactly one unambiguous matching Basic challenge. Other syntactically valid bounded non-Basic challenge schemes may coexist."
scope = "client-admission-only"
fastmcp_emitter_may_inherit = false
must_reject = [
  "Any other code/status pair as a typed denial.",
  "A malformed, duplicate-bearing, oversized, or otherwise unadmitted token-error body at either admitted status.",
  "Zero, multiple, or conflicting matching Basic challenges on the HTTP 401 variant.",
  "Describing either admitted peer variant as satisfying both conflicting server-side mandates.",
  "Fallback, credential reuse, browser retry, or token commit after either denial.",
]

