[update_policy]
manual_review_required = true
steps = [
  "Retrieve each candidate from its exact primary URL with identity content encoding and no redirect.",
  "Record effective URL, response status, exact byte length, SHA-256, retrieval date, title, and revision.",
  "Review the semantic diff against the currently pinned bytes before changing any artifact table.",
  "Review clause routing, delegated authority, all three scenario classifications, and every substitution negative.",
  "Never update a digest alone, never follow a floating latest page, and never use a source-rewriting generator.",
]

[license_profiles]
mcp-repository-transition = "The pinned MCP repository LICENSE states that specifications and new code are Apache-2.0, documentation contributions excluding specifications are CC-BY-4.0, and unrelicensed historical contributions remain MIT; source-specific historical contribution status is not inferred beyond that primary notice."
ext-auth-mit = "MIT License, Copyright (c) 2025 Model Context Protocol, from the pinned ext-auth LICENSE."
ietf-trust-legal-provisions = "The primary IETF/RFC artifact's IETF Trust copyright and Legal Provisions notice; no broader license claim is inferred."
openid-foundation-final-specification = "OpenID Foundation Final Specification Agreement and the artifact's OpenID Foundation copyright notice, limited to the three exact Final errata-set-2 artifacts."
openid-foundation-implementers-draft = "The exact Enterprise Extensions 1.0 draft 01 artifact's Appendix B notice: OpenID Foundation grants the stated non-exclusive, royalty-free worldwide copyright license for this Implementers Draft and related implementation/specification purposes. This is not the Final Specification Agreement."
oasis-rights-notice = "Copyright © OASIS Open 2005. All Rights Reserved., exactly as stated in the OASIS source artifact; no permissive license is invented."
w3c-document-use-rules = "W3C copyright notice and document-use rules linked by the W3C Recommendation; no alternate rights grant is inferred."
conformance-repository = "Pinned official conformance repository source used only as non-normative verification input; it supplies no authorization authority or capability credit."

[license_profile_coverage]
mcp-repository-transition = [
  "mcp-repository-license-2026-07-28",
