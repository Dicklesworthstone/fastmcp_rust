[vendor_snapshot]
path_glob = "evidence/fnd-01/vendor/auth/*"
present_artifact_count = 0
status = "No auth vendor object is present in the worktree. This pass therefore binds every authority only through its exact primary retrieval URL, revision, identity-coded byte length, and SHA-256. The remote digest is not local content-addressed storage, CAS, or offline-body-rehash evidence."
capability_credit = false

[saml_chain]
status = "authority-frozen; implementation and qualification remain separately owned"
accepted_initial_identity_forms = ["OIDC ID Token", "SAML assertion"]
saml_authorities = [
  "saml-core-2.0-os",
  "saml-bindings-2.0-os",
  "saml-profiles-2.0-os",
  "saml-metadata-2.0-os",
  "xml-signature-1.1",
]
steps = [
  "Validate the configured enterprise SAML assertion against metadata, signed XML, issuer, subject, audience, recipient, ACS, conditions, time bounds, one-use/replay, and organization policy before credential exchange.",
  "Use RFC 8693 with the admitted SAML subject-token type and bounded request policy to obtain the refresh token required by this profile branch.",
  "Use that refresh token under the frozen profile policy to request the ID-JAG; preserve issuer, audience, subject, resource, lifetime, rotation, revocation, and replay provenance across the transition.",
  "Use the ID-JAG under RFC 7523's JWT-bearer assertion rules for the final MCP access-token exchange.",
]

[[saml_chain.stages]]
order = 1
input_type = "SamlAssertion"
output_type = "ValidatedSamlIdentityAssertion"
authority_artifacts = ["saml-core-2.0-os", "saml-bindings-2.0-os", "saml-profiles-2.0-os", "saml-metadata-2.0-os", "xml-signature-1.1"]
required_validation = "metadata-pinned XML signature, issuer, subject, audience, recipient, ACS, conditions, one-use/replay, and organization-policy validation"

[[saml_chain.stages]]
order = 2
input_type = "ValidatedSamlIdentityAssertion"
output_type = "RefreshToken"
authority_artifacts = ["rfc-8693", "rfc-8707"]
operation = "typed SAML subject-token exchange under an exact requested-token-type, resource, and bounded request policy"

[[saml_chain.stages]]
order = 3
input_type = "RefreshToken"
output_type = "IdJag"
authority_artifacts = ["mcp-enterprise-managed-authorization", "id-jag-04", "identity-chaining-12", "rfc-8693", "rfc-8707"]
operation = "refresh-token-mediated ID-JAG request retaining issuer, audience, subject, resource, lifetime, rotation, revocation, and replay provenance"

[[saml_chain.stages]]
order = 4
input_type = "IdJag"
output_type = "McpAccessToken"
authority_artifacts = ["rfc-7523", "rfc-6750", "rfc-8707"]
operation = "typed JWT-bearer assertion exchange for the final resource- and audience-bound MCP access token"
forbidden_substitutions = [
  "OIDC/SAML identity substitution before branch-specific validation",
  "direct SAML assertion to final MCP access-token shortcut",
  "unsigned assertion, signature wrapping, duplicate identifier, weak algorithm, metadata drift, entity confusion, recipient/ACS/audience mismatch, invalid conditions, expired/early/replayed assertion",
  "treating any frozen authority or chain declaration as runtime, production, or release capability credit",
]

[verification_tests]
positive_test_id = "ordinary::fnd_01_auth_sources_positive"
planted_negative_test_id = "ordinary::fnd_01_auth_sources_planted_negative"
validator_owner = "bd-mcp-2026-07-28-support-ahet.1.4"
exact_test_owner = "bd-mcp-2026-07-28-support-ahet.1.4"
central_rebind_owner = "bd-mcp-2026-07-28-support-ahet.1.14B"
central_rebind_scope = "settled authority-table rebind only; it owns neither source authority decisions nor either exact test's contract"
execution_status = "validator and exact tests landed in crates/fastmcp/tests/fnd_01_dependency_evidence.rs as ordinary::fnd_01_auth_sources_positive and ordinary::fnd_01_auth_sources_planted_negative; central batch verification owns unfiltered discovered==started==passed"
required_execution_rule = "Both exact tests must be discovered, started, and passed with no ignored, filtered, skipped, xfail, or cancelled result before batch-pending credit."
positive_contract = "Validate the exact required authority set, URL/revision/path/date/length/SHA-256/license-profile/maturity values, repository-flow plus official-overlay precedence, empty settings, two exact identifiers, OIDC and SAML chain coverage, OAuth 2.1/CIMD routing, and Draft client-credentials maturity."
planted_negative_contract = "Change exactly one authority, maturity, identifier, scenario, chain edge, source revision, byte length, digest, license-profile coverage, or settings fact and require a typed source-integrity rejection."
capability_credit = false

[client_secret_transport_conflict]
status = "frozen unresolved Draft-profile clause conflict; no unqualified draft conformance claim"
body_example_authority = "mcp-oauth-client-credentials-overlay-2026-07-28: its illustrative sequence states client_id + client_secret in the token request body"
basic_advertisement_authority = "mcp-oauth-client-credentials: token_endpoint_auth_methods_supported must include client_secret_basic or private_key_jwt"
basic_transport_authority = "rfc-6749: client_secret_basic is HTTP Basic client authentication, not a combined body-credential method"
conflict = "The dated overlay's body-credential illustration and the Draft profile's client_secret_basic advertisement cannot be silently collapsed into one wire behavior."
admitted_resolution = "When the selected registered method is client_secret_basic, send exactly HTTP Basic credentials and omit client_id and client_secret form members; record the overlay-body divergence as a named profile deviation. No body-plus-Basic combination is admitted."
draft_conformance_claimed = false
required_runtime_receipt = "A future real-peer receipt must identify the selected method, exact authorization-server metadata, outbound header/body shape, deviation identifier, and first typed rejection for an attempted body-plus-Basic mutation."

[phase_b_authority_table]
owner = "bd-mcp-2026-07-28-support-ahet.1.4"
compiler = "Compile a fresh in-memory row table from every [[artifacts]] record; never accept a copied constant, manifest self-hash, fixture label, process artifact, or a table supplied by the test as proof."
expected_row_count = 39
row_key = "id"
required_dimensions = ["id", "group", "title", "title_source", "status", "revision", "published_on", "retrieval_url", "retrieved_on", "format", "byte_length", "sha256", "content_address", "storage", "license_profile", "authority", "must_not_substitute"]
optional_dimensions_when_present = ["source_path", "rendered_url", "git_blob", "scenario_ids", "html_title"]
full_input_canonicalization = "For source-order rows, encode each required dimension as ASCII field-name, 0x00, the exact one-line TOML scalar right-hand-side token, 0x00; terminate each row with 0x0A; SHA-256 the resulting bytes. Optional dimensions are excluded from this digest and must be validated independently when present."
full_input_digest = "59d0b88301e3ea72b0ac7d672c6ee54aeeab78d8e72bb6c6e3d2f072d3e6d5d1"
reacceptance_rule = "Phase B recomputes the full-input digest from live manifest rows before every positive and planted-negative evaluation; any source, row-count, or digest drift is E_AUTH_REACCEPTANCE_REQUIRED and cannot be accepted dynamically."
stable_typed_diagnostic_format = "FND01|Error|E_AUTH_<DIMENSION>|<artifact-id>|<field>"
stable_typed_diagnostic_codes = ["E_AUTH_ROW_SET", "E_AUTH_ID", "E_AUTH_GROUP", "E_AUTH_IDENTITY", "E_AUTH_REVISION", "E_AUTH_DATE", "E_AUTH_URL", "E_AUTH_LENGTH", "E_AUTH_SHA256", "E_AUTH_CONTENT_ADDRESS", "E_AUTH_STORAGE", "E_AUTH_LICENSE", "E_AUTH_MATURITY", "E_AUTH_AUTHORITY", "E_AUTH_SUBSTITUTION", "E_AUTH_WIRE_PATH", "E_AUTH_CHAIN", "E_AUTH_REACCEPTANCE_REQUIRED"]
one_field_negative_rule = "For every compiled authority row and every required dimension, start from a reaccepted baseline, mutate exactly one field, assert the corresponding stable typed diagnostic and no extra acceptance, then recompute and reaccept the untouched baseline."
positive_rule = "Validate all compiled rows, exact wire-path tables, Draft maturity, nonnormative scenario classification, typed SAML chain, client-secret conflict resolution, and remote-only provenance without performing network retrieval or claiming local-body proof."
