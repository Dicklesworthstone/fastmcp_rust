incoming_cursor_rule = "unwrap only a bounded Host-issued cursor whose complete binding tuple matches the current bridge"
final_core_validation_rule = "validate and retain the complete exact final-core list result before any cursor preparation"
no_upstream_continuation_rule = "when upstream nextCursor is absent, create no prepared or committed Host record and charge no cursor quota"
prepared_record_visibility = "invisible, non-live, non-consumable, and not exposed to the View"
prepared_record_contents = "exact upstream nextCursor plus a fresh opaque Host handle bound to every binding dimension"
substitution_rule = "copy the complete validated page and replace only upstream nextCursor with the fresh Host handle before projection"
projection_rule = "run AppsSdk29Projection and the official SDK parse/lossless comparison exactly once over the complete substituted page"
comparison_baseline = "the substituted Apps-facing page, never the unmodified final-core page"
retained_projection_rule = "retain the one exact projected value and place only that value in a fresh correlated Apps response"
encoding_rule = "encode the complete fresh Apps response after successful projection and before output reservation"
reservation_rule = "reserve the complete bounded response capacity only after projection, official comparison, and encoding succeed"
atomic_commit_rule = "in one short commit after reservation, make the prepared cursor record live, charge its quota, and make the already encoded response sendable"
abort_rule = "projection, official parse/comparison, encoding, reservation, cancellation, or teardown failure aborts the prepared record with no live record, quota charge, cursor exposure, cursor consumption, or sendable response"
post_projection_cursor_mutation = "forbidden"
identity_translation_rule = "HostCursorSubstitution is explicit identity translation, not unknown-field stripping and not equality with the unmodified core page"
permitted_projection_loss = "only the separately enumerated optional unsafe Resource or ResourceLink size omission"
forbidden_crossing = ["upstream envelope", "upstream ID", "upstream metadata", "raw upstream cursor", "Tasks state", "MRTR state", "core progress token", "Apps progress token"]
negative_cases = [
  "method or result outside the exact three-bridge inventory",
  "record or quota creation when upstream continuation is absent",
  "unbound, reused, cross-View, cross-method, cross-principal, cross-server, or cross-revision handle",
  "raw upstream cursor emitted or prepared handle exposed before atomic commit",
  "projection before substitution, more than one projection or official parse, or comparison against the unmodified core page",
  "response reservation or state commit before successful projection and encoding",
  "cursor record without quota, quota without cursor record, or response sendable before the same atomic state commit",
  "any failure that leaves a live record, consumes or exposes a cursor, charges quota, or emits a response",
  "post-projection cursor mutation, a second projection after mutation, or silent page shortening",
  "envelope ID metadata progress Tasks MRTR or raw-cursor crossing",
  "send cancellation or teardown race that yields a partial cursor/quota/response commit",
]

[[apps.host_cursor_step]]
order = 1
name = "prepare"
rule = "retain present upstream nextCursor only in a prepared invisible record and allocate a fresh fully bound Host handle; absent continuation takes the no-record path"

[[apps.host_cursor_step]]
order = 2
name = "substitute"
rule = "place the fresh Host handle into a copied complete Apps-facing page before projection; never place the raw upstream cursor there"

[[apps.host_cursor_step]]
order = 3
name = "single-project"
rule = "run exactly one AppsSdk29Projection, official SDK parse, lossless comparison, and policy revalidation over the substituted page; retain the projected value"

[[apps.host_cursor_step]]
order = 4
name = "encode-and-reserve"
rule = "encode a fresh correlated response containing the retained projection, then reserve its complete bounded output capacity"

[[apps.host_cursor_step]]
order = 5
name = "atomic-cursor-quota-commit"
rule = "atomically commit the prepared cursor record and quota charge while making the already encoded response sendable; abort everything on any precommit failure"

