encoded_limit_applies_before = ["type-specific decode", "normalization", "correlation"]
string_domain = "complete quoted and escaped token fits the encoded limit; decoded bounded UTF-8 value is retained and echoed exactly"
numeric_domain = "mathematical integer in inclusive [-9007199254740991, 9007199254740991]"
numeric_aliases = ["1 == 1.0 == 1e0", "signed zero == unsigned zero"]
