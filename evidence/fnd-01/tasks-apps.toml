response_id = "required exact retained AppsRequestId"
outer_response_closed = true
inner_error_closed = true
code_domain = "mathematical integer in inclusive [-9007199254740991, 9007199254740991]"
code_alias_equality = "exact mathematical integer value"
local_code_emission = "canonical ordinary base-10 integer spelling"
message = "required bounded non-null string"
data = "optional presence-aware recursively bounded AppsJsonValue, including explicit null"
