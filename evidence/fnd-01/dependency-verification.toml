union_only_registry_encoding = "ASCII FND01BOOTSTRAPUNIONv1 followed by NUL, u32be 38, then the same full-row encoding for only verifier_dependency=false rows while retaining each original 45-row ordinal and terminal false byte"
union_only_registry_bytes = 3779
