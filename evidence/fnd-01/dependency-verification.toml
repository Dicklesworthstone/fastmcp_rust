[workspace_manifest_integration_contract]
root_manifest_path = "Cargo.toml"
toolchain_path = "rust-toolchain.toml"
workspace_resolver = "3"
workspace_package_version = "0.3.2"
workspace_package_edition = "2024"
workspace_package_rust_version = "1.99"
workspace_package_license = "MIT"
member_count = 9
member_package_ids = ["fastmcp-cli", "fastmcp-client", "fastmcp-console", "fastmcp-core", "fastmcp-derive", "fastmcp-protocol", "fastmcp-rust", "fastmcp-server", "fastmcp-transport"]
root_manifest_rule = "parse the workspace_snapshot root Cargo.toml as strict duplicate-key-free TOML; require [workspace].resolver exact string 3, exactly nine existing member paths resolving to member_package_ids, and [workspace.package] version/edition/rust-version/license exact values above; integer resolver, resolver 2, rust-version 1.85, omitted/inherited-from-elsewhere values, unknown duplicate tables, or a member identity mismatch fails before any Cargo command"
member_manifest_rule = "parse all nine exact member Cargo.toml files and require package.version.workspace, edition.workspace, rust-version.workspace, and license.workspace exactly true with no local value or package-level override; their effective values therefore equal the one root workspace package contract"
toolchain_relationship_rule = "require toolchain_path raw bytes exactly `[toolchain]\\nchannel = \"nightly-2026-07-11\"\\nprofile = \"minimal\"\\ncomponents = [\"rustfmt\", \"clippy\"]\\ntargets = [\"aarch64-apple-darwin\", \"aarch64-unknown-linux-gnu\", \"x86_64-apple-darwin\", \"x86_64-pc-windows-msvc\", \"x86_64-unknown-linux-gnu\"]\\n`; reject BOM, CR/CRLF, comments, duplicate/reordered keys or array members, alternate whitespace/quoting, missing or extra targets/components, and trailing bytes. The selected cargo executable's own complete verbose self-report release `1.99.0-nightly`, commit-hash `59800466c5c41c444d264b1010b4d57e85a7117f`, commit-date `2026-07-07`, host `x86_64-unknown-linux-gnu`, and retained library/platform fields is the Cargo identity authority; the separately selected rustc executable's complete verbose self-report binds commit-hash `375b1431b7d89d1c2e2bc168c011848ae12b7d14` and LLVM version `22.1.8`. A rustup distribution manifest `0.99.0` label is component metadata only and cannot override either executable self-report. This binds the MSRV 1.99 declaration to the dated evidence toolchain without claiming stable-1.99 compatibility beyond Cargo's declared rust-version"
resolver_authority_rule = "resolver 3 is the sole final root/workspace, consumer, and projection authority; every resolver-2 graph is an immutable explicitly noncanonical comparison candidate used only to calculate resolver-delta evidence and can never be promoted into package, consumer, workspace-gate, or support decisions"
validation_phase = "role-entry-preflight before source snapshot acceptance, lock generation, package-list, metadata, build, test, or receipt output"

[integration_surface_contract]
purpose = "typed post-edit handoff contract for the shared URI/crypto ownership, JWT/RSA cleanup, eager CLI update-network removal, and arbitrary-precision JSON behavior owned by the FND-01 integration bead"
dependency_rule_count = 40
dependency_rule_exact_fields = ["id", "manifest_path", "table_scope", "dependency", "presence", "workspace_inherited", "version", "declaration_default_features", "declaration_features", "effective_default_features", "effective_features", "optional"]
dependency_rule_order = ["ROOT-ASUPERSYNC", "ROOT-SERDE-JSON", "ROOT-FLATE2", "ROOT-URL", "ROOT-GETRANDOM", "ROOT-HMAC", "ROOT-SHA2", "ROOT-SEMVER", "ROOT-ZEROIZE", "ROOT-RING-EVIDENCE", "ROOT-PROC-MACRO2-EVIDENCE", "ROOT-NO-UREQ", "ROOT-NO-REDIS", "CORE-URL", "CORE-GETRANDOM", "CORE-HMAC", "CORE-SHA2", "CORE-ZEROIZE", "SERVER-NO-URL", "SERVER-NO-GETRANDOM", "SERVER-NO-HMAC", "SERVER-NO-SHA2", "SERVER-NO-ZEROIZE", "SERVER-NO-JSONWEBTOKEN", "SERVER-NO-REDIS", "TRANSPORT-NO-URL", "TRANSPORT-NO-GETRANDOM", "TRANSPORT-NO-HMAC", "TRANSPORT-NO-SHA2", "TRANSPORT-NO-ZEROIZE", "FACADE-FLATE2-DEV", "FACADE-SHA2-DEV", "FACADE-TOML-DEV", "FACADE-SEMVER-DEV", "FACADE-RING-EVIDENCE-DEV", "FACADE-PROC-MACRO2-EVIDENCE-DEV", "FACADE-NO-JSONWEBTOKEN", "FACADE-NO-REDIS", "CLI-NO-UREQ", "CLI-NO-SEMVER"]
dependency_default_feature_domain = ["true", "false", "omitted", "not-applicable"]
manifest_rule = "parse every named workspace_snapshot manifest as strict duplicate-key-free TOML; a required root row must match its exact version, literal declaration default-feature state, declaration feature list, optional flag, source, and table; a required member row has exactly `{ workspace = true }` with version/default-features/features/package/path/git/registry/optional omitted unless the row explicitly says otherwise, and its effective default/features are then computed from the exact root declaration rather than inferred from the member syntax; an absent row forbids the dependency key and every alias whose package field names it in every dependency/dev/build/target-specific table selected by table_scope; loose versions, inherited feature suppression/addition, renamed/git/path/target substitution, or a second declaration fails"
source_rule_count = 19
source_rule_exact_fields = ["id", "path_scope", "match_kind", "pattern", "expected_count", "reason"]
source_rule_order = ["CORE-EXPORT-CRYPTO", "CORE-EXPORT-URI", "CORE-CRYPTO-SURFACE", "CORE-URI-SURFACE", "FACADE-EXPORT-CRYPTO", "FACADE-EXPORT-URI", "OAUTH-USES-CORE-CRYPTO", "OAUTH-NO-DIRECT-CRYPTO", "OIDC-ISSUANCE-FAIL-CLOSED", "OIDC-DISCOVERY-NO-SIGNER", "OIDC-NO-LOCAL-SIGNER", "WEBSOCKET-USES-CORE-MASK", "WEBSOCKET-NO-DIRECT-RNG", "NO-JSONWEBTOKEN-TOKENS", "NO-JWT-ENCODING-KEY", "NO-JWT-VERIFIER-SURFACE", "NO-DOCKET-PUBLIC-SURFACE", "NO-CLI-UPDATE-SYMBOLS", "NO-CLI-CRATES-IO-LITERAL"]
source_rule_match_kinds = ["token-sequence", "use-tree-member", "required-ident-set", "forbidden-ident-set", "ident", "exact-byte-substring", "exact-function-token-body"]
source_rule = "for an exact path or no-follow closed Rust path_scope, use static_source_classifier_contract's proc_macro2 parse; token-sequence and use-tree-member count exact structural matches, required-ident-set requires each comma-separated exact identifier at least once and sets expected_count to the number of distinct required identifiers, forbidden-ident-set requires every named identifier absent and has expected_count zero, ident counts exact identifier tokens, exact-byte-substring counts exact raw nonoverlapping byte occurrences, and exact-function-token-body resolves exactly one non-test free/impl function by name/signature and compares its recursively delimited TokenTree body to the pattern grammar with literal contents included; identifier rules never inspect comments or literal contents unless exact-function-token-body explicitly names a literal, no rule expands macros, expected_count is over the complete selected workspace_snapshot scope, and a parse failure, omitted/extra required match, excluded test/e2e file, or dynamically chosen scope fails"
manifest_feature_rule_count = 4
manifest_feature_rule_order = ["SERVER-NO-JWT-FEATURE", "SERVER-NO-REDIS-FEATURE", "FACADE-NO-JWT-FEATURE", "FACADE-NO-REDIS-FEATURE"]
manifest_feature_rule = "parse each exact manifest as strict duplicate-key-free TOML and require the named [features] key absent; the same spelling in any feature forwarding array, optional dependency feature, target feature table, or alias is also forbidden, while prose/comments are irrelevant; an empty feature, stub forwarding feature, renamed near-equivalent, or second table cannot preserve the removed public JWT surface"
production_graph_count = 10
production_graph_targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
production_graph_feature_modes = ["default", "all-features"]
production_graph_command_order = "target namespace order, and within target workspace-metadata-default then workspace-metadata-all-features"
production_graph_forbidden_package_ids = ["argon2", "jsonschema", "jsonwebtoken", "redis", "rsa", "ureq"]
production_graph_rule = "execute the two workspace metadata templates for every target, parse complete strict Cargo metadata JSON into production_graph_entry rows, require all workspace members and their exact target-filtered resolver closure, zero exact-name forbidden nodes, and every reachable serde_json 1.0.151 node to contain resolved feature arbitrary_precision; package aliases/substrings do not match, and a missing/extra graph or feature fails"
production_graph_identity_rule = "every raw Cargo packages[].id is first cross-validated against its package name/version/source/manifest path. Although the Cargo Book describes packages[] as unfiltered under --filter-platform, pinned Cargo commit 59800466c build_resolve_graph filters its package_map through the visited node_map; this executable-specific contract therefore requires an exact packages[]/resolve.nodes package-ID bijection and fails any extra or missing row rather than trusting the broader documentation. A crates.io raw ID is exactly registry+https://github.com/rust-lang/crates.io-index#<name>@<version>. An admitted path raw ID is exactly path+file://<absolute-package-root>#<fragment> under the closed ASCII URL-unreserved-plus-slash subset: fragment is <version> when the package-root final component equals package name byte-for-byte and otherwise <name>@<version>, matching pinned Cargo PackageIdSpec minimization; percent encoding, query, alternate scheme, or any other fragment fails. The role-independent graph package_id is then the exact registry raw ID for crates.io nodes, path+fnd01-workspace://<root-or-workspace-relative-package-root>#<name>@<version> for a path package beneath that command's workspace_root, or path+fnd01-repository://<repository-relative-package-root>#<name>@<version> for an admitted projection dependency beneath the checked producer repository root; no other path package root is admitted. Normalized source_locator is the exact registry locator for registry nodes, workspace:<root-or-relative-package-root> for workspace/root nodes, or repository:<relative-package-root> for repository path nodes. A nonnull resolve.root is source_kind root; every other source-less node is source_kind path. Pinned Cargo's optional metabuild field is an array of unique strings, including the empty array, and its optional hints object has exactly the serialized mostly-unused field whose bounded JSON value is retained without semantic inference. Every dependencies[].req is the exact canonical VersionReq::to_string output of semver 1.0.28, contains at most 32 intersection comparators, and matches the strict parsed resolved package version under VersionReq::matches; build metadata is ignored exactly as semver does, and req `*` with a prerelease target fails closed because Cargo metadata loses the distinction between an omitted OptVersionReq::Any and an explicit VersionReq::STAR. Every normalized graph package_id is unique, every graph edge endpoint resolves, repeated identical Cargo dep_kinds canonicalize to one edge, the virtual workspace has resolve.root null while package workspaces have the exact nonnull root, all required workspace member nodes occur in Cargo order, every retained nonmember node is reachable from a required member, and graph_sha256 uses receipt_contract.digest_rule"
ownership_rule = "fastmcp-core is the sole direct production owner of url/getrandom/hmac/sha2/zeroize and publicly exposes its crypto and URI modules through both fastmcp-core and fastmcp-rust; exact source-call rules prove the migrated OAuth/OIDC/WebSocket call sites use named sealed core APIs and contain no former direct-crate token path; server and transport have no direct duplicate crypto dependency; ring is separately pinned at the workspace root and consumed only by the facade's evidence-only dev target for FND-01 qualification vectors, never by a production FastMCP dependency table or public module in FND-01; production ring/JOSE ownership and public jose.rs exports belong to later PRT-01 work and are forbidden here; this proves the enumerated declaration/export/call-site/graph boundary, not semantic correctness of an unenumerated future caller"
jwt_signing_rule = "no selected Rust source token stream contains identifier jsonwebtoken or EncodingKey; the facade e2e/dev surface has no local jsonwebtoken signer, and no production graph contains jsonwebtoken or RustCrypto rsa; verification implementations using other dependencies are outside this narrow absence claim"
cli_network_rule = "fastmcp-cli has no direct ureq or semver, no identifiers should_check_for_updates/fetch_latest_crate_version/maybe_print_update_notice, and no exact crates.io update URL literal; therefore ordinary startup has no legacy eager update-check path, without claiming that every user-selected CLI subcommand is network-free"
serde_json_rule = "root serde_json is exactly 1.0.151 with direct feature arbitrary_precision and every member declaration is workspace-inherited without feature suppression; all ten production graphs prove the resolved feature, while verifier-dev arbitrary_precision is not misrepresented as the behavioral source"
claim_ceiling = "exact manifest/source-export/target-filtered-production-graph handoff closure only"

