[receipt_contract]
format_literal = "fastmcp-fnd-01-integration-receipt-v2"
schema_version_literal = 2
toml_receipt_count = 10
binary_output_count = 4
schema_dispatch = "exact kind to exactly one receipt_schema row; no default, flatten, alias, compatibility version, unknown table, or historical model"
schema_registry_encoding = "ASCII FND01RECEIPTSCHEMAv1 followed by NUL and u32be row count, then rows sorted by raw UTF-8 receipt_id bytes; each row is u32be-length-prefixed kind, receipt_id, and table_name, u32be exact_fields count followed by each u32be-length-prefixed field in declared order, u32be-length-prefixed cardinality_rule and semantic_rule, then one presence byte 0x00 when typed_result_owner_rule is absent or 0x01 followed by its u32be-length-prefixed bytes when present. Every count/length/addition is checked, no other presence byte or trailing canonical byte exists"
schema_registry_count = 10
schema_registry_bytes = 21571
schema_registry_sha256 = "1f35257726d51f960b760a646996fed4b70ec36a1b89cc5005b0020f9a54b324"
schema_registry_bound_rule = "the complete canonical registry must be nonempty and no larger than bounds.max_receipt_schema_registry_bytes before allocation; exact externally pinned count, byte length, and SHA-256 must match before schema_dispatch, and per-row checks cannot substitute for the total bound"
schema_registry_verifier_authority_rule = "the verifier pins the literal FND01RECEIPTSCHEMAv1 encoding, all ten rows including ordered fields and optional ownership branch, exact canonical byte length, and SHA-256 in compiled Rust. Policy mirror values never authorize a changed receipt kind, table, field, cardinality rule, semantic rule, or optional field. Separately, the verifier encodes the complete receipt_contract table as ASCII FND01RECEIPTCONTRACTv1 followed by NUL and exactly one recursively tagged TOML table using assertion_contract value tags: tag 0x07, u64be exact member count, members sorted by raw UTF-8 key bytes, each key as u32be length and bytes, booleans as tag 0x02 plus one 0-or-1 byte, integers as tag 0x03 plus i64be, strings as tag 0x05 plus u64be length and bytes, and arrays as tag 0x06 plus u64be item count and recursively tagged items in declared order. The complete encoding, including digest_rule and its FND01METAGRAPHv1 family, has independently compiled exact field-count, byte-length, and SHA-256 pins; no policy-declared mirror value, per-field check, TOML serialization, missing field, extra field, alternate order, or trailing byte authorizes drift."
common_required_fields = ["format", "schema_version", "receipt_id", "kind", "path", "generation_rank", "producer_bead", "producer_role", "run_id", "authoring_closure_sha256", "policy", "verifier", "harness", "source_tree_file_count", "source_tree_total_bytes", "source_tree_sha256", "evidence_verdict", "support_claim", "parent_count", "parent"]
common_field_rule = "format/schema equal literals; receipt_id/kind/producer/rank/path equal derived_output; run_id equals run_identity_contract; the three authoring bindings and closure equal the external authoring marker; source-tree fields equal source_tree; evidence_verdict is exact Pass; support_claim is false; parent is an exact ordered bijection to direct parents with purpose"
exact_field_union_rule = "for every receipt_schema, the receipt top-level keys are exactly common_required_fields union one table named table_name; inside that table keys are exactly receipt_schema.exact_fields; neither list excludes, overrides, flattens, aliases, or makes optional the other"
binary_rule = "the four binary outputs have no TOML envelope or self-asserted header fields beyond their binary contracts; the three build/output containers have dedicated sidecar receipt bindings, advisory-database has the dependency receipt's typed advisory_database binding, and integration-index independently binds raw length/hash while every named consumer parses the complete container"
candidate_rule = "candidate disposition is carried only by typed projection results and never substitutes for evidence_verdict: a rejected or unsupported candidate still requires Pass evidence for every applicable command, graph, policy, and mutation observation"
digest_rule = "every record-set digest uses ASCII FND01RECv2 followed by NUL, u32be record count, then for each canonical record u32be encoded-record length and the recursively tagged exact record bytes; receipt schema names the record type and no raw TOML reserialization is hashed. A canonical metadata graph digest uses ASCII FND01METAGRAPHv1 followed by NUL, then u32be byte length plus the complete FND01RECv2 target-graph-node record set in ascending complete node-row order, followed by u32be byte length plus the complete FND01RECv2 target-graph-edge record set in ascending complete edge-row order, with checked lengths and no trailing byte. Its path package IDs use workspace_manifest_integration_contract.production_graph_identity_rule normalization, so producer and independent-attester role roots cannot alter the digest. projection-result, resolver-delta-item, resolver-delta, and consumer-receipt name their exact constituent order and any additional domain-separated framing in their own schema/semantic rules; those rules are part of the digest authority rather than producer-selected encodings"
support_claim_must_be_false = true

[[receipt_schema]]
kind = "source_snapshot"
receipt_id = "source-snapshot"
table_name = "source_snapshot"
exact_fields = ["workspace_file_count", "workspace_total_bytes", "workspace_sha256", "workspace_binding", "source_input_count", "source_input", "source_family_count", "source_family", "archive_count", "archive", "quarantine_count", "quarantine", "closed_child_count", "closed_child", "authoring_count", "authoring", "set_digest_sha256"]
cardinality_rule = "workspace 163, source_input 68, source_family 9, archive 3, quarantine 19, closed_child 6, authoring 3; every array is the exact corresponding policy registry and set_digest binds all arrays"
semantic_rule = "checked_snapshot independently reads every byte, enforces exact source/workspace closure and exclusions, validates all local archive members and quarantine rows, and binds the external three-file authoring marker without hashing this receipt into its own input"

[[receipt_schema]]
kind = "producer_environment"
receipt_id = "producer-environment"
table_name = "producer_environment"
exact_fields = ["actual_worker", "bootstrap_control_plan", "tool_count", "tool", "environment_profile_count", "environment_profile", "proxy_count", "proxy", "target_tool_profile_count", "target_tool_profile", "external_input_root_count", "external_input_root", "advisory_database_source", "run_root", "acquisition_cargo_home", "offline_cargo_home", "acquisition_target_root", "execution_bin", "local_registry", "return_root", "quarantine_count", "quarantine", "process_ancestry_count", "process_ancestry", "process_ancestry_sha256", "environment_sha256"]
cardinality_rule = "one actual worker, one bootstrap control plan, all 20 tool-inventory IDs, six exact unexpanded environment profile snapshots, zero through four exact inherited acquisition proxy rows in canonical ALL_PROXY/HTTP_PROXY/HTTPS_PROXY/NO_PROXY order, five target-tool profiles, all five external-input roots, one dedicated advisory-database source observation, distinct acquisition/offline Cargo homes, acquisition target, checked execution-bin and sealed local-registry roots, all publication_contract quarantine candidates, and the exact observed bootstrap-to-controller process ancestry. Controller RCH identity, invocation, daemon pre-observation, outer exit/streams, and daemon post-observation are controller-owned and forbidden here"
semantic_rule = "distinguish requested RCH worker preference, which exists only in the controller-owned outer lifecycle, from actual checked Linux/x86_64 identity; bind tool/SDK files, closed execution PATH, exact generated roots/config, optional proxy values, ancestry, quarantine moves, advisory-database source directory identity and complete tree summary, and the pre-build bootstrap control plan. The advisory source is a dedicated observation rather than a sixth external compiler root, and its commit is an opaque label only. acquisition_cargo_home is the populated immutable online input, offline_cargo_home is distinct and contains neither acquisition cache nor discovered Cargo config, and every command expansion joins these records exactly. All controller lifecycle authority lives only in the FND01OUTERv2 producer/attester records or FND01GATEINPUTv1/FND01GATERESULTv3 gate pair, while completed bootstrap-control build/exec records live in command-results"

[[receipt_schema]]
kind = "supply_receipt"
receipt_id = "supply-receipt"
table_name = "supply_receipt"
exact_fields = ["bundle", "producer_pre_handoff_bundle", "returned_bundle", "bundle_parent_count", "bundle_parent", "bootstrap_manifest", "bootstrap_lock", "embedded_bootstrap_lock_byte_length", "embedded_bootstrap_lock_sha256", "bootstrap_package_count", "bootstrap_package", "downstream_union_package_count", "downstream_union_package", "control_only_package_count", "control_only_package", "entry_count", "derived_index_file_count", "crate_archive_count", "sparse_cache_input_count", "total_payload_bytes", "inner_entry_set_sha256", "closure_bijection_sha256", "entry", "acquisition_anchor_count", "acquisition_anchor", "acquisition_root_set_sha256", "sparse_parser_version", "downstream_union_package_set_sha256", "control_only_package_set_sha256", "bootstrap_package_set_sha256", "exact_union_equal", "entry_set_sha256"]
cardinality_rule = "bundle is the published supply-bundle output binding, producer_pre_handoff_bundle is the exact immutable producer seal, returned_bundle is the exact RCH-returned copy, and all three have equal nonzero byte length/SHA-256 under returned_bundle_rule; bundle_parent is the published output's exact two direct parent bindings/purposes. bootstrap_manifest is the exact canonical producer bootstrap Cargo.toml binding; bootstrap_lock, its embedded receipt scalars, and the dedicated FND01SUPPLYv4 header payload are byte-identical. bootstrap_package is the disjoint exact full-row union of downstream_union_package and control_only_package, with raw (name,version,checksum) ordering and exact_union_equal true; downstream_union_package_set_sha256, control_only_package_set_sha256, and bootstrap_package_set_sha256 are FND01RECv2 hashes over their complete supply-package rows in that declared order. entry_count is the checked sum of derived_index_file_count, crate_archive_count, and sparse_cache_input_count; tagged entries are the complete three-kind exact set with one 0x02 derived local-index file per package name, one 0x01 archive per triple, and one 0x03 untouched input per selected enclosing sparse-cache file. entry_set_sha256 is the receipt_contract.digest_rule FND01RECv2 record-set hash of every entry in declared order, except each row is encoded as tag 0x0b, the exact record_variant_schema ID, every required field in that variant's declared order, and every optional-field presence/value in declared order; no homogeneous schema substitution or raw TOML serialization is admitted. closure_bijection_sha256 equals the raw FND01SUPPLYv4 header field and independent recomputation; config.json exists only as the dedicated v4 header evidence payload, never as a tagged entry or materialized local-index input. acquisition_anchor is a separately tagged FND01RECv2 union with exactly 1 + sparse_cache_input_count + crate_archive_count rows in closed kind/path order: one sparse-config row, one sparse-cache row per 0x03 entry, and one crate-cache row per 0x01 entry. Every selected cache tuple and archive binding joins bijectively; acquisition_root_set_sha256 equals the complete producer-observed acquisition-home FND01BOOTSTRAPTREEv1 snapshot joined to the v4 header"
semantic_rule = "strict-parse but never rewrite each embedded acquisition sparse-cache optimized payload, select only locked duplicate-free JSON blobs in cached order, verify every selected yanked=false/checksum/archive and both closure directions, retain and reparse the exact bootstrap lock in the dedicated bundle header, derive exact LF-delimited local-registry index files, and rematerialize only the documented 0x01/0x02 config-less local-registry layout. Produce, Attest, and final verification recompute closure_bijection_sha256 from the embedded raw 0x03 payloads plus lock, derived-index, and archive bytes; no producer assertion authorizes it. Supply-package triple membership is joined exactly to that bootstrap lock and to the deduplicated union parsed from all 28 post-command lock payloads; the downstream set must be a subset of bootstrap and control-only must equal the set difference. Shared triples repeat byte-equivalent bootstrap-metadata package_id/features/dependency_kinds rows; those metadata fields require their separate strict Cargo-metadata authority and are never inferred from Cargo.lock. The 28 post-command locks are not falsely claimed at this pre-command rank and are instead retained in command-streams and typed in command-results"

[[receipt_schema]]
kind = "command_results"
receipt_id = "command-results"
table_name = "command_results"
exact_fields = ["streams", "streams_parent_count", "streams_parent", "control_frame_count", "control_frame", "bootstrap_control_build", "bootstrap_exec_entry", "template_count", "template_set_sha256", "command_count", "command", "package_list_count", "package_list", "package_list_set_sha256", "cargo_command_count", "non_cargo_command_count", "compile_cell_count", "compile_cell", "producer_pass_count", "attester_expected_command_count", "attester_excluded_command_ids", "postcommand_lock_count", "postcommand_lock", "postcommand_lock_set_sha256", "postcommand_package_set_sha256", "command_set_sha256", "compile_cell_set_sha256"]
cardinality_rule = "streams is exact command-streams output binding and streams_parent is its exact three direct parent bindings/purposes; one control frame plus one typed control-build and one same-PID exec-entry record; templates 17; evidence commands 206 = 198 Cargo + 8 non-Cargo; package_list is exactly nine typed command-local parses in source_inventory_contract.package_list_command_order; compile cells 65; producer_pass_count 206; attester expected 204 and attester_excluded_command_ids is the exact ordered two-string array [bootstrap.resolve, bootstrap.fetch] equal command_matrix_contract.attester_excluded_command_ids; postcommand_lock is exactly 28 rows joined to the retained FND01STREAMv2 payloads"
semantic_rule = "join the control frame only to bootstrap_control_build and every evidence frame bijectively to command by exact ID/ordinal, expand every byte-exact template/variant/environment, execute sequentially on the actual worker, bind exact raw stream regions, parse every command-local typed result including all nine package-list raw/transformed listings, and require Pass without inferring a command from a sibling coordinate or candidate disposition. Every metadata command typed_result_sha256 equals its strict parsed, role-normalized FND01METAGRAPHv1 graph digest; raw stdout hashing cannot substitute. template_set_sha256 uses the exact FND01COMMANDTEMPLATEv1 encoding in command_template_contract.canonical_expansion_order. command_set_sha256, package_list_set_sha256, compile_cell_set_sha256, and postcommand_lock_set_sha256 are FND01RECv2 ordered-record-set hashes over respectively all command rows in ordinal order, all package-listing rows in source_inventory_contract.package_list_command_order, all compile_cell rows in command_matrix_contract.compile_cell_rule order, and all postcommand_lock rows in lockfile_producer_contract.lock_ids order. postcommand_package_set_sha256 is the FND01LOCKPACKAGESETv1 hash of the deduplicated raw-byte-sorted union of every crates.io (name,version,checksum) triple strictly parsed from all 28 retained lock payloads; one name/version with conflicting checksums, any source-bearing non-crates.io row, or any crates.io row without a lowercase SHA-256 checksum fails"
typed_result_owner_rule = "command-results owns only generic execution records, raw stream bindings, Cargo JSON/metadata command-local parses, compile cells, control build, and exec-entry observations. The aggregate rs256_kat record and its in-process ring observations are owned exactly once by dependency-receipt.rs256_kat; the two OpenSSL command rows contribute referenced positive observations but never duplicate or orphan rs256_kat evidence"

[[receipt_schema]]
kind = "dependency_receipt"
receipt_id = "dependency-receipt"
table_name = "dependency_receipt"
exact_fields = ["advisory_database", "projection_count", "projection", "target_graph_count", "target_graph", "resolver_delta_count", "resolver_delta", "dependency_policy_count", "dependency_policy", "archive_inventory", "source_inventory", "license_inventory", "advisory_inventory", "unsafe_ffi_panic_inventory", "build_tool_inventory", "rng_delta_inventory", "symbol_inventory", "rs256_kat", "sdk_matrix", "inventory_set_sha256"]
cardinality_rule = "advisory_database is one exact typed binding to the advisory-database output and complete parsed container summary; projection 13; target_graph 65; resolver_delta 13; dependency_policy contains exactly one row for every node in every one of the 65 target_graph rows, so dependency_policy_count is recomputed as the checked sum of all target_graph.node_count values rather than the number of graphs; rows are ordered by projection policy order, target namespace order, then canonical target_graph node order. Each named grouped inventory is present exactly once and contains its own complete typed rows rather than an aggregate-only assertion"
semantic_rule = "this is the exact grouped home for the fully parsed frozen advisory-database binding, resolver-2-to-3 deltas, target graphs, deny decisions, checked archives/sources/licenses/advisories, unsafe/FFI/panic observations, build-tool and RNG observations, host symbol scan, host-only ring/OpenSSL RS256 KAT, and four frozen SDK peer results; candidate disposition remains separate from Pass evidence and support_claim remains false. The advisory inventory is the complete evaluator output derived from every projection's target-graph node union and every parsed same-name RustSec advisory; no row can substitute for full evaluator iteration and any vulnerable result prevents Pass. inventory_set_sha256 excludes advisory_database because that binding has its own output/hash/container authority, and is lowercase SHA-256 of ASCII FND01DEPENDENCYSETv1 then NUL followed by u32be byte length plus each complete FND01RECv2 record set in this exact order: projection-result projection, target-graph target_graph, resolver-delta resolver_delta, dependency-policy-result dependency_policy, then the one-row archive-inventory, source-inventory, license-inventory, advisory-inventory, unsafe-ffi-panic-inventory, build-tool-inventory, rng-delta-inventory, symbol-inventory, rs256-kat, and sdk-matrix sets. Empty arrays retain zero-row encodings, every nested row is recursively included, all lengths are checked against receipt bounds, and no trailing byte is admitted"

[[receipt_schema]]
kind = "workspace_receipt"
receipt_id = "workspace-receipt"
table_name = "workspace_receipt"
exact_fields = ["workspace_snapshot", "staging_snapshot_count", "staging_snapshot", "staging_snapshot_set_sha256", "manifest_count", "manifest", "integration_dependency_rule_count", "integration_dependency_rule", "integration_source_rule_count", "integration_source_rule", "integration_feature_rule_count", "integration_feature_rule", "repository_surface_rule_count", "repository_surface_rule", "workspace_graph_count", "workspace_graph", "workspace_gate_count", "workspace_gate", "workspace_set_sha256"]
cardinality_rule = "workspace snapshot binds 163 files; staging snapshots are the exact four pre-list/pre-A/pre-B/post-B rows; manifests root plus nine members; integration rules 40 dependency + 19 source + 4 feature; repository surface rules 22; workspace graphs 10; gates 6"
semantic_rule = "validate the final resolver-3 manifests/toolchain/lock, six closed-child bindings, shared integration surface, truthful docs/workflows, exact default/all five-target workspace graphs, and all blocking gates. workspace_snapshot exactly equals the source-snapshot FND01WORKv1 count/byte/digest authority; every phase-tagged staging snapshot carries all 163 complete file rows, derives and recomputes that same authority over the closed selected 163-file snapshot, joins ordered path/length/SHA-256 tuples to the source rows, and preserves complete role-local file identities across its four phases. Each snapshot also carries the exact recursively typed, raw-UTF-8-sorted union of pinned-Cargo .git symlink_metadata probes from all nine package roots through POSIX /; count, scope, candidate, method, absent-not-found result, zero-present-marker count, staging-root identity join, and cross-phase path/device/inode/mode stability are recomputed, while ancestor nlink may change. staging_snapshot_set_sha256 is the FND01RECv2 ordered recursive record-set hash of the four observations, their 652 nested file rows, and every nested VCS-probe row; every manifest row is recomputed from a checked read of that same source-snapshot binding, carries the canonical source-manifest path/length/SHA-256 needed by package-receipt Cargo.toml.orig comparison, and follows workspace-manifest-result's exact count semantics. workspace_set_sha256 is lowercase SHA-256 of ASCII FND01WORKSPACESETv1 then NUL followed by u32be byte length plus complete FND01RECv2 record sets in this exact order: the one-row workspace-snapshot-summary set, staging-snapshot-observation staging_snapshot, workspace-manifest-result manifest, integration-dependency-rule-result integration_dependency_rule, integration-source-rule-result integration_source_rule, integration-feature-rule-result integration_feature_rule, repository-surface-rule-result repository_surface_rule, workspace-graph-result workspace_graph, and workspace-gate-result workspace_gate; every nested file and VCS-probe row is recursively included, all lengths are checked against receipt bounds, and no trailing byte is admitted. It makes no Cargo package-list or final archive-member claim"

[[receipt_schema]]
kind = "mutation_receipt"
