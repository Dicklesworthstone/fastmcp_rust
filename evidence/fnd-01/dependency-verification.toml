[[record_schema]]
id = "unix-file-identity"
selectors = ["producer-outer/controller_rch/executable", "attester-outer/controller_rch/executable", "gate-input/controller_rch/executable", "producer-outer/controller_invocation/executable", "attester-outer/controller_invocation/executable", "gate-input/controller_invocation/executable", "producer-outer/daemon_pre/executable", "producer-outer/daemon_pre/workers_config", "attester-outer/daemon_pre/executable", "attester-outer/daemon_pre/workers_config", "gate-input/daemon_pre/executable", "gate-input/daemon_pre/workers_config", "producer-outer/daemon_post/executable", "producer-outer/daemon_post/history_file", "producer-outer/daemon_post/daemon_stdout", "producer-outer/daemon_post/daemon_stderr", "attester-outer/daemon_post/executable", "attester-outer/daemon_post/history_file", "attester-outer/daemon_post/daemon_stdout", "attester-outer/daemon_post/daemon_stderr", "gate-result/daemon_post/executable", "gate-result/daemon_post/history_file", "gate-result/daemon_post/daemon_stdout", "gate-result/daemon_post/daemon_stderr"]
exact_fields = ["path", "device", "inode", "mode", "nlink", "byte_length", "mtime_seconds", "mtime_nanoseconds", "ctime_seconds", "ctime_nanoseconds", "sha256"]
child_fields = []
rule = "one portable Unix regular-file observation from no-follow path metadata plus an opened handle: exact lexical absolute path, device/inode/mode/nlink/length/mtime/ctime, complete bounded SHA-256, stable pre/open/post identity, and no symlink, hardlink, or special node. ctime is change time, never birth time; no Linux-only stat field is claimed"

[[record_schema]]
id = "unix-directory-identity"
selectors = ["producer-outer/daemon_pre/run_directory", "attester-outer/daemon_pre/run_directory", "gate-input/daemon_pre/run_directory", "producer-outer/daemon_post/run_directory", "attester-outer/daemon_post/run_directory", "gate-result/daemon_post/run_directory"]
exact_fields = ["path", "device", "inode", "mode", "nlink", "mtime_seconds", "mtime_nanoseconds", "ctime_seconds", "ctime_nanoseconds"]
child_fields = []
rule = "one portable Unix no-follow directory identity with exact absolute lexical path and device/inode/mode/nlink/mtime/ctime; the daemon phase directory is mode 0700, remains the same directory from pre through post, and is retained rather than removed. ctime is change time, not birth time"

[[record_schema]]
id = "unix-socket-identity"
selectors = ["producer-outer/daemon_pre/socket", "attester-outer/daemon_pre/socket", "gate-input/daemon_pre/socket", "producer-outer/daemon_post/socket_before_stop", "attester-outer/daemon_post/socket_before_stop", "gate-result/daemon_post/socket_before_stop"]
exact_fields = ["path", "device", "inode", "mode", "nlink", "mtime_seconds", "mtime_nanoseconds", "ctime_seconds", "ctime_nanoseconds"]
child_fields = []
rule = "one portable Unix no-follow socket identity at the exact private phase path with device/inode/mode/nlink/mtime/ctime stable across the admitted observation; a regular file, directory, link, special node, wrong path, birth-time interpretation, or daemon-reported path without matching filesystem identity fails"

[[record_schema]]
id = "rch-status-observation"
selectors = ["producer-outer/daemon_pre/status", "attester-outer/daemon_pre/status", "gate-input/daemon_pre/status", "producer-outer/daemon_post/status_before_stop", "attester-outer/daemon_post/status_before_stop", "gate-result/daemon_post/status_before_stop"]
exact_fields = ["argv", "environment", "exit_code", "stdout", "stderr", "running", "socket_path", "uptime_seconds"]
child_fields = ["stdout=>raw-stream-blob", "stderr=>raw-stream-blob"]
rule = "one bounded controller status child with exact absolute bound RCH argv, env_clear closed environment, zero signed exit, complete raw stdout/stderr children, and strict duplicate-key-free JSON. Raw status stdout is the pinned RCH ApiResponse envelope; after requiring success=true and reading data, accepted logical keys are exactly running, socket_path, and uptime_seconds: running is true, socket_path equals the private phase socket, and uptime_seconds is required, never omitted or null, and is one nonnegative integer losslessly representable as u64; unknown/duplicate keys, trailing JSON, wrong type/path, or ignored raw byte fails"

[[record_schema]]
id = "rch-daemon-pre"
selectors = ["producer-outer/daemon_pre", "attester-outer/daemon_pre", "gate-input/daemon_pre"]
exact_fields = ["phase", "executable", "workers_config", "launch_argv", "launch_environment", "run_directory_was_absent", "run_directory", "socket_was_absent", "history_path", "history_was_absent", "stdout_path", "stdout_was_absent", "stderr_path", "stderr_was_absent", "child_pid", "socket", "status", "evidence_verdict"]
child_fields = ["executable=>unix-file-identity", "workers_config=>unix-file-identity", "run_directory=>unix-directory-identity", "socket=>unix-socket-identity", "status=>rch-status-observation"]
rule = "one controller-owned pre-invocation transition for exact phase producer, attester, or gate: every absence boolean is true only after ErrorKind::NotFound; the fresh directory is mode 0700; stdout/stderr are fresh create_new redirection paths; exact rchd/config/argv and env_clear environment are bound; child_pid is the nonzero PID returned by the retained Child; the private socket and strict status observation are obtained within bounded deadlines. No /proc start time, birth time, process-group identity, or child-authored field is admitted"

[[record_schema]]
id = "rch-daemon-post"
selectors = ["producer-outer/daemon_post", "attester-outer/daemon_post", "gate-result/daemon_post"]
exact_fields = ["phase", "executable", "run_directory", "socket_before_stop", "status_before_stop", "child_pid", "kill_fallback_used", "child_wait_status", "child_reaped", "socket_unlink_performed", "socket_absent_after", "history_file", "daemon_stdout", "daemon_stderr", "evidence_verdict"]
child_fields = ["executable=>unix-file-identity", "run_directory=>unix-directory-identity", "socket_before_stop=>unix-socket-identity", "status_before_stop=>rch-status-observation", "history_file=>unix-file-identity", "daemon_stdout=>unix-file-identity", "daemon_stderr=>unix-file-identity"]
rule = "one controller-owned post-return observation for the same phase/pre-record: executable is the same rchd identity, run_directory and socket_before_stop rebind the same phase identities, status_before_stop is a final strict running status, and child_pid equals the nonzero retained daemon_pre Child PID. Wait only on that retained Child under daemon_wait_timeout_seconds; kill_fallback_used may be true only after the first wait deadline and only for direct Child::kill on that Child; then bounded-wait/reap it, require child_reaped=true, and encode child_wait_status exactly as exit:<i32> or signal:<i32>. After reap, probe the exact prebound socket path without following links: NotFound sets socket_unlink_performed=false; only the same exact Unix-socket identity may be unlinked and sets true; changed identity/type or any other metadata error fails without unlink. A final probe must return ErrorKind::NotFound and socket_absent_after=true. No rch daemon stop command, stop argv/environment/exit/stream evidence, process-group signal, descendant scan, PID reconstruction, directory removal, or same-UID hostile-substitution resistance is admitted"

[[record_schema]]
id = "outer-lifecycle"
selectors = ["producer-outer", "attester-outer"]
exact_fields = ["phase", "controller_rch", "controller_invocation", "daemon_pre", "daemon_post"]
child_fields = ["controller_rch=>controller-rch-binding", "controller_invocation=>controller-invocation-plan", "daemon_pre=>rch-daemon-pre", "daemon_post=>rch-daemon-post"]
rule = "the mandatory canonical FND01OUTERv2 lifecycle tail. phase is producer at producer-outer and attester at attester-outer; controller_rch and controller_invocation join the same exact absolute rch CLI identity, while daemon_pre and daemon_post independently join the same rchd identity, phase, private socket, retained Child PID, bounded outer transaction, and phase run directory lexically beneath the one shared controller run parent. The same controller process retains and rechecks that shared parent's Unix identity across all three serialized phases; the parent identity is deliberately not duplicated into this record and no post-hoc record-only proof of it is claimed. CLI and daemon executable identities are never equated. It is written only by the local controller after return and is forbidden from child-authored receipts"

[[record_schema]]
id = "controller-rch-binding"
selectors = ["producer-outer/controller_rch", "attester-outer/controller_rch", "gate-input/controller_rch"]
exact_fields = ["executable", "version", "commit", "require_remote", "no_self_healing", "quiet"]
child_fields = ["executable=>unix-file-identity"]
rule = "bind the installed controller RCH executable by portable Unix file identity plus exact version/commit and true safety booleans. It has no nested daemon field; lifecycle pre/post records are siblings owned by the controller, and no field claims authenticated source upload, per-file remote provenance, or hostile same-UID peer exclusion"

[[record_schema]]
id = "controller-invocation-plan"
selectors = ["producer-outer/controller_invocation", "attester-outer/controller_invocation", "gate-input/controller_invocation"]
exact_fields = ["executable", "controller_environment", "argv", "remote_environment", "controller_working_directory", "remote_working_directory_token", "timeout_seconds", "requested_worker"]
child_fields = ["executable=>unix-file-identity"]
rule = "this is the exact pre-invocation plan; executable is the same portable Unix file identity as controller_rch.executable, argv[0] is its exact absolute path rather than literal or PATH-searched rch, controller_environment contains only raw-key-sorted RCH_NO_SELF_HEALING, RCH_QUIET, RCH_REQUIRE_REMOTE, exact typed RCH_SOCKET_PATH, plus optional RCH_WORKER last only where admitted, argv is the exact RCH argv, and remote_environment is the exact /usr/bin/env -i assignment plan. For producer and attester its PATH value is the literal plan string $fnd01_tool_bin:/usr/bin:/bin, whose variable is expanded only by the already sealed remote shell immediately before /usr/bin/env executes; for Gate it is the concrete prevalidated empty absolute directory. controller_working_directory is the canonical absolute checked local controller repository, remote_working_directory_token is literal dot rather than an invented remote absolute path, the remote repository root is established only by the child current directory, and requested_worker is absent for the final Gate transaction"

[[record_schema]]
id = "bootstrap-control-plan"
selectors = ["receipt/producer_environment/producer_environment/bootstrap_control_plan"]
exact_fields = ["id", "argv", "environment", "working_directory", "target_path", "network_mode"]
child_fields = []
rule = "the one offline control-build child plan is bound before execution and cannot contain a second RCH call or an undeclared environment entry"

[[record_schema]]
id = "tool-observation"
selectors = ["receipt/producer_environment/producer_environment/tool[]"]
exact_fields = ["id", "path", "byte_length", "sha256", "version"]
child_fields = []
rule = "exactly the 20 command_environment_profiles.tool_inventory_ids appear in canonical registry order with checked executable bytes and captured version output; for each of command_expansion_registry.tool_ids, version is the command's complete strict UTF-8 stdout after removing its one required terminal LF, the corresponding command typed_result_sha256 is the one-record FND01RECv2 tool-observation record-set hash, stderr is empty, and rustc/cargo stdout hashes also equal actual_worker verbose hashes"

[[record_schema]]
id = "environment-assignment"
selectors = ["receipt/producer_environment/producer_environment/environment_profile[]/assignment[]", "receipt/producer_environment/producer_environment/proxy[]"]
exact_fields = ["key", "value"]
child_fields = []
rule = "key is unique in its owning array and rows use declared canonical order rather than raw TOML or hash-map iteration; proxy rows admit only command_environment_profiles.proxy_rule keys with exact nonempty inherited values"

[[record_schema]]
id = "environment-profile-observation"
selectors = ["receipt/producer_environment/producer_environment/environment_profile[]"]
exact_fields = ["id", "assignment_count", "assignment", "set_sha256"]
child_fields = ["assignment[]=>environment-assignment"]
rule = "one canonical unexpanded policy environment template snapshot in policy profile order; assignment key/value strings equal the corresponding environment_profile.required pairs byte-for-byte and set_sha256 binds them. Per-command command-result environments are the expanded evidence and must resolve every placeholder through producer observations; inherited and undeclared variables fail"

[[record_schema]]
id = "target-tool-profile-observation"
selectors = ["receipt/producer_environment/producer_environment/target_tool_profile[]"]
exact_fields = ["target", "cc_tool_id", "ar_tool_id", "linker_tool_id", "cc_env_key", "ar_env_key", "cflags_env_key", "linker_env_key", "rustflags_env_key", "cflags_exact", "rustflags_exact", "linker_flavor", "linker_args_exact", "input_root_id", "sdk_binding", "rustlib_binding", "cc", "ar", "linker"]
child_fields = ["cc=>file-binding", "ar=>file-binding", "linker=>file-binding"]
rule = "the first sixteen fields equal target_tool_profile; sdk_binding is an exact external_input_root ID foreign key equal input_root_id rather than a stringified tree tuple, and the three checked tool FileBindings resolve the named tool IDs. The referenced external root observation supplies path/physical/tree identity; no ambient linker, archiver, ranlib, SDK, or rustflags fallback is admitted"

[[record_schema]]
id = "external-input-root-observation"
selectors = ["receipt/producer_environment/producer_environment/external_input_root[]"]
exact_fields = ["id", "path", "device", "inode", "mode", "nlink", "entry_count", "total_regular_file_bytes", "tree_sha256"]
child_fields = []
rule = "the exact five external_input_root rows bind the selected physical root identity and complete bounded tree; every command consumer rechecks its root"

[[record_schema]]
id = "advisory-database-source-observation"
selectors = ["receipt/producer_environment/producer_environment/advisory_database_source"]
exact_fields = ["path", "device", "inode", "mode", "nlink", "file_count", "total_regular_file_bytes", "tree_sha256", "commit", "evidence_verdict"]
child_fields = []
rule = "one dedicated physical source-directory observation binds the complete bounded advisory database tree and opaque commit label; it is not an external compiler input root and does not assert Git or signature provenance"

[[record_schema]]
id = "publication-quarantine-observation"
selectors = ["receipt/producer_environment/producer_environment/quarantine[]"]
exact_fields = ["path", "original_kind", "quarantine_path", "byte_length", "sha256", "disposition"]
child_fields = []
rule = "one row exists for every publication_contract quarantine candidate and records absent or moved-unchanged disposition without deletion or evidence reuse"

[[record_schema]]
id = "process-ancestry-observation"
selectors = ["receipt/producer_environment/producer_environment/process_ancestry[]"]
exact_fields = ["ordinal", "process_id", "parent_process_id", "executable_path", "executable_byte_length", "executable_sha256", "argv0"]
child_fields = []
rule = "rows form one finite unique process-id chain from bootstrap through the observed controller boundary in child-to-parent order; cycles, gaps, zero IDs, and inferred ancestors fail"

[[record_schema]]
id = "supply-package"
selectors = ["receipt/supply_receipt/supply_receipt/bootstrap_package[]", "receipt/supply_receipt/supply_receipt/downstream_union_package[]", "receipt/supply_receipt/supply_receipt/control_only_package[]"]
exact_fields = ["package_id", "name", "version", "source_kind", "source_locator", "checksum_sha256", "features", "dependency_kinds"]
child_fields = []
rule = "name/version/source/checksum triple membership is derived from strict bootstrap and downstream Cargo.lock parsing; package_id is the exact canonical bootstrap Cargo-metadata PackageIdSpec and is cross-validated against the same packages[].name/version/source/manifest_path (crates.io is exactly registry+https://github.com/rust-lang/crates.io-index#<name>@<version>). features are the strict raw-sorted resolve node features. dependency_kinds is the raw-sorted unique set of the package node's outgoing resolve deps[].dep_kinds[] tuples, each of which must derive from a matching packages[].dependencies[] declaration for the resolved target package name, normalized kind, and exact target condition; each tuple is encoded as `<normal|dev|build>:<target-utf8-byte-length-decimal>:<exact-target-condition>` with Cargo null kind normalized to normal, null target encoded by length zero and an empty suffix, and no leading zero on a nonzero length. A triple shared across arrays repeats one byte-equivalent full row; downstream versus control-only classification is solely triple membership, all arrays use strict raw UTF-8 (name,version,checksum) order, and bootstrap is the disjoint exact full-row union of downstream and control-only rows"

[[record_variant_schema]]
id = "supply-entry-crate-archive"
parent_selector = "receipt/supply_receipt/supply_receipt/entry[]"
discriminator_field = "kind"
discriminator_value = "crate-archive"
required_fields = ["kind", "relative_path", "byte_length", "sha256", "package_id", "version", "checksum_sha256", "selected_index_line_sha256", "yanked"]
optional_fields = []
child_fields = []
rule = "the archive equals the selected locked checksum and selected derived-index row, and yanked is false"

[[record_variant_schema]]
id = "supply-entry-derived-local-index-file"
parent_selector = "receipt/supply_receipt/supply_receipt/entry[]"
