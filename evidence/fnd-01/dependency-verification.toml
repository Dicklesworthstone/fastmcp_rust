daemon_status_json_rule = "capture status stdout and stderr as bounded raw-stream-blob records and require zero exit plus empty stderr. Stdout must be one duplicate-key-free JSON object matching pinned RCH 1.0.49 ApiResponse envelope with exactly keys api_version, timestamp, command, success, data and no leading/trailing non-whitespace or second value; api_version is exactly the string 1.0; command is exactly the string daemon status; timestamp is one finite nonnegative integer losslessly representable as u64; success is exactly true; data is one object with exactly keys running, socket_path, and uptime_seconds; running is exactly true; socket_path is strict UTF-8 and equals private_serving_daemon_socket_formula; uptime_seconds is required and is one finite nonnegative integer losslessly representable as u64 (never omitted, never null). Unknown/duplicate key, nested alternate spelling/type/number, false running, wrong socket, ignored trailing byte, lossy reserialization, or digest-only parsing fails"
running_daemon_observation_rule = "the ambient 1.0.52/65294dcda0e0 daemon is a nonauthoritative current observation and is never selected. For producer, attester, and gate, the controller reuses the one checked shared <controller-os-temp>/fnd01/<run-id> parent created by controller_entrypoint_rule; it requires only the distinct short socket-root s/<phase-code> and long evidence directory ev/<phase> leaves absent solely by ErrorKind::NotFound, creates each fresh with mode 0700 before that phase spawn, opens and records their portable Unix directory identities, and requires the unique socket, history, stdout, and stderr paths absent solely by NotFound; every other metadata/open error fails. It opens and binds the exact rchd executable and workers config, opens fresh stdout/stderr files with create_new under the evidence directory, calls env_clear and installs exactly private_serving_daemon_launch_environment, redirects Child stdout/stderr to those files, and spawns private_serving_daemon_launch_argv as one retained foreground std::process::Child with --socket equal to private_serving_daemon_socket_formula. It records only the returned Child PID, never /proc start time, Linux-only process identity, birth time, or process group. Under daemon_socket_ready_timeout_seconds it accepts only the sole child-created private Unix socket, records portable device/inode/mode/nlink/mtime/ctime identity, and obtains daemon_status_json_rule under daemon_status_timeout_seconds before invoking RCH. After the bounded outer transaction, it rebinds the same rchd executable, phase directory, prebound socket identity, and retained Child PID, then obtains one final strict running status. Teardown is retained-Child-only: wait on that same Child under daemon_wait_timeout_seconds; only after that wait deadline may it call Child::kill directly on that same Child, wait again under daemon_wait_timeout_seconds, and reap it. After reap, symlink_metadata the exact prebound socket path: ErrorKind::NotFound records socket_unlink_performed=false; the same exact Unix-socket identity may be unlinked at that one path and records true; any changed identity/type or other metadata error fails without unlink. A final symlink_metadata must return ErrorKind::NotFound and records socket_absent_after=true. `rch daemon stop`, TERM/KILL process-group, descendant discovery, PID reconstruction, unretained-PID signaling, and pkill are forbidden and never executed. History/stdout/stderr files and every retained directory remain identity/hash bound and are never removed. Private daemon pre/post records are controller-owned; malicious same-UID substitution is outside the claim ceiling; ctime is change time rather than birth time; an ambient pathname or daemon-reported path alone cannot pass"
rch_worker_semantics = "RCH_WORKER is only a preference and never proves or pins the selected worker; no receipt may equate it with actual worker identity"
actual_worker_required_os = "Linux"
actual_worker_required_arch = "x86_64"
actual_worker_rule = "inside the remote bootstrap, before child Cargo, record and strictly parse uname OS/architecture, kernel release, hostname, SHA-256 of /etc/machine-id bytes, process id and parent ancestry, the exact rustc and cargo verbose versions from the prevalidated nightly toolchain bin, llvm-nm version/path/hash, OpenSSL version/path/hash, and relevant filesystem device identities; require the qualified OS/architecture and one internally consistent same-process ancestry. No rustup executable is reachable or invoked after the exact /usr/bin/env -i boundary; the outer shell's immediately preceding pinned rustup run/rustc sysroot observation is retained separately in the controller invocation"
controller_observation_rule = "controller-side installed-RCH CLI identity/version/commit, requested preference, bounded invocation plan, exact RCH_SOCKET_PATH join, daemon pre-observation, and daemon post-observation are forbidden from producer_environment and every other child-authored receipt. Produce and Attest carry them only in the mandatory FND01OUTERv2 lifecycle tail at producer-outer and attester-outer; Gate carries the completed pre-observation in FND01GATEINPUTv1 and the completed post-observation plus raw RCH streams/exit in FND01GATERESULTv3. controller_rch.executable and controller_invocation.executable are the same installed rch CLI identity; daemon_pre.executable and daemon_post.executable are the same independently bound rchd identity; status argv[0] is the rch CLI; the CLI and daemon identities are never equated. Each phase binds its distinct never-reused long evidence directory under <controller-os-temp>/fnd01/<run-id>/ev/{producer|attester|gate} and its distinct short socket root under <controller-os-temp>/fnd01/<run-id>/s/{p|a|g}, both beneath the one shared checked run parent and outside the repository checkout; phase/controller/invocation/pre/post joins are exact"
child_execution_rule = "in produce mode the std-only bootstrap executes the first two producer-only acquisition evidence children and one separate offline control-build child, then the exec-replaced ordinary harness executes the remaining 204 evidence children; in attest mode the bootstrap executes one offline control-build child and the harness executes all 204 attester evidence children. Evidence children are sequential, no child action is a second rch exec, and no same-project build may overlap; Cargo-internal compiler, build-script, and native-tool descendants are not top-level matrix or control children"
artifact_return_rule = "all retained output is written beneath exact target/debug/fnd-01/<run-id>/return because installed RCH 1.0.49 returns selected debug content but does not provide a general remote-artifact round trip. Produce return is exactly the 14 output_namespace files and no executable; Attest return is exactly final-attestation.toml plus final-gate and no producer output; Gate return contributes no evidence file and all fallback-synced target content is quarantined non-evidence"
installed_rch_mutation_warning = "pinned RCH binary inspection of the admitted controller surface confirms remote artifact retrieval and private-daemon socket removal on stop; it does not currently confirm rsync --delete as a mandatory always-on behavior. Whole-tree source synchronization, remote directory creation, and any ambient process-wide daemon stop remain separately authorized. Private daemon evidence and sockets must live outside the repository because the installed sync exclude set does not list .fnd01-run and special/live nodes under the checkout create transport hazards"
claim_ceiling = "one controller-owned private-daemon lifecycle around each observed installed-RCH transaction whose bootstrap records the actual qualified worker and runs sequential child commands. Portable Unix path identities and retained Child ownership are accidental-race evidence only: hostile same-UID substitution, peer-credential authentication, process ancestry control, source-sync semantics, cache residence, remote host exclusivity, and artifact return beyond the exact synced subtree are not inferred"


[bootstrap_control_input_authority_contract]
purpose = "root-approved exact authority over the supply-derived Cargo dependency inputs plus the canonical bootstrap manifest and embedded bootstrap lock before Produce materialization; the copied harness, copied verifier, rendered cargo-config, tool set, and environment set remain separately root-bound by their named contracts and ledger joins. Attest recomputes this authority from sealed SUPPLYv4 before any write/child so producer-coherent dependency rewrites cannot pass"
materialized_kinds = ["crate-archive", "derived-local-index-file"]
excluded_evidence_only_kinds = ["sparse-cache-input"]
set_digest_preimage = "ASCII FND01BOOTSTRAPMATERIALIZEDv1 followed by NUL and u32be row count, then each ordered bootstrap_control_input row as kind byte, u32be path length/path bytes, u64be length, raw 32-byte SHA-256"
authority_digest_preimage = "ASCII FND01BOOTSTRAPAUTHORITYv1 followed by NUL, raw 32-byte set digest, u64be bootstrap manifest length, raw 32-byte manifest SHA-256, u64be embedded bootstrap-lock length, raw 32-byte lock SHA-256"
row_order = "ascending kind byte then ascending raw relative_path UTF-8 bytes over the complete materialized 0x01/0x02 set only"
join_sites = ["produce-prebuild", "root-pre-seal", "attest-prewrite", "ordinary-ledger-tree", "final-attestation", "gate"]
claim_ceiling = "exact byte identity of root-frozen bootstrap Cargo inputs; not a general crates.io authenticity claim"
rule = "immediately after Produce constructs and fully validates one in-memory candidate FND01SUPPLYv4, and before its first supply seal, spool, materialization, control-build, ledger, publication, or handoff effect, it computes the complete ordered 0x01/0x02 rows and authority digest. Until the verifier contains independently frozen full rows, explicit row count, set digest, manifest binding, embedded-lock binding, and final authority digest, Produce returns E_PHASE_B_BOOTSTRAP_INPUT_AUTHORITY_PENDING at that boundary; Attest retains E_PHASE_B_ATTEST_INPUT_AUTHORITY before any write or child. After enrollment, Produce, Attest, ordinary, root pre-seal, final attestation, and Gate each compare the full rows and every redundant count, binding, and digest rather than accepting digest equality alone. Kind 0x03 sparse-cache-input remains evidence-only and excluded from materialization authority; coherent lock/index/archive rewrites that diverge from the root-frozen rows or digest fail"

[bootstrap_control_plane_contract]
purpose = "bridge the std-only role-entry bootstrap to the ordinary dependency-capable authoring harness without compiling or executing the FastMCP facade or any workspace member before the harness validates the frozen workspace"
control_child_count_per_role = 1
exec_transition_count_per_role = 1
producer_top_level_evidence_child_count = 206
attester_top_level_evidence_child_count = 204
producer_bootstrap_control_child_count = 1
attester_bootstrap_control_child_count = 1
producer_same_pid_exec_replacement_count = 1
attester_same_pid_exec_replacement_count = 1
evidence_cargo_process_count = 198
attester_evidence_cargo_process_count = 196
producer_bootstrap_control_cargo_child_count = 1
attester_bootstrap_control_cargo_child_count = 1
resolve_timeout_seconds = 1800
fetch_timeout_seconds = 3600
control_build_timeout_seconds = 3600
tool_probe_timeout_seconds = 300
tool_probe_stdout_limit = 1048576
tool_probe_stderr_limit = 1048576
child_poll_interval_milliseconds = 50
direct_child_kill_wait_seconds = 30
child_deadline_rule = "bootstrap.resolve uses resolve_timeout_seconds, bootstrap.fetch uses fetch_timeout_seconds, the offline control build uses control_build_timeout_seconds, and each bootstrap or ordinary tool-identity probe uses tool_probe_timeout_seconds, each measured with a monotonic deadline and polled every child_poll_interval_milliseconds while stdout and stderr are captured concurrently under their independent byte caps. A stream-cap overflow or deadline first marks the command terminal Fail, then calls std::process::Child::kill on that exact retained direct Child and polls wait/try_wait for at most direct_child_kill_wait_seconds until it is reaped; a normal completion must have exact zero exit before any command, probe observation, typed result, spool, ledger, or control-frame row may encode Pass"
child_teardown_claim_ceiling = "safe std Child::kill addresses only the retained direct child and does not claim descendant or process-group termination. If a descendant inherited and retains a stdout/stderr pipe or otherwise outlives the direct child, bounded reader completion cannot be guaranteed by the bootstrap alone; the separately bounded outer controller timeout and teardown of its owned transaction job is the terminal wall-clock/resource bound, and no child-generated record may claim that eventual controller action"
process_count_decomposition_rule = "producer evidence matrix 206 children = 198 Cargo + 8 non-Cargo, attester evidence matrix 204 children = 196 Cargo + 8 non-Cargo; each role additionally has exactly one separate bootstrap-control Cargo child, followed by exactly one same-PID exec image replacement that creates no child. The 20 bootstrap tool-identity probes and 20 ordinary pre-dispatch re-probes per role are bounded inventory children, not evidence-matrix rows, not Cargo children, and not the bootstrap-control Cargo child. Never describe an outer transaction as a 207- or 205-command matrix or count the exec transition or inventory probes inside the 206/204 or 198/196 counts"
descendant_accounting_rule = "Cargo-internal rustc, rustdoc, linker, build-script, native-tool, and compiler descendants are recorded where required by the audited execution environment but are neither top-level evidence commands nor the one top-level control child and never alter the 206/204 evidence counts"
scratch_root_formula = ".fnd01-run/<role>/<run-id>/bootstrap-control-package"
scratch_layout = ["Cargo.toml", "Cargo.lock", "cargo-config.toml", "src/main.rs", "tests/fnd_01_dependency_evidence.rs"]
layout_rule = "create a fresh non-link root and exact parent directories, treating only ErrorKind::NotFound as absence and every other metadata/open error as Fail. Before each bootstrap-owned allocation/write require Cargo.toml and cargo-config.toml within bounds.max_source_file_bytes, src/main.rs within bounds.max_bootstrap_harness_bytes, tests/fnd_01_dependency_evidence.rs within bounds.max_verifier_test_bytes, and the planned/current collective tree within bootstrap/run caps; immediately after Cargo generates Cargo.lock and before reading, allocation, or use, require it nonzero and within bounds.max_source_file_bytes. Copy, reopen, and rehash the sealed harness bytes exactly to src/main.rs and the sealed verifier bytes exactly to tests/fnd_01_dependency_evidence.rs so the harness's ../tests reference resolves only inside scratch; after tree sealing repeat per-file and collective cap checks and reject any extra/missing entry, link, hardlink, special file, path escape, or ambient workspace/config discovery"
control_ledger_path_formula = ".fnd01-run/<role>/<run-id>/control-ledger.bin"
acquisition_spool_path_formula = ".fnd01-run/integration-producer/<run-id>/acquisition-spool.bin"
control_ledger_schema_literal = "FND01CONTROLv2"
acquisition_spool_schema_literal = "FND01ACQSPOOLv1"
directory_tree_preimage = "ASCII FND01BOOTSTRAPTREEv1 followed by NUL, u32be row count, then every row in raw relative-path byte order as u32be path length, exact UTF-8 path bytes, one kind byte 0x01 directory or 0x02 regular file, u32be Linux mode, u64be regular-file length or zero for a directory, and raw 32-byte regular-file SHA-256 or 32 zero bytes for a directory; entry_count and total_regular_file_bytes are checked independently and are not silently appended to the digest preimage"
directory_tree_max_entries = 1000000
directory_tree_max_regular_file_bytes = 4294967296
directory_tree_max_member_bytes = 1073741824
cargo_message_set_preimage = "ASCII FND01CARGOMESSAGESv1 followed by NUL, u32be exact nonzero line count, then for each strict duplicate-key-free JSON line in original order excluding its LF terminator: u64be byte length, raw 32-byte SHA-256, and exact line bytes; the complete stdout still requires exactly one terminal LF and no CR/empty line"
tool_set_preimage = "ASCII FND01BOOTSTRAPTOOLSv1 followed by NUL, u32be byte length and raw UTF-8 bytes of command_environment_profiles.tool_probe_working_directory, u32be 20, then each role in bootstrap_native_tool_candidate ordinal order as u32be ordinal, length-prefixed id, u32be candidate count, and every policy candidate in precedence order with its length-prefixed expanded absolute lexical path and one disposition byte 0x01 absent, 0x02 selected, or 0x03 shadowed. Every candidate then carries u32be symlink-hop count. An absent candidate must have hop count zero and ends immediately with no hop or final-target field. A selected or shadowed candidate carries zero through candidate_symlink_hop_cap hop rows, each encoded as length-prefixed lexical link path, u32be exact raw Unix read_link byte length and bytes with no text digest, then lstat identity as u64be device, u64be inode, u32be mode, u64be nlink, u64be link-text byte length, i64be mtime seconds, u32be mtime nanoseconds, i64be ctime seconds, and u32be ctime nanoseconds; after the hops it carries the length-prefixed absolute lexical final-target path, the final opened regular-file identity in the same numeric layout, and raw 32-byte final-target SHA-256. Exactly one candidate is selected: ErrorKind::NotFound at any ordinal is absent, the first candidate that exists and resolves to an executable is selected, each later candidate that exists and resolves to an executable is shadowed, and any other metadata/read-link/open error, existing nonexecutable, cycle, repeated link identity, or ninth hop fails. Then append the selected lexical path, final target identity, length-prefixed selected version stream name, u64be exact version byte length, raw version SHA-256, and exact raw version bytes"
environment_set_preimage = "ASCII FND01BOOTSTRAPENVSv1 followed by NUL, u32be six, then each unexpanded environment_profile in policy order as one template record: length-prefixed profile id, u32be required assignment count and every declared template pair in array order as length-prefixed key/value, then u32be optional-key count and every optional key in declared order. SHA-256 binds these exact policy templates; each command separately records and hashes its fully expanded closed environment after checked substitution, so template and observation are distinct typed objects and no sorting, inherited entry, cumulative prefix, or alternate empty/absent form is admitted"
acquisition_command_preimage = "ASCII FND01BOOTSTRAPCOMMANDv1 followed by NUL, u32be ordinal, u32be id byte length and raw UTF-8 id, u32be argv-item count and for each item including argv0 its u32be byte length and exact raw UTF-8 bytes in original order, u32be environment-assignment count and for each assignment in profile order its u32be key byte length/raw UTF-8 key followed by u32be value byte length/raw UTF-8 value, u32be absolute-working-directory byte length and exact raw UTF-8 bytes, i64be zero exit, stdout as u64be byte length/raw 32-byte SHA-256/exact bytes, stderr as u64be byte length/raw 32-byte SHA-256/exact bytes, u32be typed-result-kind byte length/raw UTF-8 kind, raw 32-byte typed-result SHA-256, and u32be byte length/raw UTF-8 literal Pass; every count, length, and addition is checked and no omitted or trailing byte is admitted"
resolve_typed_preimage = "ASCII FND01BOOTSTRAPRESOLVEv1 followed by NUL, bootstrap Cargo.toml u64be length/raw SHA-256, raw SHA-256 of the exact duplicate-key-free metadata stdout, raw SHA-256 of its complete strict normalized package/node/edge/feature graph encoding, bootstrap Cargo.lock u64be length/raw SHA-256, u32be exact normalized package-row count and each canonical package/source/checksum row, raw package-set SHA-256, raw 45-row bootstrap-direct registry SHA-256, and raw 38-row union-only registry SHA-256"
fetch_typed_preimage = "ASCII FND01BOOTSTRAPFETCHv1 followed by NUL, bootstrap Cargo.lock u64be length/raw SHA-256, acquisition Cargo-home directory-tree binding, u32be selected sparse-cache file count and exact path/length/hash rows, u32be selected archive count and exact path/length/hash/checksum rows, supply-bundle u64be length/raw SHA-256, raw inner-entry-set SHA-256, and raw SHA-256 of the exact FND01SUPPLYCLOSUREv1 closure_bijection_rule preimage recomputed from parsed bytes"
acquisition_join_rule = "bootstrap.resolve ordinal zero and bootstrap.fetch ordinal one use the exact closed argv/environment/CWD generated by this policy; resolve binds the canonical 45 declarations to one exact lock/metadata graph, fetch is --locked and joins the same lock, selected sparse cache, archives, acquisition tree, and sealed bundle bijectively; every count, byte length, digest, exit, typed preimage, command preimage, and spool row is recomputed independently with no digest-only substitute. Producer forms each exact command preimage from the compiled plan and actual bounded capture before spool encoding, the reopened spool reconstructs the same bytes, and ordinary independently regenerates the compiled plan and reconstructs every preimage from the immutable spool fields before projecting raw streams and overlapping fields exactly once into command-streams and command-results. Field, byte, order, CWD, raw-stream, typed-result, verdict, import-count, or projection drift fails even when an alternate spool is self-consistently resealed"
acquisition_claim_ceiling = "typed command records bind the two actual bounded child transactions and their checked local cache/lock/tree/supply consequences; they do not authenticate crates.io, recover raw HTTP bodies, prove cache freshness, prove physical network isolation, or strengthen the separately stated process/deadline and filesystem race ceilings"
control_ledger_exact_fields = ["format", "schema_version", "role", "run_id", "process_id", "authoring_closure_sha256", "integration_seal_sha256", "scratch_binding_count", "scratch_binding", "local_registry", "supply_bundle", "tool_set_sha256", "environment_set_sha256", "build_argv", "build_environment", "build_working_directory", "build_exit_code", "build_stdout", "build_stderr", "cargo_message_count", "cargo_message_set_sha256", "compiler_artifact", "build_finished", "target_snapshot", "selected_executable", "handoff_argv", "handoff_environment", "acquisition_spool", "ledger_set_sha256"]
acquisition_spool_exact_fields = ["format", "schema_version", "role", "run_id", "command_count", "command", "supply_bundle", "spool_set_sha256"]
acquisition_spool_command_fields = ["id", "ordinal", "argv", "environment", "working_directory", "exit_code", "stdout", "stderr", "typed_result_kind", "typed_result_sha256", "evidence_verdict"]
raw_stream_blob_fields = ["byte_length", "sha256", "bytes"]
optional_file_binding_fields = ["present", "path", "byte_length", "sha256"]
manifest_rule = "Cargo.toml is byte-for-byte the bootstrap_manifest_contract canonical document: package autobins/autoexamples/autotests/autobenches are false, build is false, one [[bin]] named fnd_01_evidence_harness has path src/main.rs, exact verifier dependencies are nonoptional, every downstream-union-only direct dependency is explicitly renamed and optional, and the trailing [workspace] has members=[\".\"] and resolver=\"3\" with no exclude/default-members/inheritance/patch/replace/build/dev dependency"
resolver_rule = "pinned Cargo resolves a workspace lock as if all features of every workspace member are enabled, so the optional union dependencies enter the one lock; the producer bootstrap.resolve metadata command creates and parses that lock, bootstrap.fetch --locked without --target fetches every locked target dependency, and the later default-feature control build uses the identical manifest and lock while compiling only the verifier-harness dependency surface"
attester_reconstruction_rule = "the attester first validates and byte-binds the external integration seal and complete published FND01SUPPLYv4 object. Before any filesystem mutation, materialization, retained-output write, or child, it recomputes bootstrap_control_input_authority_contract.set_digest_preimage over the complete ordered 0x01/0x02 materialized-input rows compiled and root-frozen by the verifier, then recomputes authority_digest_preimage over that set digest plus the exact bootstrap manifest and embedded bootstrap-lock bindings. Until those compiled rows, digests, and comparisons are implemented and independently frozen, Attest returns E_PHASE_B_ATTEST_INPUT_AUTHORITY at that boundary. After authority succeeds it may reconstruct the exact scratch layout, materialize a fresh registry, and perform the offline control build. This stop is not gzip/tar validation: std-only Phase B keeps each 0x01 archive compressed and checksum-bound under supply_bundle_contract.bootstrap_validation_rule; full gzip/tar member validation belongs exclusively to ordinary_archive_validation_rule after same-PID exec"
build_argv = ["{tool.cargo.path}", "build", "--manifest-path", "{bootstrap-manifest}", "--bin", "fnd_01_evidence_harness", "--locked", "--offline", "--message-format=json", "--target-dir", "{fresh-bootstrap-control-target}", "--config", "{local-registry-config}"]
build_environment_profile = "offline_control"
build_working_directory = "{bootstrap-control-package-root}"
build_stream_rule = "capture stdout and stderr concurrently under independent bounds to avoid pipe deadlock; exit is exactly zero; every stdout line is strict duplicate-key-free JSON; there is exactly one final reason=build-finished record with success=true and its immediately preceding line is the exactly one matching reason=compiler-artifact record whose package_id, manifest_path, target name, kind=[\"bin\"], crate_types=[\"bin\"], src_path, edition=\"2024\", features=[], profile.test=false, and fresh=false equal the canonical scratch control package on the qualified host. Its non-null executable equals one filenames entry, is the sole executable candidate, is beneath the fresh target root, equals the checked target-snapshot binding, and is a regular nlink-one no-link owner-executable file; any non-JSON line, intervening/later record, mismatch, duplicate, stale/fresh artifact, nonexecutable, link, or output escape fails"
target_snapshot_rule = "checked-snapshot bind the fresh control target exact selected executable plus every file used to establish its Cargo JSON identity; reject stale preexisting target bytes, output outside the target root, an executable link/special file, path ambiguity, hash drift, or an unbound selected artifact"
dependency_tcb_rule = "strict-parse the control metadata resolve graph and require its exact direct declarations and complete transitive package/source/checksum/features closure. The ledger observes and binds the canonical bootstrap manifest, dedicated bootstrap-control lock, normalized metadata closure, exact tool and environment-template sets, complete bounded Cargo stdout/stderr plus strict JSON artifact/build-finished selection, checked target snapshot, and selected executable identity. Those observations establish the control harness dependency closure, including ring 0.17.14, its build dependency on cc 1.4.0, and the selected compiler/archiver identities, but without an explicit descendant trace they do not claim to observe each rustc, proc-macro, build-script, compiler, archiver, or other native invocation individually, nor every generated file or library identity"
phase_b_policy_authority_rule = "validate_phase_b_authority produces one private typed PhaseBAuthority only after the whole frozen policy, canonical bootstrap manifest, direct and union registries, native-tool registry, exact acquisition command identities and typed parsers, path/layout rules, stream caps, deadlines, child polling/reap bounds, and every pre-barrier file/tree/aggregate bound match compiled authority. A pure Produce role-entry join of that authority with exact argv/environment/run-root/authoring/seal state yields one non-Clone static acquisition capability. That capability authorizes only bounded fresh producer scratch creation, native-tool inventory, bootstrap.resolve, bootstrap.fetch, and in-memory construction and complete std-only validation of one candidate FND01SUPPLYv4; it does not authorize a supply seal, acquisition spool, materialization, control build, ledger, retained publication, or handoff. The bootstrap_control_input_authority_contract barrier governs every later effect. Counts, ordered arrays, strings, booleans, integers, templates, path formulas, and rule-dispatch identifiers remain authority-bearing; dynamically parsed self-consistency without the typed compiled join authorizes nothing"
ordinary_tool_reprobe_rule = "only after the same-PID ordinary entry has established the external authoring closure and role-seal authority, independently derived every non-tool ledger expectation and exact role/run path, and retained the bounded ledger bytes as opaque unparsed input, but before full ledger acceptance, archive expansion, any workspace/evidence child, or returned-output write, one non-Clone single-use probe permit runs exactly 20 probes in bootstrap_native_tool_candidate ordinal order. No ledger byte or field may select a candidate path, probe argv, environment, working directory, timeout, capture bound, execution-bin path, candidate precedence, or version parser. The ordinary harness uses the same compiled exact bootstrap_native_tool_candidate registry, conditional candidate encoding, resolver rules, execution-bin mapping, version parsers, timeout, poll interval, bounded concurrent capture, and direct-child kill/wait semantics as Phase B; it revalidates the complete execution-bin set, recomputes tool_set_preimage from every candidate disposition, conditional chain/final identity, and exact raw selected version stream, and uses the observations to complete tool_set_sha256, cargo_executable, and build_environment in the independent ControlLedgerExpectation. The harness then rechecks the opaque ledger binding, invokes the complete strict ledger validator, and requires all observed tool fields match; a digest-only trust, skipped or extra probe, alternate resolver, ledger-selected probe input, ENOENT treated as fatal, non-ENOENT treated as absent, or drift fails. After archive validation it performs one no-child revalidation of all candidate chains, final tool identities, and the complete execution-bin set. These 20 inventory children are outside all evidence and Cargo-child counts under process_count_decomposition_rule"
preexec_ledger_format = "FND01CONTROLv2"
preexec_ledger_encoding = "ASCII FND01CONTROLv2 followed by NUL and the recursively tagged control_ledger_exact_fields in declared order using FND01RECv2 scalar/record encodings; each raw stream blob is the exact raw-stream-blob record whose byte_length uses tag 0x02, sha256 uses tag 0x01 with lowercase hexadecimal text, and bytes uses tag 0x04 with its own equal u64be length, so no alternate compact length/raw-digest framing is admitted; integration_seal_sha256 is 64 lowercase zeroes only in produce mode and a checked external seal only in attest mode; ledger_set_sha256 is omitted from its own preimage and equals SHA-256 of every preceding byte; total bytes must be nonzero and at most bounds.max_control_ledger_bytes with checked counts/lengths/additions before allocation"
preexec_ledger_rule = "before handoff create_new control_ledger_path_formula outside the exact bootstrap package layout, fsync file and parent, reopen, strict-parse to EOF, and rehash one immutable bounded ledger containing role/run id, authoring closure, integration seal sentinel/value, exact scratch file bindings, local-registry and supply binding, tool/execution-environment bindings, build argv/env/CWD, raw build streams/status, strict Cargo JSON selection, target snapshot, selected executable FileBinding, current PID, expected handoff argv/env, and the typed producer acquisition-spool optional binding. The handoff argv/environment are independently regenerated from bootstrap_rch_contract.argv_rule and the role's exact environment registry before the ledger is encoded; a producer-chosen self-consistent alternate array fails. The attester requires acquisition_spool.present=false with the required path, byte_length, and sha256 explicit-option fields each encoded as an empty array; the producer requires present=true with each of those fields encoded as one singleton array carrying the exact checked spool binding"
acquisition_spool_format = "FND01ACQSPOOLv1"
acquisition_spool_encoding = "ASCII FND01ACQSPOOLv1 followed by NUL and the recursively tagged acquisition_spool_exact_fields in declared order using FND01RECv2; each of exactly two canonical command rows embeds both exact raw-stream-blob records under their independent bounds using the same tagged length/text-digest/raw-bytes encoding as preexec_ledger_encoding, spool_set_sha256 is omitted from its own preimage and equals SHA-256 of every preceding byte, and the total is nonzero and at most bounds.max_acquisition_spool_bytes with checked arithmetic"
acquisition_spool_rule = "produce mode alone creates acquisition_spool_path_formula with create_new after the exact bootstrap.resolve and bootstrap.fetch children and before the control-build child, writes rows in ordinal order, fsyncs file/parent, reopens, strict-parses to EOF, and rehashes it. Producer forms each exact command preimage from the compiled plan and actual bounded capture before spool encoding, seals the complete spool, reopens and strict-parses the identical spool bytes, and reconstructs an identical preimage from the parsed row. After same-PID exec, ordinary reopens those exact ledger-bound spool bytes, independently regenerates the compiled argv/environment/CWD plan, reconstructs every command preimage from the spool fields, and requires field-for-field and byte-for-byte equality. It copies stdout/stderr bytes without decoding, trimming, newline conversion, re-encoding, or normalization into the unique command-stream regions and projects the overlapping argv/environment/CWD/exit/typed-result/verdict fields exactly once into command-results; offsets, lengths, and hashes must reconstruct the same raw bytes. Reordering, normalization, digest-only comparison, duplicate import, missing import, or a self-consistently resealed alternate spool fails. Attest mode requires the path absent and never creates, reads, or reconstructs a spool"
producer_output_ownership_rule = "the completed control-build frame is copied into command-streams' one control prelude and its typed build plus exec-entry observations are owned by command-results; producer-environment contains only child-observable pre-build plans, tools, roots, and execution inputs and therefore creates no supply-bundle back-edge. Controller RCH/invocation/daemon lifecycle evidence is never child-authored and exists only in controller-owned outer or gate records"
exec_rule = "after every preexec binding passes, construct the exact five-item ordinary handoff argv `[selected-executable, <produce|attest>, ., <run-id>, <role-run-root>/control-ledger.bin]`, clear the inherited environment, install exactly the role's bootstrap environment registry, and call std::os::unix::process::CommandExt::exec on the exact checked executable. This is a same-PID image replacement, not a child, not cargo run, and not a second Cargo process; returning from exec is terminal Fail"
harness_entry_rule = "the dependency-backed ordinary role harness accepts only the two exact five-item forms in bootstrap_rch_contract.argv_rule. Parsing performs the single physical current_dir repository admission early, before resolving any repository-relative binding; this safety admission is distinct from the later full workspace snapshot validation. Until the root-frozen authoring/seal rows, opaque-ledger probe permit, shared bounded 20-tool implementation, complete ControlLedgerExpectation join, archive bookend, and adversarial ordering tests are compiled, the explicit E_ORDINARY_HANDOFF_PENDING sentinel fires immediately after argv/environment/PID/current-executable admission and before opening a ledger, spool, supply, archive, child, or output. In a claiming run the mandatory serialized order is: (1) independently bind the external authoring closure and role seal, derive all non-tool scratch/registry/supply/environment/build expectations plus the role-appropriate acquisition-spool option and exact role-derived supply path, require argv[0] and current executable agree with the exact role/run target formula, and checked-read the exact ledger path under its bound while keeping its bytes opaque; (2) consume one permit to perform ordinary_tool_reprobe_rule exactly 20 times with no ledger-selected input; (3) add the observed tool_set_sha256, cargo_executable, and build_environment to form the complete ControlLedgerExpectation, recheck the opaque ledger binding, strict-validate the immutable ledger against that expectation, regenerate/compare handoff argv/environment, require its nonzero PID equal the ledger PID, require argv[0], current executable, ledger selected-executable path, and exact executable bytes all agree, and immediately rebind every ledger regular file and tree; (4) perform supply_bundle_contract.ordinary_archive_validation_rule in full over all 0x01 archives; (5) reopen through checked pre/open/post identity snapshots, strict-reparse, and byte-rehash the ledger and supply again, plus the producer spool when present, require equality to step 3, and perform the no-child post-archive tool-surface revalidation; then and only then (6) validate the full workspace snapshot rooted at the already admitted repository, record the same-PID exec-entry fact, dispatch workspace/evidence children, and permit role-owned returned writes. The separately compiled argc-one local-audit path uses compile-time CARGO_MANIFEST_DIR, never reads role environment/current_dir, remains read-only, and cannot produce or promote role evidence. A successful role handoff emits no direct stdout or stderr; a failed, pending, or panicked role handoff emits no stdout, makes the one bounded best-effort FND01ENTRYv1 stderr attempt specified by bootstrap_rch_contract.std_only_rule, and exits 3. Any complete line is controller-captured operational output, never child evidence or a seal input, and the handoff's eventual exit cannot be asserted inside its own retained outputs"
claim_ceiling = "one exact offline scratch-package build and one same-PID Unix image replacement per role; no facade/workspace prevalidation compile, no cargo-run semantics, no child-generated assertion of its own eventual exit, no Cargo-descendant process-count claim, and no non-Unix portability claim"

[bootstrap_manifest_contract]
format = "canonical duplicate-key-free TOML with LF line endings and one terminal LF"
package_block = ["[package]", "name = \"fastmcp-fnd01-bootstrap-control\"", "version = \"0.0.0\"", "edition = \"2024\"", "publish = false", "autobins = false", "autoexamples = false", "autotests = false", "autobenches = false", "build = false"]
bin_block = ["[[bin]]", "name = \"fnd_01_evidence_harness\"", "path = \"src/main.rs\"", "test = false", "bench = false", "doc = false"]
dependencies_header = "[dependencies]"
verifier_dependency_lines = [
  "flate2 = { version = \"=1.1.9\" }",
  "ring = { version = \"=0.17.14\", default-features = false, features = [\"alloc\"] }",
  "semver = { version = \"=1.0.28\" }",
  "serde = { version = \"=1.0.229\", features = [\"derive\"] }",
  "serde_json = { version = \"=1.0.151\", features = [\"arbitrary_precision\"] }",
  "sha2 = { version = \"=0.10.9\", default-features = false }",
  "toml = { version = \"=1.1.3\" }",
]
verifier_dependency_order = ["flate2", "ring", "semver", "serde", "serde_json", "sha2", "toml"]
direct_dependency_count = 45
verifier_dependency_count = 7
union_only_dependency_count = 38
direct_dependency_row_fields = ["ordinal", "package", "version", "source", "default_features", "features", "verifier_dependency", "union_alias"]
