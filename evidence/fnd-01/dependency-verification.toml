[command_template_contract]
row_count = 17
row_exact_fields = ["template_id", "group", "expansion_count", "id_formula", "coordinate_domain", "executor", "argv_source", "argv_template", "environment_profile", "working_directory", "target_scope", "execution_mode", "profile", "resolver", "network_mode", "exit_expectation", "stdout_limit", "stderr_limit", "typed_parser", "claim_ceiling"]
placeholder_rule = "the complete allowed command-string brace-token grammar is: literal {target}; one `{<id>}` for an exact generated_path_contract.placeholder_ids member; `{tool.<id>.path}` for an exact command_environment_profiles.tool_inventory_ids member; one of `{target-tool-profile.cc-env-key}`, `{target-tool-profile.cc.path}`, `{target-tool-profile.ar-env-key}`, `{target-tool-profile.ar.path}`, `{target-tool-profile.cflags-env-key}`, `{target-tool-profile.cflags-exact}`, `{target-tool-profile.linker-env-key}`, `{target-tool-profile.linker.path}`, `{target-tool-profile.rustflags-env-key}`, or `{target-tool-profile.rustflags-exact}`; and one exact `.path` member of external_input_root_contract.coordinate_names. `.tree` members are typed evidence coordinates and are never command strings. Expansion is deterministic and bounded to two stages: first select the current target_tool_profile field for any target-tool token, then resolve each external-input path coordinate occurring in that selected field exactly once; direct generated-path, tool, target, and external-input path tokens resolve only when the whole value equals the exact token. The validation-only target_tool_profile.rustlib_binding is the sole additional embedded form: exactly `{input-root:pinned-rust-sysroot.path}/lib/rustlib/<current-target>` with that fixed literal suffix; it is checked as a directory binding and is never a command argument expansion. cflags_exact and rustflags_exact remain the only command-string target-profile fields allowed to embed one external-input token. Reject an unknown namespace/member, a target-tool token without one exact current target, more than one external-input token in a selected field, a direct token with any prefix/suffix, any remaining brace after stage two, recursion, a second substitution pass, or splitting/joining/interpolating the resulting bytes. Every expansion substitutes exact validated values before execution; no shell, PATH lookup, glob, response file other than the bound symbol response file, environment interpolation, optional flag, or unlisted argument is permitted"
argv_rule = "argv is executed directly by std::process::Command inside the already-remote bootstrap; no command_template invokes sh, bash, env, cargo through a wrapper, a second RCH transaction, or a user-supplied executable"
common_cargo_config_rule = "every cargo-offline template other than the exact workspace.gate coordinate whose gate-id is fmt includes `--config`, `{local-registry-config}` as the final two Cargo options before any `--` tool-argument delimiter where accepted by that Cargo subcommand; workspace.gate/fmt does not resolve/build and is not an offline dependency proof"
canonical_expansion_order = "command_template row order below, then each row's coordinate_domain arrays in the order declared by the policy: projection.graph.r3 expands all output_namespace.projections outer and target_order inner; projection.compile.r3.ring-free expands ring_free_projection_ids outer and target_order inner; projection.compile.r3.ring-bearing then expands ring_bearing_projection_ids outer and target_order inner. Each command-result ordinal is the zero-based position of that expanded row in this complete order. template_set_sha256 hashes ASCII FND01COMMANDTEMPLATEv1 followed by NUL and u32be row count, then every command_template row in policy order with each string field encoded as u32be UTF-8 length plus bytes, expansion_count/stdout_limit/stderr_limit as u64be, and argv_template as u32be item count followed by length-prefixed strings, all in command_template_contract.row_exact_fields order; overflow, a non-UTF-8 string, or trailing byte fails"

