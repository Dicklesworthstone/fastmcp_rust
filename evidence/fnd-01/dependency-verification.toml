record_value_encoding = "FND01RECv2 values use one byte tag: 0x01 strict UTF-8 string then u32be byte length and bytes; 0x02 unsigned integer then u64be; 0x03 boolean then one byte 0x00/0x01; 0x04 raw bytes then u64be length and bytes; 0x05 schema-directed homogeneous recursive array then u32be count and each independently tagged value in order, where every element tag/schema must equal the one exact compiled element type for that field; 0x06 record then u32be schema-id length/id bytes, every required field value in registry order, and for every optional field in registry order exactly one presence byte 0x00 absent or 0x01 present followed immediately by its recursively encoded value; 0x07 homogeneous record array then u32be count and each recursively encoded record of the one exact compiled schema; 0x08 explicit optional value then one byte 0x00 absent or 0x01 present followed by any recursively encoded value of the one exact compiled type; 0x09 map then u32be member count and members in ascending raw UTF-8 key bytes as u32be key length/key bytes/recursively encoded value of the one exact compiled map value type; 0x0a signed integer then i64be; 0x0b tagged variant record then u32be variant-schema-id length/id bytes, every required field in registry order, and one 0x00/0x01 presence byte plus value when present for every optional field in registry order. Heterogeneous array tags, omitted optional presence bytes, extra presence/count words, floats, datetime, implicit null, unknown tag/schema/variant, duplicate/noncanonical map key, noncanonical boolean, trailing bytes, and unchecked count/length arithmetic fail"
record_value_bound_rule = "before allocation or recursion, enforce bounds.max_record_depth, max_record_field_count, max_record_array_items, max_record_string_bytes, max_record_blob_bytes, and max_record_total_bytes plus the smaller enclosing receipt/gate/ledger/spool/container bound; check every count, length, offset, multiplication, and addition in a wide integer and reject conversion overflow. Map and record field counts include unknown candidates so a field flood fails before filtering"
