union_alias_formula = "literal fnd01_union_ followed by the first 24 lowercase hexadecimal characters of SHA-256 over ASCII FND01UNIONALIASv1, NUL, package name, NUL, exact version, NUL, source locator, NUL, boolean default-features byte, and each feature as u32be length plus raw UTF-8 bytes in sorted unique order"
union_dependency_line_rule = "each union-only declaration is one explicit dependency key equal union_alias_formula with package=<exact original package name>, version=<exact =version>, default-features=<exact boolean>, features=<exact sorted array including an explicit empty array>, optional=true, and registry crates-io; aliases are collision-free and there is no target/build/dev dependency table"
