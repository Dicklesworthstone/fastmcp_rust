attester_trust_ceiling = "the attester proves internal completeness, checksums, fresh materialization, offline usability, producer/attester downstream lock byte equality, and binding to producer-supplied acquisition anchors subject to bootstrap_archive_claim_ceiling; it does not independently contact crates.io and therefore does not prove that the producer bundle equals current, historical, authentic, or complete upstream registry state"

[command_stream_contract]
format = "FND01STREAMv2"
container = "one deterministic gzip member"
gzip_rule = "RFC 1952 header has compression method deflate, no optional fields, MTIME zero, XFL fixed by the declared encoder setting, OS 255, one member, valid CRC32 and ISIZE, and no trailing or concatenated member; compressed and expanded bounds are checked before allocation"
gzip_encoder = "the producer writer profile is flate2 1.1.9 with miniz_oxide 0.8.9 backend, GzBuilder, compression level 6, MTIME 0, OS 255, no filename/comment/extra/header CRC, with level 6 requiring XFL 0. Verifier acceptance binds the exact compressed output hash and validates the declared header, one complete bounded deflate member, CRC32, ISIZE, no trailing bytes, and exact expanded FND01STREAMv2 bytes; it does not claim that recompression by a named encoder is a unique bit-identical canonical deflate stream"
aggregate_bound_rule = "bounds.max_command_stream_bundle_bytes and bounds.max_command_stream_expanded_bytes are independent fail-closed aggregate caps checked during streaming before allocation, addition, compression, and decompression; individual command/control stdout/stderr maxima are per-record caps and their arithmetic sum is intentionally allowed to exceed the aggregate cap, so actual retained lengths must satisfy both"
frame_header = "ASCII FND01STREAMv2 followed by NUL, raw 16-byte run_id, u32be control_frame_count exact one, u32be evidence_command_count exact 206, then u32be lock_payload_count exact 28"
control_frame_record = "one exact id bootstrap-control.build, then u64be stdout length/raw bytes and u64be stderr length/raw bytes copied byte-for-byte from the immutable preexec ledger; its command-results control-frame ordinal is exact zero in the separate one-row control namespace, it is parsed as the one control-build frame, and it is excluded from evidence_command_count"
evidence_frame_record = "for each evidence command in command_matrix_contract canonical order: u32be command-id length and exact UTF-8 id, u64be stdout length and exact raw stdout bytes, then u64be stderr length and exact raw stderr bytes"
lock_payload_record = "after all evidence frames, for each lockfile_producer_contract.lock_ids row in exact order: u32be lock-id length and exact UTF-8 id, u64be nonzero bounded Cargo.lock byte length, raw 32-byte SHA-256, then exact raw Cargo.lock bytes; strict duplicate-key-free Cargo lock parsing and package-set digest checks are required before retention"
frame_order = "the one control frame first, then exact command_matrix_contract command order, then exactly 28 lock payloads in lockfile_producer_contract.lock_ids order; IDs are unique in their respective namespaces and exact sets; no text decoding, newline normalization, trimming, redaction, lossy conversion, hex expansion, omission, digest-only lock substitution, or merged stream is allowed"
stable_join_key = "exact UTF-8 command id; every evidence frame joins bijectively to exactly one command-results command row with identical id and canonical ordinal, while bootstrap-control.build joins only to command-results.bootstrap_control_build"
offset_rule = "command-results stores absolute expanded-frame offsets and lengths for the control frame, each evidence stdout/stderr byte region, and each lock payload, plus SHA-256 of exact bytes; every region is in bounds, pairwise nonoverlapping, appears in canonical order, and points exactly after its own encoded length/hash fields. Header, IDs, hashes, and length words intentionally occupy intervening bytes; strict re-encoding of every parsed field and raw region must reproduce the complete expanded container byte-for-byte"
outer_transport_rule = "controller-side outer RCH stdout/stderr and eventual harness exit cannot be emitted by the already-running harness into this bundle; they are excluded from control/evidence frame counts and bound only by the root-authored post-return integration seal"
attester_rule = ".1.15 rehashes the compressed file, bounded-decompresses it, validates gzip/framing, recomputes every producer stream hash and all 28 raw producer lock hashes, then byte-compares each independently regenerated lock with its exact retained payload; its independent rerun records typed semantic results and its own bounded stream hashes in final-attestation scratch, but producer and attester raw command streams are not required equal because Cargo/RCH diagnostics are nondeterministic"
claim_ceiling = "exact retained producer control-build/evidence child-process stdout/stderr bytes plus the 28 exact producer Cargo.lock byte objects; outer transport, terminal display, timing, scheduling, interleaving, unobserved file descriptors, eventual harness exit, and command-stream byte equality across reruns are not claimed"

