ordinary_controller_argv = ["<exact-audited-local-controller-executable>", "controller", ".", "<run-id>"]
producer_bootstrap_environment_exact_keys = ["FASTMCP_FND01_AUTHORING_CLOSURE", "FASTMCP_FND01_RUN_ID", "LANG", "LC_ALL", "PATH", "TZ"]
attester_bootstrap_environment_exact_keys = ["FASTMCP_FND01_AUTHORING_CLOSURE", "FASTMCP_FND01_INTEGRATION_SEAL", "FASTMCP_FND01_PRODUCER_OUTER_RECORD_PATH", "FASTMCP_FND01_RUN_ID", "LANG", "LC_ALL", "PATH", "TZ"]
producer_outer_shell_template = "fnd01_tool_bin=\"$(rustup run nightly-2026-07-11 rustc --print sysroot)/bin\" && rustup run nightly-2026-07-11 rustc crates/fastmcp/tests/fnd_01_dependency_evidence.rs --edition=2024 --cfg fnd01_bootstrap -o target/debug/fnd-01/<run-id>/bootstrap && /usr/bin/env -i FASTMCP_FND01_AUTHORING_CLOSURE=<exact-authoring-marker> FASTMCP_FND01_RUN_ID=<run-id> LANG=C LC_ALL=C PATH=\"$fnd01_tool_bin:/usr/bin:/bin\" TZ=UTC target/debug/fnd-01/<run-id>/bootstrap produce . <run-id> && RUSTUP_TOOLCHAIN=nightly-2026-07-11 rustc --print cfg"
attester_outer_shell_template = "fnd01_tool_bin=\"$(rustup run nightly-2026-07-11 rustc --print sysroot)/bin\" && rustup run nightly-2026-07-11 rustc crates/fastmcp/tests/fnd_01_dependency_evidence.rs --edition=2024 --cfg fnd01_bootstrap -o target/debug/fnd-01/<run-id>/bootstrap && /usr/bin/env -i FASTMCP_FND01_AUTHORING_CLOSURE=<exact-authoring-marker> FASTMCP_FND01_INTEGRATION_SEAL=<exact-integration-marker> FASTMCP_FND01_PRODUCER_OUTER_RECORD_PATH=.fnd01-run/controller/<run-id>/producer-outer.bin FASTMCP_FND01_RUN_ID=<run-id> LANG=C LC_ALL=C PATH=\"$fnd01_tool_bin:/usr/bin:/bin\" TZ=UTC target/debug/fnd-01/<run-id>/bootstrap attest . <run-id> .fnd01-run/controller/<run-id>/producer-outer.bin && RUSTUP_TOOLCHAIN=nightly-2026-07-11 rustc --print cfg"
argv_rule = "producer_argv, attester_argv, and gate_argv are the complete bootstrap/trust_std parser forms. The dependency-backed ordinary harness has exactly five disjoint forms: argc one is the read-only local audit; the two exact five-item remote handoffs are `[<ledger.selected_executable.path>, produce, ., <run-id>, .fnd01-run/integration-producer/<run-id>/control-ledger.bin]` and `[<ledger.selected_executable.path>, attest, ., <run-id>, .fnd01-run/independent-attester/<run-id>/control-ledger.bin]`; ordinary_controller_argv is the sole local controller form; and exact seven-item gate_argv selects the isolated Gate subgraph. A five-item ordinary Gate handoff is forbidden. Each run placeholder is substituted once before invocation, the decoded run-id equals FASTMCP_FND01_RUN_ID and every seal/ledger run ID, argv[2] is literal dot, current_dir is read once only for a role or controller entry and checked as the physical repository appropriate to that entry, the attester outer argv/environment paths are byte-equal to integration_seal_contract.outer_record_path_formula, and no optional, positional fallback, flag alias, extra item, controller-invented remote absolute path, PWD trust, or environment-derived argv is accepted. Exact raw `gate` in argv item one is classified before arity or later-field validation and permanently selects the stderr-silent Gate path even when a later Gate field is malformed; malformed non-Gate entry forms make the one bounded best-effort FND01ENTRYv1 attempt specified by std_only_rule and exit 3"
controller_entrypoint_rule = "ordinary_harness_path delegates to harness_main, whose exact ordinary dispatch must recognize argc one as read-only audit, the two five-item Produce/Attest forms only as already-remote same-PID handoffs, ordinary_controller_argv only as the local controller, and exact gate_argv only as the isolated Gate subgraph. Controller failure, pending state, or panic makes the one bounded best-effort FND01ENTRYv1 stderr attempt specified by std_only_rule and exits 3; completed controller success emits no entry diagnostic. After controller_build_authority_rule passes and before any phase directory or RCH invocation, controller mode resolves controller-os-temp, requires the shared <controller-os-temp>/fnd01/<run-id> parent absent solely by ErrorKind::NotFound, creates it exactly once with mode 0700, opens and binds its portable Unix directory identity, and retains it for the complete serialized run. Controller mode alone then owns the Produce outer transaction, producer FND01OUTERv2 publication, Attest outer transaction, final-attestation publication, attester FND01OUTERv2 publication, gate daemon pre/seal/input, Gate transaction, gate daemon post/result, and final read-only audit. It never recreates the shared run parent, nests RCH inside a remote RCH worker, or routes controller mode through the bootstrap parser"
controller_build_authority_rule = "the qualified Produce/Attest/Gate binaries produced by the current RCH-only build rule are Linux x86_64 artifacts and cannot execute as the macOS controller. This policy does not authorize a direct local Cargo/rustc compile, which is a build, and it does not authorize executing controller mode in this session. Controller mode therefore requires a separately authorized pinned local build or an independently audited prebuilt macOS artifact whose exact path/bytes are substituted for ordinary_controller_argv[0]; absent that external authority it fails closed before creating a controller phase directory or invoking RCH. No cross-platform equivalence, nested RCH build, or implicit build-on-demand is admitted"
bootstrap_environment_rule = "the selected shell template wraps the bootstrap invocation itself in exact /usr/bin/env -i and supplies every role-specific key exactly once. fnd01_tool_bin is obtained only from the immediately preceding pinned rustup/rustc sysroot query, must be one absolute physical nightly-2026-07-11 bin directory with no colon/newline/NUL, and bootstrap rechecks every executable before child use; missing/extra/duplicate FASTMCP, locale, PATH, proxy, Cargo, RCH, credential, or dynamic-library key fails"
direct_rustc_output_rule = "installed RCH 1.0.49 does not inject CARGO_TARGET_DIR for CompilationKind::Rustc, so no direct-rustc path may depend on it. Before RCH, quarantine any exact target/debug/fnd-01/<run-id> candidate and require the repository-relative parent fresh; rustc writes exactly target/debug/fnd-01/<run-id>/bootstrap. The std-only Attest image does not copy an executable into return before dependency-backed validation; only the same-PID ordinary Attest image may copy its final checked current-executable bytes create_new to sibling return/final-gate after final_gate_executable_contract.build_origin_rule is satisfied. Produce never copies an executable into return. All applicable paths are inside the Rustc fallback target/debug/** return pattern, and every returned object is exact-set checked rather than inferred from cache"
outer_invocation_rule = "invoke exactly `<exact-absolute-bound-rch-path> exec -- sh -c <producer_outer_shell_template>` or `<exact-absolute-bound-rch-path> exec -- sh -c <attester_outer_shell_template>` according to role with argv[0] equal byte-for-byte to controller_rch.executable.path and the outer record's exact raw-key-sorted assignments RCH_NO_SELF_HEALING=1, RCH_QUIET=1, RCH_REQUIRE_REMOTE=1, RCH_SOCKET_PATH=<exact-role-private-socket>, and only then optional nonempty RCH_WORKER as a preference. A literal PATH-searched `rch`, alternate symlink, or different absolute path fails. RCH_SOCKET_PATH is strict UTF-8, an absolute lexical path of at most private_serving_daemon_socket_path_max_bytes, and ends exactly in /fnd01/<run-id>/s/p/rch.sock for produce or /fnd01/<run-id>/s/a/rch.sock for attest under controller-os-temp (phase-codes p/a); the long rch-daemon/* evidence directories are never socket paths; the selected expanded shell text and parsed final argv are recorded before launch, contain no lowercase cargo token, have one bounded controller timeout, and the final simple command is assignment-prefixed bare rustc for installed-RCH classification"
gate_transaction_rule = "bootstrap mode gate is intentionally absent from producer_outer_shell_template and attester_outer_shell_template: it is the third parser mode in gate_argv and executes only through the separate serialized final_gate_executable_contract outer_rch_controller_environment plus outer_rch_argv transaction after Attest has returned. Any attempt to run gate through a Produce/Attest compile shell or to run Produce/Attest through the final-gate transaction fails"
