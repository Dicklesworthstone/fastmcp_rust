[rng_inventory_contract]
purpose = "closed package-family and direct incoming dependency-edge/resolved-feature inventory derived from the exact retained target-filtered Cargo metadata graphs; it makes no entropy, cryptographic strength, API invocation, runtime path, or random-source claim"
rng_package_ids = ["fastrand", "getrandom", "nanorand", "oorandom", "rand", "rand_chacha", "rand_core", "rand_distr", "rand_hc", "rand_isaac", "rand_jitter", "rand_os", "rand_pcg", "rand_xorshift", "rand_xoshiro"]
package_match_rule = "exact case-sensitive projection_graph_node.name equality to one rng_package_ids member; package_id remains the complete normalized Cargo identity used for grouping and order, while aliases, source names, substrings, prefixes, suffixes, near names, features, and transitive reputation never match"
package_union_rule = "for each projection, derive the exact RNG-node identity and feature union from its five retained target_graph rows. Every matching node has at least one incoming edge because each target graph is already proven to contain only nodes reachable from its unique projection root; an RNG node with zero resolved features is represented by one incoming-edge row whose resolved_feature is the literal <none>. The verifier reconstructs the projection-level identity/feature union from the complete rows and requires byte equality with the graphs"
row_exact_fields = ["projection_id", "target", "edge_ordinal", "from_package_id", "to_package_id", "dependency_name", "dependency_kind", "target_condition", "version_requirement", "declaration_features", "uses_default_features", "optional", "rng_package_name", "rng_package_version", "rng_source_kind", "rng_source_locator", "resolved_feature", "evidence_verdict"]
edge_rule = "for each retained target_graph independently, iterate its canonical edge rows and select every edge whose exact destination node name is an rng_package_ids member. Emit one row for each exact resolved feature on that destination node in that graph, or one row with literal <none> when its resolved feature set is empty. Copy the complete canonical edge identity/declaration fields and destination node name/version/source fields into every row; any endpoint mismatch, invented declaration field, omitted edge, omitted/extra feature, duplicate row, or non-RNG destination fails"
edge_ordinal_rule = "within each projection/target/destination RNG node, sort candidate rows by from_package_id, dependency_name, dependency_kind, target_condition optional-string encoding, version_requirement, declaration_features canonical string-array encoding, uses_default_features, optional, then resolved_feature, all with the canonical raw-byte ordering used by the typed graph. edge_ordinal is the one-based position in that complete sequence. The global row order is projection policy order, target namespace order, destination package_id, then edge_ordinal"
graph_cross_check_rule = "the exact 13-projection by 5-target coordinate set and its 65 strict typed target_graph rows are the sole graph authority. The RNG derivation independently requires the unique exact projection root, endpoint closure, directed reachability of every node from that root, declaration matching, resolved features, target filtering, and canonical order, then compares all 18 fields of the complete typed row sequence with field-specific diagnostics. No cargo-tree command, text tree, ambient re-resolution, inferred feature, or producer-authored graph summary participates"
claim_ceiling = "exact-Cargo-resolver-RNG-family-edge-and-feature-inventory-only"

[build_tool_classifier_contract]
purpose = "closed recognition grammar over the complete 65 projection.compile.r3.<projection>.<target> plus eight projection.symbol-build.<projection> command streams in exact global command order; only explicitly recognized Cargo custom-build artifact JSON lines and strict native-tool stderr trace lines are claimed"
line_stream_rule = "for each of the exact 73 commands, strict-cargo-json parsing accounts for the complete stdout and custom-build observations retain the exact originating JSON line; native classification scans the complete outer stderr as exact LF-delimited lines with no CR/NUL, accepts a missing final LF only for an otherwise noncandidate trailing diagnostic line, and fails a candidate line malformed under its owning rule. Within each command custom-build stdout rows precede native stderr rows, commands retain global matrix order, duplicate recognized lines remain duplicate rows, and noncandidate stderr lines remain stream-bound but generate no observation"
rule_registry_count = 3
rule_registry_exact_fields = ["id", "tool_kind", "priority", "candidate_prefix", "parse_rule"]
rule_registry_order = ["BUILD-CUSTOM-TARGET-v1", "BUILD-C-COMPILER-v1", "BUILD-ASSEMBLER-v1"]
custom_build_rule = "every stdout line is already one strict duplicate-key-free Cargo JSON object; when reason is compiler-artifact and target.kind is exactly [\"custom-build\"], require package_id to resolve through the coordinate metadata to exactly one canonical target-graph package_id, target.name nonempty, executable null or string, filenames an array of unique absolute strings, and emit one build-script observation with package_id equal that complete canonical identity, build_script_id equal the exact top-level command ID, program=target.name, and arguments=filenames in source order; other valid Cargo JSON objects emit no build-tool row"
native_trace_prefix_rule = "a line beginning `[` and containing the exact delimiter `] running: ` exactly once is a native-trace candidate: decode the prefix body as exactly `<package-name> <semver>` by splitting at its final ASCII space, resolve it to exactly one node in this target graph by case-sensitive node name/version, then parse the suffix as one or more strict JSON double-quoted strings separated by exactly one ASCII space and no leading/trailing bytes; every decoded string is at most 4096 UTF-8 bytes and contains no NUL or control character, the first decoded string is program, and the rest are arguments"
program_basename_rule = "program must be nonempty UTF-8 with no NUL/backslash, and basename is bytes after its final `/`; compiler basenames are exact cc, gcc, clang, c++, g++, clang++ or gcc-/clang-/g++-/clang++- followed by one or more ASCII digits with optional dot-digit runs; assembler basenames are exact as, llvm-as, nasm, or yasm; an otherwise valid native trace with an unrecognized basename is retained as noncandidate and emits no observation"
attribution_rule = "custom-build resolves the exact JSON Cargo package ID through the strict coordinate metadata and then to the one canonical target-graph node; native traces use a uniquely resolved case-sensitive node name/version in that same graph. Zero/multiple resolution, malformed semver, missing target node, or a candidate attribution conflict fails"
duplicate_rule = "each recognized source line emits one observation even when its decoded package/program/arguments duplicate another line. build_script_id is the exact top-level command ID; trace_sha256 is SHA-256 of the exact source line excluding LF; argv_sha256 is SHA-256 of ASCII FND01BUILDARGVv1, NUL, u32be count including program, then program and every decoded argument as u32be-length-prefixed UTF-8 in order. Exact row order and multiplicity preserve command and stream-line occurrence, the grouped row count/set digest cover all rows, disposition is observed, and no producer-authored count or digest substitutes for fresh derivation"
claim_ceiling = "recognized-verbose-stream-observation-only"

[[build_tool_rule]]
id = "BUILD-CUSTOM-TARGET-v1"
tool_kind = "build-script"
priority = 1
candidate_prefix = "{"
parse_rule = "build_tool_classifier_contract.custom_build_rule"

[[build_tool_rule]]
id = "BUILD-C-COMPILER-v1"
tool_kind = "c-compiler"
priority = 2
candidate_prefix = "[<package> <version>] running: "
parse_rule = "build_tool_classifier_contract.native_trace_prefix_rule plus compiler basename branch"

[[build_tool_rule]]
id = "BUILD-ASSEMBLER-v1"
tool_kind = "assembler"
priority = 3
candidate_prefix = "[<package> <version>] running: "
parse_rule = "build_tool_classifier_contract.native_trace_prefix_rule plus assembler basename branch"

[rustsec_evaluator_contract]
purpose = "closed policy-native evaluator for the exact frozen RustSec advisory database; it is deliberately conservative for target/function constraints and is not cargo-audit compatibility or current-database clearance"
advisory_file_count = 1153
path_grammar = "exact `crates/<package-id>/RUSTSEC-<four ASCII digits>-<four ASCII digits>.md` beneath the retained database, with one safe nonempty package component; every matching path is parsed and no other Markdown file is interpreted as an advisory"
frontmatter_grammar = "file bytes are strict UTF-8 with LF only, no BOM/NUL/CR, begin at byte zero with exact ` ```toml` without the leading display-space followed by LF (three backticks, lowercase toml), contain a first exact closing line of three backticks, and parse only the bytes between those delimiters as strict duplicate-key-free TOML; prose after the closing LF is ignored for decisions but remains hash-bound"
root_tables = ["advisory", "affected", "versions"]
required_tables = ["advisory", "versions"]
advisory_keys = ["aliases", "categories", "cvss", "date", "expect-deleted", "id", "informational", "keywords", "license", "package", "references", "related", "url", "withdrawn"]
versions_keys = ["patched", "unaffected"]
affected_keys = ["arch", "functions", "os"]
schema_rule = "advisory.id/package/date are required strings; versions.patched/unaffected are optional arrays of strings; advisory aliases/categories/keywords/references/related are optional string arrays, cvss/license/url/withdrawn optional strings, expect-deleted optional bool, informational absent or exact unmaintained/unsound/notice; affected.arch/os are optional string arrays and affected.functions is an optional table from nonempty function-path strings to string arrays; unknown root table/key, duplicate key/table, wrong type, empty required value, or nested unknown shape fails the entire database"
identity_rule = "advisory.id exactly equals the path basename without .md, advisory.package exactly equals the path package component, date and optional withdrawn match ASCII YYYY-MM-DD syntax, and all 1153 IDs and paths are unique"
requirement_rule = "parse every patched, unaffected, and affected.functions string with semver::VersionReq from exact semver 1.0.28 and every graph node version with semver::Version; preserve source array order for evaluation, but encode each requirement with VersionReq::to_string for the finding basis; an invalid requirement/version fails even when the advisory package is unreachable"
matching_rule = "for every projection-union node and every advisory whose package equals the target-graph-node name field case-sensitively, emit exactly one finding keyed by the node's normalized full package_id; evaluate disposition in strict precedence withdrawn when withdrawn exists, informational when informational exists, unaffected when any unaffected requirement matches, patched when any patched requirement matches, otherwise vulnerable"
affected_constraint_rule = "affected arch/os/functions can only narrow a RustSec advisory in target/function-aware clients; this verifier does not have a sound function/architecture evaluator, so when the version would otherwise be vulnerable it conservatively remains vulnerable regardless of affected contents, and no constraint can clear a node"
affected_requirement_encoding = "exact UTF-8 `patched=` plus source-order normalized patched requirements joined by comma, `;unaffected=` plus source-order normalized unaffected requirements joined by comma, `;affected-constraints=` plus `present` when [affected] exists or `absent` otherwise"
count_rule = "finding_count equals all matching node/advisory pairs including patched, unaffected, withdrawn, and informational; vulnerability_count counts only vulnerable, withdrawn_count only withdrawn disposition, informational_count only informational disposition; any vulnerable finding rejects the projection advisory entry"
claim_ceiling = "frozen-database-conservative-package-version-evaluation-only"

