[static_source_classifier_contract]
purpose = "closed lexical observation grammar for unsafe/FFI/panic and admitted C/assembly source suffixes; it is intentionally not an AST, macro-expansion, generated-output, reachability, runtime-safety, or exploitability analysis"
rust_extensions = [".rs"]
c_extensions = [".c", ".cc", ".cpp", ".cxx", ".h", ".hpp", ".hxx"]
assembly_extensions = [".S", ".asm", ".s"]
extension_rule = "case-sensitive exact final-basename suffix after the last slash; a basename equal to only the suffix is admitted; paths with no listed suffix or lookalike suffixes such as .RS, .inc, .m, .mm, .rs.in, and .cxx.tmp produce no static-classifier finding"
rust_encoding_rule = "exact source_file_record bytes must be at most bounds.max_source_file_bytes, strict UTF-8, BOM-free and NUL-free; LF and CRLF line endings are accepted, a bare CR is rejected, a final line terminator is optional, and no newline normalization occurs"
rust_lexer_dependency = "proc-macro2 = { version = \"=1.0.107\", default-features = false, features = [\"span-locations\"] }"
rust_lexer_rule = "inside catch_unwind(AssertUnwindSafe(...)), parse the entire exact UTF-8 string once with proc_macro2::TokenStream::from_str 1.0.107; parse Err, panic, a span byte range outside the exact input, more than 1048576 recursively visited TokenTree values, or group nesting deeper than 256 fails the inventory; recursively visit every TokenTree exactly once in source byte-range order without macro expansion and retain Ident exact to_string spelling, Punct char/Spacing, Literal as opaque, and Group delimiter plus span"
token_adjacency_rule = "a sibling token means the immediately next or previous TokenTree in the same TokenStream/Group; matching never crosses a Group boundary except the explicitly described attribute recursion, comments are absent from proc_macro2 output, and Literal contents are never inspected"
location_rule = "anchor each Rust finding at the first byte of its rule's anchor token using Span::byte_range().start over the original exact bytes; derive one-based line and one-based UTF-8 byte column from original LF/CRLF boundaries, and hash the exact original line bytes excluding its LF or CRLF terminator; C/assembly file findings anchor at line 1 column 1 and hash the first line by the same rule, with SHA-256(empty) for an empty file"
rule_registry_count = 7
rule_registry_exact_fields = ["id", "category", "anchor", "token_pattern", "precedence"]
rule_registry_order = ["SRC-RUST-UNSAFE-v1", "SRC-RUST-FFI-EXTERN-v1", "SRC-RUST-FFI-ATTR-v1", "SRC-RUST-PANIC-MACRO-v1", "SRC-RUST-PANIC-METHOD-v1", "SRC-C-v1", "SRC-ASM-v1"]
panic_macro_idents = ["assert", "assert_eq", "assert_ne", "debug_assert", "debug_assert_eq", "debug_assert_ne", "panic", "todo", "unimplemented", "unreachable"]
panic_method_idents = ["expect", "unwrap"]
ffi_attribute_idents = ["export_name", "link", "link_name", "link_section", "no_mangle"]
finding_rule = "emit one unsafe_ffi_panic_finding per exact rule match over each unique canonical package_id's exact selected bytes; repeated projection occurrences of one package_id must have byte-identical classified source sets and are scanned once. Different rules at the same anchor remain distinct, one rule never emits twice for the same anchor, and C/assembly emits exactly one file finding. Canonical row order is ascending canonical package_id raw UTF-8 bytes, relative_path raw UTF-8 bytes, one-based line, one-based UTF-8 byte column, static_classifier_rule precedence, then rule_id raw UTF-8 bytes; the receipt row sequence equals a fresh complete derivation byte-for-byte"
workspace_package_ids = ["fastmcp-cli", "fastmcp-client", "fastmcp-console", "fastmcp-core", "fastmcp-derive", "fastmcp-protocol", "fastmcp-rust", "fastmcp-server", "fastmcp-transport"]
disposition_rule = "workspace_package_ids matches the exact canonical graph node name associated with each row's complete canonical package_id. For such a node, rust-unsafe, ffi, c-source, and assembly-source are reject unless one exact allowlist row matches; panic-site is observed. For every non-workspace node all categories are observed; reject takes precedence over allowlist and observed, and any reject contradicts the grouped inventory's Pass verdict"
allowlist_count = 0
allowlist_ids = []
allowlist_row_exact_fields = ["id", "package_id", "node_source_identity", "relative_path", "rule_id", "line", "column", "source_line_sha256", "disposition", "reason"]
allowlist_rule = "the registry is deliberately empty for FND-01; no wildcard, prefix, glob, category-only, package-only, path-only, line-only, digest-only, dynamic, generated, inherited, or stale allowance exists, and transport-tls-allowlisted can therefore never be emitted under this policy version"
claim_ceiling = "complete deterministic lexical/file-suffix observation over the exact selected source_file_record bytes only"

[[static_classifier_rule]]
id = "SRC-RUST-UNSAFE-v1"
category = "rust-unsafe"
anchor = "the matching Ident token"
token_pattern = "any Ident whose exact spelling is `unsafe`"
precedence = 1

[[static_classifier_rule]]
id = "SRC-RUST-FFI-EXTERN-v1"
category = "ffi"
anchor = "the matching extern Ident"
token_pattern = "an Ident exactly `extern` whose next sibling is absent or is not an Ident exactly `crate`; thus `extern crate` is excluded and every ABI/function/block extern form is included"
precedence = 2

[[static_classifier_rule]]
id = "SRC-RUST-FFI-ATTR-v1"
category = "ffi"
anchor = "each matching linkage Ident inside the attribute Group"
token_pattern = "a Punct `#` immediately followed by a Bracket Group; recursively inspect only that Group and match each Ident in ffi_attribute_idents, including inside cfg_attr or unsafe(...) attribute groups"
precedence = 3

[[static_classifier_rule]]
id = "SRC-RUST-PANIC-MACRO-v1"
category = "panic-site"
anchor = "the matching macro-name Ident"
token_pattern = "an Ident in panic_macro_idents immediately followed by Punct `!` and then by any Group, all as siblings"
precedence = 4

[[static_classifier_rule]]
id = "SRC-RUST-PANIC-METHOD-v1"
category = "panic-site"
anchor = "the matching method-name Ident"
token_pattern = "Punct `.` immediately followed by an Ident in panic_method_idents immediately followed by a Parenthesis Group, all as siblings"
precedence = 5

[[static_classifier_rule]]
id = "SRC-C-v1"
category = "c-source"
anchor = "file start"
token_pattern = "relative_path final basename has one exact c_extensions suffix; file bytes are otherwise opaque"
precedence = 6

[[static_classifier_rule]]
id = "SRC-ASM-v1"
category = "assembly-source"
anchor = "file start"
token_pattern = "relative_path final basename has one exact assembly_extensions suffix; file bytes are otherwise opaque"
precedence = 7

[symbol_classifier_contract]
purpose = "closed host-only heuristic observation over the exact complete Cargo-produced code-artifact set emitted by the eight command_expansion_registry.symbol_projection_ids builds for runtime target x86_64-unknown-linux-gnu, scanned once on the same downstream worker bound by those command receipts; no other projection or target receives a symbol-scan claim, and this is not binary decompilation, call-graph analysis, key-material detection, algorithm-use proof, or transport-security proof"
command_options = ["--defined-only", "--demangle", "--print-file-name", "--format=posix", "--quiet"]
artifact_selection_rule = "parse every compiler-artifact JSON object from each of the exact eight fresh build command streams, resolve every artifact package through that coordinate's strict metadata and target graph, and select each unique filename whose target.kind contains lib, rlib, dylib, staticlib, cdylib, bin, proc-macro, or custom-build and whose suffix is one of .rlib, .a, .so, .dylib, .dll, .lib, or is the artifact's extensionless executable. During production and independent attestation require the selected object to be an existing no-link regular file at its canonical path beneath the coordinate's unique build target directory and bind byte length/SHA-256 before and after llvm-nm; sort the union by raw absolute path bytes and reject a missing declared file, unreported extra selected file, duplicate, symlink, special file, empty set, or path outside the target root. The returned published verifier independently rederives path selection and all stream/receipt joins, but cannot rehash remote intermediate object bytes absent from the 14 retained outputs and therefore treats their in-place pre/post byte bindings as producer/attester observations under the non-hostile-controller ceiling"
artifact_set_rule = "projection_target symbol artifact rows are an exact bijection to artifact_selection_rule. The harness writes one fresh checked response file at {bound-symbol-response-file}: strict UTF-8, no BOM/NUL/CR, one absolute artifact path per LF-terminated line in raw-path order, final LF required, every path free of ASCII whitespace, quotes, backslash, and control bytes so each line is exactly one LLVM response-file token; it fsyncs/reopens/rehashes the file and binds its FileBinding plus the exact ordered response_artifact_path array, count, and set digest in symbol_inventory. The published verifier reconstructs exactly `path + LF` for every retained array member, rejects an empty array or duplicate path, and requires reconstructed byte length/SHA-256 to equal response_file before resolving the one final `@<response-file-path>` llvm-nm argv token after all command_options. response_artifact_set_sha256 is SHA-256 of ASCII FND01SYMBOLARTIFACTSETv1, NUL, u32be artifact count, then for each artifact row in response path order u32be-length-prefixed projection_id, u32be-length-prefixed absolute path, u64be observed byte length, and raw decoded 32-byte observed SHA-256. Scanning only a sentinel root rlib, inferred dependency filename, returned RCH subset, hand-picked primary artifact, unbound response file, or response/path mismatch fails"
stream_grammar = "--quiet is mandatory because ordinary Rust rlibs contain metadata members for which llvm-nm otherwise emits no-symbol diagnostics; stderr must therefore be exactly empty. Stdout is strict UTF-8, no BOM/NUL/CR, with zero or more LF-terminated nonempty lines and a final LF required when nonempty. Because --print-file-name and --format=posix are required, each line prefix is either one exact selected nonarchive artifact path followed by colon and one ASCII space, or one exact selected archive artifact path followed immediately by `[`, one nonempty archive member name free of `]`, NUL, CR, LF, and control bytes, then `]: `; choose the unique exact selected outer artifact path and retain the member separately, with artifact_member empty only for the nonarchive form. From the right parse a nonempty symbol-name prefix, one or more ASCII spaces, one single non-space ASCII symbol-type byte, one or more spaces, one nonempty lowercase [0-9a-f]+ address, one or more spaces, and one nonempty lowercase [0-9a-f]+ size. Artifact path and symbol name have no leading/trailing ASCII whitespace or control byte; any ambiguous or unknown artifact prefix, malformed archive member, or malformed line fails rather than being skipped"
record_rule = "symbol_inventory rows begin with exactly one artifact row per response_artifact_path in that order; artifact rows use raw_line_ordinal zero and empty raw-line/symbol/member/classification fields, disposition observed, and retain projection/path/in-place byte binding. They are followed by one symbol row per llvm-nm input line, preserving its bound outer artifact path, archive member or exact empty nonarchive sentinel, artifact length/digest, and one-based raw line number/hash before canonical sort. Duplicate lines and duplicate names remain distinct symbol rows; canonical symbol-row order is artifact_path raw bytes, artifact_member raw bytes, symbol name/type/address/size, then line_number"
tokenization_rule = "for classification only, map ASCII A-Z bytes in symbol_name to a-z, leave all other bytes unchanged, and split into maximal nonempty ASCII [a-z0-9]+ tokens at every other byte; no Unicode case-folding, demangler reinterpretation, stemming, substring match, or normalization is allowed"
rule_registry_count = 3
rule_registry_exact_fields = ["id", "classification", "priority", "match_rule"]
rule_registry_order = ["SYM-PRIVATE-KEY-v1", "SYM-SIGNING-v1", "SYM-ALGORITHM-v1"]
allowlist_count = 1
allowlist_row_exact_fields = ["id", "projection_id", "rule_id", "required_origin_token", "required_context_token", "disposition", "reason"]
classification_rule = "evaluate rules in ascending priority against each distinct exact symbol name after canonical symbol-row sorting; the first matching rule wins and its classification/rule/origin/context/disposition fields appear only on that name's first canonical row, while duplicate-name rows retain empty classification fields and disposition observed. Private-key and signing matches can never be allowlisted. An algorithm name becomes transport-only-allowlist only when every occurrence is in projection tls-plus-jose-unified and its exact tokens contain the allowlist's first policy-order present origin token plus first policy-order present context token; otherwise it is forbidden-algorithm/reject. This all-occurrence rule prevents canonical-order or duplicate-projection laundering"
count_rule = "the independently derived classified-row count equals distinct matched symbol names across the complete bound host artifact union from exactly the eight selected projection builds; forbidden names are distinct first-classified rows whose disposition is reject, not symbol rows or all findings. Any reject contradicts the grouped inventory's Pass verdict and zero rejects permits Pass; no unscanned projection/target may inherit or advertise this artifact set"
claim_ceiling = "demangled-artifact-symbol-name-heuristic-observation-only"

[[symbol_rule]]
id = "SYM-PRIVATE-KEY-v1"
classification = "forbidden-private-key"
priority = 1
match_rule = "tokens contain exact token privatekey or secretkey, or contain adjacent exact token pair private,key or secret,key"

[[symbol_rule]]
id = "SYM-SIGNING-v1"
