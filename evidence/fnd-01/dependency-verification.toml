zip_rule = "lock_ids and producer_command_ids are exact parallel arrays of 28 unique values; each producer command starts with its one declared fresh scratch lock path absent, omits --locked, exits zero, creates exactly one regular Cargo.lock, and is the sole creator of that lock. Every later command in the same root uses --locked and may not change its checked length/hash. Every retained raw lock is nonempty and at most bounds.max_source_file_bytes before TOML parsing or further allocation, then is duplicate-key-free TOML with exact root keys version and package, integer version exactly 4, a nonempty bounded package array, and package tables containing only name, version, optional source, optional checksum, and optional dependencies; this is the deliberately closed FND crates.io/path subset of Cargo v4, so metadata, patch.unused, replace, git sources, and alternate registries fail closed. Names obey Cargo's nonempty alphanumeric-or-dash-or-underscore grammar; crates.io names additionally are at most 64 ASCII bytes, begin alphabetically, preserve field case while deriving a lowercase index path, and cannot collide after ASCII case folding plus dash/underscore normalization. Name/version/source identities are unique; versions are strict SemVer text whose major/minor/patch integers each fit u64, and one normalized crates.io package cannot contain two versions equal after removing SemVer build metadata; source and checksum occur together or are both absent; a source is exactly registry+https://github.com/rust-lang/crates.io-index and its checksum is lowercase SHA-256. Source-less name/version identities equal the exact controlled roots for that lock: all nine 0.3.2 workspace packages for workspace and consumer.aggregate; fnd01-projection-workspace-baseline 0.0.0 plus the exact eight-package non-CLI path closure fastmcp-rust, fastmcp-core, fastmcp-protocol, fastmcp-transport, fastmcp-server, fastmcp-client, fastmcp-derive, and fastmcp-console at 0.3.2 for either workspace-baseline projection lock; fnd01-projection-core-foundation 0.0.0 plus fastmcp-core 0.3.2 for either core-foundation projection lock; and only the one 0.0.0 fnd01-projection-<projection-id> package for every other projection lock. Dependencies are bounded strictly ascending Cargo lock references of name, optional version, and optional parenthesized exact source; a source may occur only after an explicit version. Resolution follows Cargo lock semantics: name is exact; an omitted version requires one distinct version for that name; an explicit source then matches exactly, while an omitted source selects the sole source-less identity first and otherwise requires one remaining source identity. Each reference uses Cargo's minimal qualification—name alone when globally unique, then name plus version when that is unique or selects the source-less identity, otherwise name plus version plus source—and each package has at most one edge to any resolved target identity regardless of spelling. Every reference therefore resolves to one complete parsed identity, and graph traversal from the exact source-less roots reaches every package identity so no unattached registry or local row is admitted. Package array order is not reinterpreted as lexical version order because Cargo orders PackageId versions semantically. package_set_sha256 hashes ASCII FND01LOCKPACKAGESETv1 followed by NUL and u32be crates.io triple count, then the exact unique triples sorted by raw UTF-8 (name,version,checksum) tuple, each component as u32be byte length plus bytes; every triple has the strict parsed registry source and lowercase SHA-256 checksum, and overflow or trailing bytes fail"
cargo_lock_dependency_array_rule = "Cargo's canonical v4 serializer omits dependencies for a package with no dependency edges. The dedicated bootstrap-control lock is additionally held to bootstrap_validation_rule's exact shared lexical grammar: exact field/separator form, packages in name/semantic-SemVer/source PackageId order, and a present dependency array containing at least one exact row in strictly ascending raw-byte order. An explicit empty array, duplicate spelling, duplicate semantic edge, alternate empty representation, or lexical reformatting fails there. The 28 downstream command-produced locks remain byte-bookended and semantically strict under zip_rule but are not silently promoted to the bootstrap lock's narrower lexical-authority claim"
postcommand_snapshot_rule = "immediately after each producer command creates its lock, capture its complete checked snapshot; immediately before and immediately after every later command in that same root, reopen and rehash every lock then present there and require identical path, regular-file identity, byte length, and SHA-256, and at producer phase exit reopen and rehash all 28 locks again. The attester performs the identical pre-command, post-command, and phase-exit checks in its independent roots; a missing, extra, replaced, aliased, unreadable, or drifted lock is Fail even when the command exited zero or a later lock returns to the earlier bytes"
workspace_rule = "the first workspace default graph command operates on a fresh exact workspace copy with no lock, creates workspace lock, and requires its bytes equal the frozen final repository Cargo.lock; the other nine workspace graph commands and every workspace gate/package command consume that generated lock under --locked"
projection_rule = "each of the 26 projection resolve commands creates its own absent resolver-specific lock; target graph/check/symbol commands consume only the corresponding resolver-3 lock under --locked, and no resolver-2/3 lock may be copied, aliased, or shared"
consumer_rule = "consumer.resolve.default creates the one absent aggregate consumer lock; consumer.resolve.all, consumer.test.default, and consumer.test.all use that exact lock under --locked and may not mutate it"
attester_rule = "the attester repeats all 28 producers in independent fresh roots, requires the same exact command-to-lock mapping, and proves each complete lock byte-for-byte equal to its producer counterpart before semantic comparison"

