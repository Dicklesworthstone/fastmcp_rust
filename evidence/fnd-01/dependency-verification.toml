[cryptographic_and_symbol_scope]
runtime_target = "x86_64-unknown-linux-gnu"
rs256_rule = "execute only on the actual qualified host. Process source vectors in the closed order rfc7515-a2 then rfc7520-rs256 and cases per source in the closed order positive, truncate-signature, append-signature-byte, replace-exponent, wrong-algorithm, wrong-message. Independently decode every protected header, payload, modulus, exponent, and signature with canonical unpadded Base64url: nonempty ASCII [A-Za-z0-9_-] only, no padding/whitespace/standard-Base64 alphabet, length modulo four never one, zero unused tail bits, checked decoded bounds, and exact encode-after-decode equality. Reconstruct signing_input as protected plus one ASCII dot plus payload and require the frozen declared lengths and SHA-256 values. The transforms are respectively identity; remove the final signature byte; append raw signature byte 0x00; replace the exponent with raw 0x03; replace only the algorithm selector with PS256; and XOR 0x01 into the first encoded payload byte after the sole dot while retaining a Base64url-alphabet byte. Apply the closed preflight in order: selector is RS256, modulus is exactly 256 bytes with its high bit set, exponent is raw 0x010001, and signature length equals modulus length; only then invoke ring 0.17.14 RsaPublicKeyComponents with RSA_PKCS1_2048_8192_SHA256. Thus positive and wrong-message invoke ring; wrong algorithm, non-65537 exponent, and short/long signature fail before ring. The two OpenSSL matrix children cross-check only the unmutated positive vectors using exact create-new materialized inputs, pre/post checked file identities, canonical SPKI PEM, an exact default-provider-only configuration, exact argv/environment, and retained raw stdout/stderr. ring has no configurable process-global provider input, so there is no second ring configuration or comparison"
rs256_exact_counts = "ring cases 12: positive 2, negative 10, ring-invoked 4, preflight-rejected 8; OpenSSL positive 2; total observations 14, accepted observations 4, rejected observations 10, positive cross-implementation comparisons 2"
rs256_claim_ceiling = "host-only public RS256 verification of two frozen positive examples and five exact negative transforms per example. OpenSSL independently confirms only the two positives; the ten negatives are ring/preflight-only and ring 0.17.14 plus the ordinary harness remain their candidate/oracle TCB. No alternate-ring-configuration, JOSE parser, JWT validation, private-key, signing, key-generation, PEM-import, PSS, HMAC/none, ECDSA, universal-platform, or hostile-controller-resistance claim follows"
cross_target_rule = "the other four target triples receive compile and metadata qualification only; no cross-target binary is executed and no runtime, ABI, loader, entropy, filesystem, TLS-provider, or platform availability claim follows"
symbol_rule = "the eight applicable host builds emit Cargo JSON artifacts inside the same outer job; the one llvm-nm command scans that exact bounded artifact set in place on the worker, records tool identity, artifact pre/post length/hash, strict parsed symbols and findings, then package-artifacts retains only the policy-required final package objects rather than implying retention of intermediate object bytes"
symbol_claim_ceiling = "recognized symbol-line observations from the exact command-selected in-place host artifact identities and producer/attester-observed byte bindings under the closed classifier; no complete call graph, link-time reachability, runtime execution, stripped-section recovery, cross-target symbol scan, published-verifier rehash of intermediate objects, intermediate-object retention, or unobserved-object byte claim"

