exact_fields = ["recipe_count", "recipe_registry_sha256", "fixture_count", "fixture_registry_sha256", "assertion_count", "assertion_registry_sha256", "baseline_pass_count", "executed_count", "exact_single_trigger_count", "stable_diagnostic_count", "raw_finding_count", "cotrigger_resolution_count", "suppression_resolution_count", "unexpected_finding_count", "result_count", "result", "result_set_sha256"]
cardinality_rule = "recipe/assertion/result/baseline/executed/single-trigger/stable-diagnostic/cotrigger-resolution/suppression-resolution counts are exactly 188; fixture count equals fixture_contract; unexpected finding count is zero; raw finding count equals the checked sum across results; results are an exact global ID bijection in canonical family/source-index order"
semantic_rule = "run exactly one fresh isolated in-memory mutation per ID against the checked 68-source baseline, preserve quarantined payload nonexecution, record every derived finding, partition it into primary/allowed-cotrigger/declared-suppressed sets from the assertion alone, require no unexpected finding and the exact stable diagnostic rendered from assertion.logical_path, and never write a source, output, or scratch mutation copy"

[[receipt_schema]]
kind = "package_receipt"
receipt_id = "package-receipt"
table_name = "package_receipt"
exact_fields = ["artifacts", "artifacts_parent_count", "artifacts_parent", "command_package_list_set_sha256", "package_count", "package", "source_listing_count", "source_listing", "a_command_id", "b_command_id", "a_feature_mode", "b_feature_mode", "all_reproducible", "package_set_sha256"]
cardinality_rule = "artifacts is exact package-artifacts output binding and artifacts_parent is its exact three direct parent bindings/purposes; command_package_list_set_sha256 equals the directly parented command-results package_list_set_sha256, whose nine rows are joined by package_id rather than index; package rows follow the exact nine entry_ids/package_ids zip and authoritative actual archive source_listing rows follow package_ids; A is default features, B is all features, and both commands cover the same nine entry IDs"
semantic_rule = "consume without duplicating the nine command-results package-listing rows, bind every transformed byte to the staging snapshot, and join them to archives by package_id. During production strict-parse every A/B/canonical .crate, bind complete actual archive-member/source provenance and exclusions plus A/B scratch hashes, require A=B=canonical for every entry ID, compare Cargo.toml.orig only to the bound source manifest, and keep scratch outside retained outputs; no live repository source tree is opened. package_set_sha256 is the FND01RECv2 ordered record-set hash of all package-result rows in package_artifacts_contract.package_ids order, and each source_listing.member_set_sha256 is the corresponding ordered package-archive-member record-set hash. .1.15 performs fresh independent package-list plus A/B runs and compares both fresh sets to sealed canonical members"

[[receipt_schema]]
kind = "consumer_receipt"
receipt_id = "consumer-receipt"
table_name = "consumer_receipt"
exact_fields = ["package_artifacts", "package_receipt", "extraction_count", "extraction", "consumer_command_count", "consumer_command", "package_count", "package", "default_graph_sha256", "all_graph_sha256", "consumer_set_sha256"]
cardinality_rule = "exact nine checked extractions and nine package results; four aggregate consumer commands in command_expansion_registry order; binary and package receipt parents agree byte-for-byte"
semantic_rule = "generate one isolated aggregate packaged workspace patched only to the nine retained extractions, prove default/all graphs and no-run test compilation offline, bind each package's published features and source identity, and make no runtime or registry-publication claim. consumer_set_sha256 is the FND01RECv2 record-set hash of the nine complete consumer-package-result rows in consumer_contract.package_ids order"

[[receipt_schema]]
kind = "integration_index"
receipt_id = "integration-index"
table_name = "integration_index"
exact_fields = ["member_count", "member", "edge_count", "edge", "rank_count", "rank", "output_set_sha256", "edge_set_sha256"]
cardinality_rule = "members are exactly the other 13 outputs in canonical output_namespace order; edge is exactly all 47 direct semantic parent bindings ordered first by the child output's output_namespace/derived_output order and then within that child by ascending raw UTF-8 parent ID bytes exactly as required_parent_ids; rank has exactly 13 member rows whose ranks 1 through 11 have parent_contract.member_rank_counts_1_through_11, while integration-index itself is separately validated at parent_contract.integration_index_rank"
semantic_rule = "independently strict-parse and rehash every TOML member and every repeated binary member under its exact advisory-database, supply-bundle, command-streams, or package-artifacts container grammar; require each edge purpose byte string to equal the matching child's same-index parent_purposes entry; exclude integration-index itself and final-attestation; reject transitive-closure expansion, omitted intermediate bindings, digest-only binary acceptance, or purpose substitution; remain support_claim false"

[final_attestation_contract]
format = "fastmcp-fnd-01-final-attestation-v2"
schema_version = 2
attestation_id_literal = "FND-01/final-attestation"
path = "evidence/fnd-01/final-attestation.toml"
role = "independent-attester"
exact_fields = ["format", "schema_version", "attestation_id", "attester_bead", "attester_role", "run_id", "authoring_closure_sha256", "integration_seal_sha256", "producer_outer_transport", "policy", "verifier", "harness", "workspace_snapshot", "integration_index", "returned_gate_executable", "attester_bootstrap_control_build", "attester_bootstrap_exec_entry", "attester_staging_snapshot_count", "attester_staging_snapshot", "attester_staging_snapshot_set_sha256", "output_count", "output", "producer_command_count", "attester_command_count", "attester_excluded_command_ids", "attester_command_set_sha256", "producer_streams_sha256", "producer_lock_set_sha256", "attester_lock_set_sha256", "locks_byte_equal", "rerun_semantic_set_sha256", "verdict", "support_claim", "pending_count", "pending"]
output_rule = "workspace_snapshot is exactly the Cargo.lock FileBinding at integration_seal_contract.ordered_paths[0], integration_index is exactly the integration-index output-binding repeated byte-for-byte from the canonical output row, output_count is exactly 14, and output is an exact ordered bijection to all output_namespace.output_ids/output_paths/output_kinds rows in that canonical order; every output is independently reopened, rehashed, recursively parsed under its receipt or binary contract, and no missing, extra, duplicate, reordered, renamed, digest-only, or final-attestation self row is admitted"
entry_rule = "validate the external authoring marker and integration seal through the std-only bootstrap before any dependent Cargo; workspace_snapshot is the exact checked FileBinding for lexical Cargo.lock, byte-equal to the integration-seal Cargo.lock tuple and current bytes; rehash all sealed/workspace/integration bytes and require the producer namespace unchanged. Returned and published final-attestation bytes use one closed canonical TOML byte language shared by ordinary and Gate validation: nonempty UTF-8 without BOM, NUL, CR, comments, blank lines, edge whitespace, multiline values, dotted assignment keys, inline tables, or a missing terminal LF; every line is exactly one bare-key `key = value`, `[bare.path]`, or `[[bare.path]]`; strings use minimal double-quoted basic-string escapes, integers use minimal decimal, booleans are lowercase, arrays are single-line with exact comma-space separators, environment rows are exact two-string arrays, and optional strings are zero-or-one string arrays. Root direct fields, every recursively typed direct child field, all section/field orders, four staged groups with 163 complete file rows apiece, their declared VCS row counts, and the 14 output rows are exact; unknown, duplicate, reordered, alternate-spelling, or trailing syntax fails before semantic validation"
rerun_rule = "from fresh attester Cargo home/targets/scratch and the sealed supply bundle, independently perform and bind the one control build/exec transition, rerun exactly 204 non-acquisition evidence commands while excluding only the ordered attester_excluded_command_ids [bootstrap.resolve, bootstrap.fetch], regenerate all 28 offline locks, require each byte-for-byte equal to its producer counterpart, and compare canonical typed result sets without requiring raw stream equality. producer_streams_sha256 equals the canonical command-results streams.sha256 for the full compressed command-streams OutputBinding, and producer_lock_set_sha256 equals command-results postcommand_lock_set_sha256, the FND01RECv2 ordered set of postcommand-lock-binding rows in lockfile_producer_contract.lock_ids order. The attester-only attester_command_set_sha256, attester_lock_set_sha256, and rerun_semantic_set_sha256 commitments are computed and checked internally by sealed same-PID Attest before create_new; ordinary post-return verification and Gate grammar-check those commitments but cannot recompute them because attester rerun rows are intentionally not published. Producer and attester command row-set or raw-stream digests are never equated; only the 28 lock payload byte objects are pairwise equal, reported by locks_byte_equal. The attester retains the same exact four typed pre-list/pre-A/pre-B/post-B staging snapshot observations under its independent-attester run root; each carries all 163 complete file rows, derives its FND01WORKv1 summary, equals the sealed source byte authority, preserves attester-local file identities across the four phases, and independently repeats the exact package-root-to-POSIX-root .git symlink_metadata absent-not-found registry with stable path/device/inode/mode identities. attester_staging_snapshot_set_sha256 recomputes the recursive FND01RECv2 ordered record-set hash over the four rows, all 652 nested file rows, and every nested VCS-probe row; producer and attester filesystem identities are intentionally independent. Independently reparse mutation, package, consumer, source, license, advisory, symbol, KAT, and workspace evidence"
return_rule = "after all ordinary entry validation and rerun evidence pass, ordinary Attest first performs final_gate_executable_contract.build_origin_rule, creates and seals the exact returned_gate_executable_path_formula object, and binds that immutable object in returned_gate_executable. Only then does it write the completed attestation bytes once with create_new at final_gate_seal_contract.returned_attestation_path_formula beneath the hardcoded RCH-returned target subtree, fsync/reopen/strict-parse/rehash them, and make no later write. After RCH return root requires both exact objects, requires final_attestation_path and gate_executable_path_formula absent, and copies each byte object unchanged with create_new/fsync/reopen/rehash under its dedicated publication rule; returned and published FileBindings have distinct paths but identical nonzero length/SHA-256. A missing RCH return, early executable copy, direct remote repository write, normalization, repair, or overwrite fails"
self_exclusion_rule = "both returned and published final-attestation paths must be absent before their respective create_new operations; the attestation bytes are excluded from source tree, workspace snapshot, integration namespace/index/seal output list, output hashes, and their own preimage. They bind the delivered producer outer-record FileBinding but cannot contain or predict the attester transaction's eventual outer record or final-gate seal; only the later final read-only gate validates them against root-created values and never inserts either digest into the attestation"
verdict_rule = "the attestation's internal verdict is exact Pass only when the external integration seal's delivered post-return producer outer transport is exact, all producer receipts are Pass, every required output and direct edge is exact, the attester control transition and all 204 attester commands Pass, all 28 locks are byte-equal, semantic rerun sets agree, the delayed ordinary-produced returned_gate_executable is present and exactly bound, pending is empty, and support_claim is false; the overall FND-01 verdict remains Pending on final_gate_seal_contract until root observes attester return and the final read-only gate validates that seal; any producer repair, early or missing gate-executable copy, missing/extra/invalid byte, failed rerun, or unsupported-as-skipped coordinate is Fail"
claim_ceiling = "independent read-only revalidation of the sealed local evidence on one qualified Linux x86_64 worker; no aggregate MCP 2026-07-28 support, signature, remote provenance, universal platform, or hostile-controller claim. The final Gate independently validates the closed attestation language, retained output bindings, exact role/run staging root, file-derived FND01WORKv1 summaries, cross-phase attester-local file/root/VCS identities, and the complete pinned-Cargo .git probe registry; the exact ordered 163 path/length/SHA-256 equality to the sealed source-snapshot authority is established inside same-PID Attest and is not independently recomputed by Gate because Gate does not recursively decode that source-snapshot payload"

