direct_dependency_order = "ascending raw UTF-8 package bytes, then raw canonical version bytes, source bytes, false before true default_features, and lexicographic sorted unique feature-byte arrays; ordinal is the exact zero-based position, so asupersync 0.3.10 precedes 0.3.9"
direct_dependency_registry_encoding = "ASCII FND01BOOTSTRAPDIRECTv1 followed by NUL, u32be 45, then each row as u32be ordinal, u32be-length-prefixed package/version/source, one default-features byte, u32be feature count and each sorted unique feature as u32be length/raw bytes, and one verifier-dependency byte"
