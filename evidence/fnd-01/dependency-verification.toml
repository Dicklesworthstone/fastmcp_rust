[advisory_database_contract]
commit = "7c7ccac53056b87f69ac677f15ea2d9a98a6f8e2"
source_file_count = 1192
source_total_bytes = 1283107
source_tree_format = "FND01ADVISORYDBv1"
source_tree_encoding = "ASCII FND01ADVISORYDBv1 followed by NUL and u32be file count, then for every non-.git regular file ordered by ascending raw relative POSIX UTF-8 path bytes: u32be path length, path bytes, u64be file length, and raw SHA-256 of exact bytes"
source_tree_sha256 = "46fb537408ee3bb371b7071eaa6ce2a03a31589995444dbac1c69a52f6817164"
container_format = "FND01ADVISORYBUNDLEv1"
container_header_encoding = "ASCII FND01ADVISORYBUNDLEv1 followed by NUL, u32be(40), the exact 40 lowercase-hex commit-label bytes, u32be source_file_count, u64be source_total_bytes, and raw 32-byte source_tree_sha256"
container_member_encoding = "for every complete non-.git regular file ordered by ascending raw relative POSIX UTF-8 path bytes: u32be path length, path bytes, u64be exact file length, raw 32-byte SHA-256, then exact file bytes; EOF follows the final member"
container_path_rule = "every member is a nonempty safe relative POSIX UTF-8 path satisfying bounds, with no absolute/backslash/drive/empty/dot/dot-dot/NUL component, no .git component or descendant, no duplicate, and no ASCII-case collision; capture rejects symlinks, hardlinks, directories as members, and special files"
source_observation_rule = "producer-environment carries one dedicated advisory-database-source-observation for the physical source directory; commit is an opaque metadata label only and makes no Git object, repository, signature, origin, freshness, or authentication claim"
dependency_binding_rule = "dependency-receipt carries one advisory-database-binding whose output is the exact advisory-database output binding and whose summary fields equal both the container header and this contract; its claim ceiling is frozen-database-conservative-package-version-evaluation-only"
authoring_requirement = "none; .1.14 does not inspect an ambient advisory database, invoke Git, or require these bytes to exist"
downstream_receipt_rule = ".1.1 supplies one advisory_database_binding whose commit, complete regular-file count, byte count, and canonical tree digest equal this contract; .1.15 independently rehashes the same supplied database bytes before final PASS"
evaluator_rule = "the downstream bounded policy-native offline evaluator parses the supplied RustSec Markdown TOML front matter, RustSec version requirements, withdrawal and informational metadata, and exact projection graph package identities; it never treats the commit label alone as advisory clearance"

[dependency_policy]
purpose = "exact policy-native replacement for a cargo-deny observation; decisions are derived from frozen graph and byte evidence and do not claim use of cargo-deny, deny.toml, an organization-wide policy, or general supply-chain safety"
banned_package_ids = ["async-std", "axum", "hyper", "reqwest", "smol", "tokio", "tower"]
banned_package_match = "exact case-sensitive Cargo package name equality at every reachable non-root projection graph node; versions, package IDs, aliases, features, and target conditions do not exempt a match"
allowed_source_kinds = ["root", "path", "registry"]
git_sources_allowed = false
registry_source_locator = "registry+https://github.com/rust-lang/crates.io-index"
registry_rule = "every registry node has the exact normalized crates.io identity and checksum and the downstream source inventory binds one supplied crate archive whose raw SHA-256 equals that checksum; alternate registry, source replacement, missing checksum, git, network-only metadata, or ambient unbound cache bytes fail"
path_rule = "the one synthetic root is source_kind root; a path node must resolve without links beneath the exact frozen repository workspace snapshot or the exact generated projection root and must be byte-bound by source_inventory; absolute, parent, external, alternate extraction, or unbound path sources fail"
license_expression_grammar = "bounded UTF-8 tokens consisting only of declared license identifiers, exact operators AND, OR, WITH, balanced parentheses, and ASCII whitespace; legacy `/` between complete identifiers and lowercase `or` are normalized to OR, and a trailing `+` is normalized to the matching `-or-later` identifier only for MPL-2.0; empty, LicenseRef other than the one exact custom identifier, NONE, NOASSERTION, malformed, unknown, duplicate-operator, or trailing input fails"
allowed_license_identifiers = ["0BSD", "Apache-2.0", "BSD-1-Clause", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "BlueOak-1.0.0", "CC0-1.0", "CDLA-Permissive-2.0", "ISC", "MIT", "MIT-0", "MPL-2.0", "MPL-2.0-or-later", "NCSA", "Unicode-3.0", "Unicode-DFS-2016", "Unlicense", "WTFPL", "Zlib", "Zlib-acknowledgement"]
allowed_license_exceptions = ["LLVM-exception"]
allowed_custom_license_references = ["LicenseRef-MIT-OpenAI-Anthropic-Rider"]
license_decision_rule = "an identifier is accepted only when in an exact allowed list; A AND B is accepted only when both are accepted, A OR B when at least one is accepted, and A WITH E only when A and E are accepted; every graph node must have one normalized manifest license expression and one or more exact manifest/license/readme evidence-file bindings, so license-file-only or missing metadata fails"
license_expression_normal_form = "parse with precedence WITH above AND above OR, discard redundant parentheses, and serialize the minimal unambiguous form with one ASCII space around operators and no other whitespace; normalize exact lowercase or and exact / operators to OR and normalize exact MPL-2.0+ to MPL-2.0-or-later before validation"
source_decision_pass_literal = "bound"
license_decision_pass_literal = "allowed"
advisory_decision_pass_literal = "clear"
banned_decision_pass_literal = "not-banned"
target_decision_pass_literal = "reachable"
advisory_decision_rule = "evaluate every reachable exact package/version against the entire frozen advisory database; an active affected non-informational non-withdrawn advisory is vulnerable and fails, while patched, unaffected, withdrawn, and informational matches remain explicit non-vulnerability findings and cannot be silently omitted"
target_rule = "each dependency_deny entry evaluates the exact target-filtered metadata graph for its projection-target coordinate; projection-level source, license, and advisory inventories are exact unions across all five target graphs and the entry must select a complete node-identity subset without inventing target-independent reachability"
pass_rule = "license_policy_pass, ban_policy_pass, source_policy_pass, and advisory_policy_pass are independently recomputed and all must be true; a false dimension prevents a pass receipt rather than being relabeled, waived, or omitted"

[source_inventory_contract]
projection_node_set = "for each projection, sorted identity union of every node in its five strict projection_target metadata graphs; a node occurring on multiple targets is represented once"
registry_archive_rule = "for every registry node derive the exact package/version/checksum archive identity, require .1.1 to supply the corresponding immutable crate-archive bytes, require raw SHA-256 equal Cargo metadata checksum, parse its gzip and tar containers with package_contract path/type/collision/size rules, and hash every regular member beneath its one exact package root without writing or trusting registry/src; archive_inventory binds every supplied archive and .1.15 independently rehashes and reparses the same supplied byte objects before final PASS"
archive_inventory_rule = "archive_inventory contains exactly the downstream-union registry packages from supply-receipt, ordered by complete canonical package_id bytes then version bytes; each row joins that package to the unique supplied archive path, compressed length and SHA-256, parsed regular-member count, and parsed full-root member-tree SHA-256"
archive_claim_ceiling = "complete supplied downstream registry archive bytes and parsed member summaries only"
workspace_package_ids = ["fastmcp-cli", "fastmcp-client", "fastmcp-console", "fastmcp-core", "fastmcp-derive", "fastmcp-protocol", "fastmcp-rust", "fastmcp-server", "fastmcp-transport"]
package_list_command_order = ["fastmcp-cli", "fastmcp-client", "fastmcp-console", "fastmcp-core", "fastmcp-derive", "fastmcp-protocol", "fastmcp-rust", "fastmcp-server", "fastmcp-transport"]
package_list_stream_grammar = "strict UTF-8, no BOM/NUL/CR, one nonempty path per LF-terminated line, final LF required even for the nonempty list, no leading/trailing ASCII whitespace, and no duplicate row; each path satisfies the repository relative-path component grammar after interpreting it package-root-relative. raw_byte_length and raw_line_sha256 cover exactly the non-LF path bytes for that line, while package-listing.raw_stdout fields cover the complete concatenation including every required LF, so reconstructing each raw row plus one LF must reproduce stdout byte-for-byte. Bind every line to that command ID plus exact origin and ordinal before decoding, then sort transformed typed rows by ascending raw UTF-8 path bytes"
package_list_execution_rule = "after the immutable workspace snapshot is copied to package_contract.source_root and its no-follow closure passes, and before any source inventory or package A/B command, run exactly one package-list command per workspace_package_ids member in package_list_command_order against that member's exact staging manifest; parse the complete stdout under package_list_stream_grammar, retain complete stdout and stderr without interpreting stderr as membership, and derive no path from the live repository, VCS, ambient current directory, or a second Cargo query"
