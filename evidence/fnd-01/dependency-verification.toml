[closed_child_handoff_contract]
purpose = "immutable policy-authoring-time byte handoff for implementation outputs owned by completed child beads rather than the .1.1 integration producer; the later workspace snapshot is an additional final-state binding and may never replace or rebase this baseline"
owner_excluded_from_integration_producer = "bd-mcp-2026-07-28-support-ahet.1.1"
binding_count = 6
binding_exact_fields = ["path", "owner_scope", "byte_length", "sha256"]
binding_order = ["crates/fastmcp-core/src/crypto.rs", "crates/fastmcp-core/src/uri.rs", "crates/fastmcp-server/src/auth.rs", "crates/fastmcp-server/src/oauth.rs", "crates/fastmcp-server/src/oidc.rs", "crates/fastmcp-transport/src/websocket.rs"]
baseline_rule = "before any integration-producer write or generated input, no-follow open every exact path, require one regular non-link file, and require exact byte length and SHA-256 equal its row; repeat after every producer command/write, immediately before directory publication, in ordinary read-only verification, and independently in final attestation"
ownership_rule = "the .1.1 producer has no authority to create, rewrite, format, normalize, truncate, replace, move, or delete any bound path; byte drift is a terminal ownership violation even if sparse semantic surface rules and the final workspace snapshot would otherwise pass"
closed_set_rule = "these six rows are the complete non-.1.1-owned implementation-output handoff set present outside the immutable 68-file evidence source tree; policy/verifier self-binding and .1.1-owned manifests, docs, workflows, facade wiring, and test integration remain governed by their explicit contracts rather than silently joining this set"
registry_encoding = "ASCII FND01CHILDv1 followed by NUL and u32be binding_count, then each row in binding_order as u32be path length/path bytes, u32be owner_scope length/bytes, u64be byte_length, and raw 32-byte SHA-256"
registry_sha256 = "93aec08a25abfa66fb6f7b8121cbe034ab6d2cf251e2c2a117b6d40859f11d61"

[authoring_closure_contract]
purpose = "non-circular immutable handoff for the three .1.14-owned files: this policy cannot contain its own digest, so the independent quiet-window reviewer/tracker record is the sole authority and .1.1/.1.15 may consume but never originate, replace, or rebase it"
marker_environment = "FASTMCP_FND01_AUTHORING_CLOSURE"
ordered_paths = ["evidence/fnd-01/dependency-verification.toml", "crates/fastmcp/tests/fnd_01_dependency_evidence.rs", "crates/fastmcp/examples/fnd_01_evidence_harness.rs"]
marker_exact_grammar = "literal FND01AUTHORv2, colon, canonical nonzero decimal policy byte length, colon, 64 lowercase hexadecimal policy SHA-256, colon, canonical nonzero decimal verifier byte length, colon, 64 lowercase hexadecimal verifier SHA-256, colon, canonical nonzero decimal harness byte length, colon, 64 lowercase hexadecimal harness SHA-256, colon, 64 lowercase hexadecimal closure SHA-256; no whitespace, sign, leading zero, duplicate field, trailing byte, alternate encoding, or file fallback"
closure_preimage = "ASCII FND01AUTHORv2 followed by NUL and u32be(3), then for each ordered_paths row: u32be path byte length, exact path UTF-8 bytes, u64be nonzero file byte length, and raw 32-byte SHA-256"
quiet_window_rule = "the root orchestrator alone performs the independently reviewed quiet window, rehashes all three ordered files at its prescribed samples, resets the window on any byte or metadata drift, and computes the closure only after a stable final sample; neither bootstrap mode reruns, abbreviates, or self-certifies the quiet window"
authority_rule = "the root orchestrator accepts exactly one quiet-window `POLICY+VERIFIER+HARNESS SCHEMA GRAMMAR STABLE` handoff from the .1.14 authoring agent only after independent final review and the exact preclosure verifier and harness preflight passes, computes/verifies marker_exact_grammar and closure_preimage, and supplies that identical opaque marker independently to the .1.1 producer, .1.15 attester, and final read-only gate; it is not read from the repository, producer output, integration receipt, mutable scratch, command stream, or .1.1-controlled configuration"
preclosure_preflight_rule = "before the stable marker exists, .1.1 may make only the exact integration_surface_contract manifest/toolchain/lock edits, execute only the ordinary crates/fastmcp/tests/fnd_01_dependency_evidence.rs test, and compile-check only the exact crates/fastmcp/examples/fnd_01_evidence_harness.rs example through serialized RCH; it may not alter policy/verifier/harness/source/closed-child bytes, execute either bootstrap mode, execute the integration command matrix, or write integration outputs; any defect returns ownership to .1.14, and a passing preflight grants no integration or support claim"
entry_rule = "after the exact preclosure verifier and harness preflight and before any integration-producer command or integration write, parse the independently supplied marker, checked-snapshot read all three ordered files, and require exact lengths/hashes plus closure digest; retain the parsed tuple in role state and repeat all three byte checks after every integration command/write, before each publication, after publication, and during final verification; the attester has no preclosure exception"
separation_rule = "the producer and attester independently receive and validate the same external marker rather than trusting any repository or receipt copy; producer_environment and final_attestation policy/verifier/harness length and digest fields must equal the marker tuple, while the closure digest is repeated only as an external authority binding and never accepted from a self-asserting repository fallback"
failure_rule = "missing/malformed marker, a marker not supplied by the quiet-window orchestration channel, unequal producer/attester/final marker, any byte drift, or any attempted dynamic acceptance/rebase is terminal before further work"
claim_ceiling = "external orchestration binding of exact final policy, verifier, and harness bytes; no repository self-signature, Git-history immutability, author identity, public-key signature, or hostile-controller resistance is claimed"

