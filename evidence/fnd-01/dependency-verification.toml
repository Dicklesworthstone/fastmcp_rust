[repository_surface_contract]
purpose = "bounded file-aware semantic closure for the FND-01 toolchain, fail-closed CI/release handoff, and truthful current documentation; workspace_snapshot hashes bind bytes but do not substitute for these decisions"
file_count = 8
paths = [".github/workflows/ci.yml", ".github/workflows/release.yml", "AGENTS.md", "README.md", "FEATURE_PARITY.md", "CHANGELOG.md", "crates/fastmcp/src/lib.rs", "rust-toolchain.toml"]
text_rule = "every file is a no-follow workspace_snapshot regular file at most bounds.max_source_file_bytes, strict UTF-8, BOM/NUL/bare-CR free; LF or CRLF is admitted but normalized only for classifier comparison, except strict-toolchain-contract consumes and compares the exact raw bytes with no newline or textual normalization; exact original bytes always remain snapshot-bound"
workflow_paths = [".github/workflows/ci.yml", ".github/workflows/release.yml"]
workflow_grammar = "parse the two selected files as the restricted GitHub Actions YAML surface needed by the rule registry: indentation is multiples of two ASCII spaces, tabs/anchors/aliases/merge keys/flow maps/multiline folded scalars/duplicate mapping keys are rejected, comments are removed only outside single/double quoted scalars, and jobs, steps, scalar uses/run/needs/if/with/if-no-files-found values, literal run blocks, and step order are retained; a syntactically valid construct outside this closed subset fails rather than being ignored"
toolchain_rule = "every job that executes cargo, rustc, rustdoc, rustfmt, or clippy has, before its first such command, exactly one setup path that selects literal nightly-2026-07-11 and no floating/bare stable/beta/nightly/date-variable/channel-variable fallback; the selected target/component set remains explicit and rust-toolchain.toml parses under workspace_manifest_integration_contract"
blocking_command_rule = "a required gate command is one shell simple-command segment with no `||`, `&& true`, pipeline whose status can mask the gate, backgrounding, command substitution, `continue-on-error`, step-level fail-open if, ignored exit, or error-catching fallback; run blocks that need multiple commands begin with exact `set -euo pipefail` on POSIX or `$ErrorActionPreference = 'Stop'` on PowerShell and do not later disable the mode"
ci_rule = "CI contains blocking formatting, workspace/all-target check, workspace/all-target clippy with -D warnings, default and all-feature workspace tests, docs with warnings denied, exact FND-01 verifier tests, blocking cargo audit, and package-list/package-build consumer gates; security/advisory execution failure, missing database/input/artifact, skipped/filtered/xfail/not-run gate, or an absent required job fails"
release_rule = "release contains a pre-publish verification job covering the FND-01 verifier and all nine package-list/package-build consumer gates; every GitHub release and crates.io publish job has explicit needs including that verification job and all artifact-producing prerequisites. The build matrix is exactly the five ordered target/runner/binary/archive rows encoded by SURF-RELEASE-ASSET-CLOSURE: aarch64-apple-darwin/macos-14/fastmcp/dist/fastmcp-darwin-arm64.tar.xz, aarch64-unknown-linux-gnu/ubuntu-24.04-arm/fastmcp/dist/fastmcp-linux-arm64.tar.xz, x86_64-apple-darwin/macos-15/fastmcp/dist/fastmcp-darwin-amd64.tar.xz, x86_64-pc-windows-msvc/windows-latest/fastmcp.exe/dist/fastmcp-windows-amd64.exe.zip, and x86_64-unknown-linux-gnu/ubuntu-latest/fastmcp/dist/fastmcp-linux-amd64.tar.xz. Every workflow action identity and per-file occurrence count is governed by SURF-WORKFLOW-ACTION-IDENTITIES, including exact release identities actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a, actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c, and softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 rather than tags or prefix matches. Each row asserts the binary before archive creation, the archive before lowercase-SHA256 sidecar creation, and both before an exact two-path upload with if-no-files-found error; merged download bytes are compared against the exact ten-path closed set before an exact ten-path GitHub release. No `[ -f ]`, positive Test-Path conditional skip, wildcard path, `|| echo`, missing-artifact ignore/warn, retry that reclassifies a semantic failure, or parallel publish can bypass a failed/missing prerequisite"
documentation_current_scope = "README.md, FEATURE_PARITY.md, and the crate-level `//!` documentation prefix of crates/fastmcp/src/lib.rs are entirely current support surfaces; AGENTS product claims are scanned only in the exact `## Toolchain: Rust & Cargo` section and exact `## FastMCP Rust — This Project` section, never the separately frozen Agent Mail/Beads/RCH operational guidance; CHANGELOG.md is split at exact H2 headings, only the leading `[Unreleased]` section is current, every released-version section is historical and exempt from positive-claim rejection, and the verifier never rewrites or requires removal of historical text"
documentation_toolchain_rule = "AGENTS and README current installation/prerequisite text plus the CHANGELOG Unreleased migration entry each name exact nightly-2026-07-11 and rust-version 1.99, never Rust 1.85, 1.85+, a bare/arbitrary nightly, or stable-1.99 support; a badge/query encoding is decoded before matching"
documentation_claim_rule = "the selected AGENTS product section, README.md, FEATURE_PARITY.md, the crate-level `//!` documentation prefix, and CHANGELOG Unreleased each contain the exact explicit sentence `Aggregate MCP 2026-07-28 support is not claimed by FND-01.` (with the Rust doc-comment prefix ignored for sentence comparison); outside historical CHANGELOG and frozen nonproduct AGENTS sections reject aggregate 100%, production-ready/production ready, feature-complete/feature complete, all-complete/all completed, and `Complete ... all MCP features`. For SURF-DOC-NO-OPTIONAL-CLAIM, decode each valid `%HH` byte exactly once and reject an alphanumeric malformed escape, ASCII-case-fold, and collapse every ASCII-whitespace/hyphen/underscore run to one space. One Markdown table/bullet/heading LF line is one row; other maximal nonempty nontable line runs are one paragraph. Parse the row pattern's exact simple, compound-conjunction, affirmative, and qualifier registries; a unit containing a registered capability and affirmative marker is forbidden unless that same normalized unit contains unavailable, planned, or unverified. No cross-row/paragraph qualifier carries. An affirmative Icons unit is admitted only when that same unit contains metadata only and contains none of image decode, image rendering, or media rendering"
under_implementation_sentence = "MCP 2026-07-28 support is under implementation and remains unverified."
historical_changelog_boundary = "first exact bytes `## [v0.2.0] -- 2026-02-15 (GitHub Release)\\n`"
historical_changelog_suffix_byte_length = 26197
historical_changelog_suffix_sha256 = "b60b20598d6dc78970e39d43efdade2cbebd0c7930528e3c5ad40ed941471dc1"
historical_changelog_rule = "locate historical_changelog_boundary exactly once after the leading Unreleased section and require every byte from its first `#` through EOF to have the exact frozen byte length and SHA-256; required Unreleased insertions occur strictly before this boundary, so no historical release wording, link, whitespace, or line ending can be rewritten while current claim classifiers still ignore that immutable suffix"
agent_behavior_rule_count = 14
agent_behavior_rule_exact_fields = ["id", "required_exact_substring", "byte_length", "sha256"]
agent_behavior_rule_registry_sha256 = "fc0aa90889c6fa5e72f4a392a9b53a72631ecd76ddbf0d6fa78f8695de6d396e"
agent_behavior_registry_encoding = "ASCII FND01AGENTRULEv1 followed by NUL and u32be row count, then rows in agent_behavior_rule order as u32be id length/id bytes and u32be required_exact_substring length/exact bytes"
agent_behavior_rule = "each exact substring occurs once in final AGENTS.md with its declared byte length and SHA-256; the complete ordered registry digest equals agent_behavior_rule_registry_sha256, so toolchain/support-truth edits cannot silently weaken deletion, Git, branch, Cargo, async-runtime, editing, compatibility, compiler, test, research, bv, or UBS behavioral instructions"
agent_frozen_segment_count = 3
agent_frozen_segment_order = ["AGENTS-PREFIX-BEFORE-TOOLCHAIN", "AGENTS-EDITING-THROUGH-THIRD-PARTY", "AGENTS-OPERATIONAL-SUFFIX"]
agent_frozen_segment_rule = "resolve each exact byte boundary uniquely in final AGENTS.md and hash the half-open segment without newline normalization; the three declared pre-edit byte lengths and SHA-256 values must remain exact, while only the toolchain section and FastMCP product-description section between those immutable boundaries may receive the required truth edits"
rule_count = 23
