recursive_root_rule = "these 17 exact selectors are the complete recursive-record roots: ten receipt roots dispatch first through the externally pinned receipt_schema registry, final-attestation through final_attestation_contract.exact_fields, gate-input, gate-result, control-ledger, and acquisition-spool through their exact root record_schema IDs, and the mandatory FND01OUTERv2 lifecycle tails through producer-outer and attester-outer. No root is inferred from a child selector, accepted as a generic table, or omitted from recursive unknown-field/type validation"
