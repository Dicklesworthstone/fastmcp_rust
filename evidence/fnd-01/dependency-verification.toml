record_registry_bound_rule = "before allocating or decoding any row, enforce bounds.max_record_registry_bytes over the checked sum of the complete FND01RECSCHEMAv2 and FND01RECVARIANTv1 canonical byte strings, and independently require each byte string not to exceed that bound. The byte-length/SHA mirrors must equal the independently compiled authority; semantic row counts, selectors, child closure, and shape parity must already be exact, and no policy mirror, per-row limit, or trailing ignored byte substitutes for compiled authority"
record_schema_verifier_authority_rule = "the verifier pins the literal schema ID/version plus both record and variant canonical headers, row schemas, counts, byte lengths, and SHA-256 values in compiled Rust; these policy-declared mirror values never authorize a changed registry. Validation of both pinned registries, selector/discriminator uniqueness, child-target closure, and recursive-root completeness precedes parsing any receipt, attestation, gate, ledger, or spool"
record_field_type_authority_rule = "the compiled verifier owns one exhaustive exact type entry for every (root-or-schema-id, direct-field) pair, including unsigned versus signed integers, text versus raw bytes, homogeneous scalar/record arrays and their one element type, maps and their one value type, child schemas, count-field widths/relationships, and the two closed three-way tagged-union dispatch sites for supply entries and acquisition anchors. It explicitly types producer-outer and attester-outer as outer-lifecycle roots; portable Unix file/directory/socket identities; daemon pre/post records; strict status argv/environment/signed-exit/raw-stream/running/socket/required-unsigned-uptime fields; gate raw streams and signed rch_exit_code; and both sparse-cache selected version/ordinal/SHA array families. It never infers a type from the current TOML value, an empty array, a field name, serde coercion, policy prose, or a producer tag; a missing/duplicate type entry or encoded tag different from the compiled entry fails before semantic validation"
record_presence_rule = "for record_schema, exact_fields is structurally the ordered required-field registry and optional_fields is the globally explicit empty set for every ID in record_schema_no_optional_field_ids; no record_schema field is optional. A required field whose compiled direct-field type is explicit optional, including only controller requested_worker on this lifecycle surface, is always present and is represented only by a homogeneous array of length zero for absent or length one containing the exact compiled scalar/record value for present; field omission, a second element, sentinel string/integer/boolean, empty inline table, or inference from the current value fails, and FND01RECv2 canonicalization converts only that checked zero/one array to tag 0x08 plus its presence byte. Status uptime_seconds is instead one mandatory unsigned value and missing/null is terminal. Raw-byte direct fields are admitted only in the named binary record roots, including outer lifecycle and gate/controller stream children, and have no TOML surrogate. record_variant_schema rows separately carry their ordered required_fields and optional_fields arrays; those optional_fields use structural field absence/presence and do not use the required-field zero/one value representation. A field omitted from required_fields or present in optional_fields without a pinned variant row fails"
