[projection_contract]
projection_row_count = 13
projection_row_exact_fields = ["id", "disposition", "evidence_verdict", "support_claim", "dependency_count", "probe_sentinel"]
dependency_row_count = 19
dependency_row_exact_fields = ["projection_id", "alias", "package_id", "version", "source_kind", "source_locator", "checksum_sha256", "default_features", "features", "dependency_kind", "optional"]
dependency_order = "projection output_namespace order, then ascending raw alias bytes"
projection_root_formula = ".fnd01-run/<role>/<run-id>/projections/<projection-id>"
manifest_path_formula = ".fnd01-run/<role>/<run-id>/projections/<projection-id>/Cargo.toml"
lockfile_path_formula = ".fnd01-run/<role>/<run-id>/projections/<projection-id>/Cargo.lock"
probe_source_path_formula = ".fnd01-run/<role>/<run-id>/projections/<projection-id>/src/probe.rs"
resolver2_projection_root_formula = ".fnd01-run/<role>/<run-id>/projections-resolver2/<projection-id>"
resolver2_manifest_path_formula = ".fnd01-run/<role>/<run-id>/projections-resolver2/<projection-id>/Cargo.toml"
resolver2_lockfile_path_formula = ".fnd01-run/<role>/<run-id>/projections-resolver2/<projection-id>/Cargo.lock"
resolver2_probe_source_path_formula = ".fnd01-run/<role>/<run-id>/projections-resolver2/<projection-id>/src/probe.rs"
package_name_formula = "fnd01-projection-<projection-id>"
manifest_header_exact_template = "[package]\nname = \"fnd01-projection-<projection-id>\"\nversion = \"0.0.0\"\nedition = \"2024\"\nlicense = \"MIT\"\npublish = false\n\n[lib]\npath = \"src/probe.rs\"\n\n[[bin]]\nname = \"fnd01-target-probe\"\npath = \"src/probe.rs\"\n\n[dependencies]\n"
manifest_header_substitution = "replace every literal <projection-id> token with the exact projection id and make no other change"
manifest_dependency_encoding = "one dependency per LF-terminated line in projection_dependency order: a double-quoted alias, ` = { package = ` plus double-quoted package_id, `, version = ` plus double-quoted exact =version, then for path rows `, path = ` plus double-quoted repository-relative path rewritten relative to projection_root, then `, default-features = ` plus lowercase boolean and, only when features is nonempty, `, features = [` plus comma-space-separated JSON-style double-quoted features in stored order plus `]`, then ` }`; registry rows omit path and use the default crates.io registry only"
manifest_footer_exact = "\n[workspace]\nresolver = \"3\"\n"
resolver2_manifest_footer_exact = "\n[workspace]\nresolver = \"2\"\n"
manifest_final_newline_rule = "manifest_header_exact_template plus dependency lines plus manifest_footer_exact has exactly one final LF"
resolver2_manifest_rule = "materialize a second isolated root using the identical header, dependency rows, and probe bytes but resolver2_manifest_footer_exact; its distinct root/manifest/lock/probe paths are closed, byte-bound, never canonical or published as workspace support, and cannot reuse, overwrite, alias, hardlink, or substitute resolver-3 bytes"
manifest_warning_rule = "Cargo emits no unused-manifest-key warning; any warning mentioning resolver or another generated key fails"
manifest_workspace_rule = "the exact trailing workspace table makes the projection its own resolver-3 workspace under the outer repository; it has no members, default-members, exclude, package inheritance, dependencies, lints, metadata, or additional keys"
manifest_forbidden_sections = ["patch", "replace", "build-dependencies", "dev-dependencies", "target"]
manifest_forbidden_inheritance = true
manifest_forbidden_unlisted_dependencies = true
path_dependency_rule = "source_locator is repository-relative; the generated Cargo manifest path value is its unique mechanically minimal lexical relative path from projection_root and may contain only the leading ../ components needed to reach that checked repository source. This scoped decoded-manifest value is not an admitted policy/filesystem path and does not widen paths.allow_dot_dot_components; lexical join/normalization must equal the one source_locator beneath the checked repository root without escaping it. Filesystem canonicalization, symlinks, absolute paths, extra dot components, nonminimal traversal, and alternate workspace copies are forbidden"
registry_dependency_rule = "source_locator is exactly registry+https://github.com/rust-lang/crates.io-index, checksum_sha256 is lowercase SHA-256, the exact package/version/checksum must have an immutable supplied crate-archive byte object independently bound by archive_inventory and source_inventory, and source replacement is forbidden"
probe_source_exact_template = "#![forbid(unsafe_code)]\npub const FND01_SENTINEL: &str = \"<probe-sentinel>\";\n\nfn main() {\n    println!(\"{FND01_SENTINEL}\");\n}\n"
probe_source_substitution = "replace the one literal <probe-sentinel> token with matching projection.probe_sentinel and make no other change"
