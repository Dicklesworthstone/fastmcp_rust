[cargo_config_discovery_contract]
discovery_rule = "for every Cargo child working directory, first require the absolute CWD and every ancestor component are physical non-symlink directories and lexical ancestry equals physical ancestry; before invocation walk that exact physical CWD through every filesystem ancestor up to and including / and checked-snapshot test both .cargo/config.toml and .cargo/config at each level. Separately require the fresh role CARGO_HOME contains neither config name. Any symlink ambiguity or discovered file is terminal Fail, because an explicit --config merges with rather than suppresses Cargo discovery"
generated_path_rule = "the one generated role/run config is a regular nlink-one no-link file at the absolute lexical scratch path <bootstrap-control-package-root>/cargo-config.toml or its policy-defined per-command equivalent and is never beneath a directory named .cargo. Every Cargo argv passes that absolute path as the final --config value except exactly bootstrap.resolve and bootstrap.fetch, which are the pre-materialization online-acquisition commands and omit --config because the sealed local registry does not yet exist, and the existing exact nonresolving workspace.gate/fmt coordinate. The acquisition argv must not contain the later sealed-local config or any other --config value; all exceptions still perform discovery_rule's complete physical-CWD ancestor scan and fresh CARGO_HOME config-absence scan before invocation"
exact_toml_rule = "strict duplicate-key-free TOML containing only [source.crates-io] replace-with=\"fnd01-sealed-local\" and [source.fnd01-sealed-local] local-registry=<one absolute lexical materialization-root path>; no include, registry table, credentials, net, http, proxy, git, sparse, vendor, directory, second source, relative path, environment interpolation, or unknown field"
source_replacement_rule = "deny every source replacement except that exact crates-io to fnd01-sealed-local mapping; require it exactly once and require the selected local-registry path and config bytes to equal the sealed supply receipt"

[publication_contract]
returned_root_formula = "target/debug/fnd-01/<run-id>/return"
publication_staging_formula = ".fnd01-run/publication/<run-id>"
quarantine_root_formula = ".fnd01-run/quarantine/<run-id>/<phase>"
quarantine_candidates = ["target/debug", "target/doc", "target/release", "target/.rustc_info.json", "target/CACHEDIR.TAG"]
quarantine_rule = "before each outer RCH invocation, substitute phase with exactly producer, attester, or gate, require that phase root fresh, checked-snapshot inspect each existing exact candidate, atomically rename it beneath that phase root without replacement, and record its original/quarantined metadata; absence is recorded. All three phase quarantines are immutable through the final gate, collectively obey one quarantine cap, and cannot be reused as evidence or as one another's destination. After the final audit only an exact-path cleanup separately and explicitly authorized by the user may remove non-evidence quarantine/build residue; the evidence record is retained and automatic/unbounded cleanup remains forbidden"
quarantine_history_rule = "before renaming any quarantine candidate, enumerate it with the bounded no-follow walker and reject any prior-run target/debug/fnd-01/<other-run-id>/return subtree or any evidence-eligible retained path. Such a prior return is reported as exact stale non-evidence residue and blocks the new run until a separate user-authorized exact-path disposition; it is never silently moved beneath the new run's quarantine, charged as newly created evidence, overwritten, nested into another quarantine generation, or treated as the active run's return tree"
fresh_run_rule = "run-id scratch, return, staging, integration destination, and final attestation destination required by the active role must be absent before creation; only an exact metadata/open failure with ErrorKind::NotFound establishes absence, while PermissionDenied, I/O failure, traversal failure, or every other error is terminal Fail. create_new or atomic no-replace primitives are required for every retained file"
return_rule = "ordinary Produce, after dependency-backed supply archive validation and completion of all output generation, creates exactly 14 regular nlink-one no-link byte objects as the flat direct-child set returned_root_formula/<basename>, where <basename> is taken from each output_namespace.output_paths row in its exact declared order; no returned subdirectory, alternate basename, extra build product, or file outside returned_root_formula is evidence. An incomplete return set is retained scratch failure residue only and is never a published namespace or partial evidence set. After RCH returns, checked_snapshot validates the complete exact flat set and its direct-parent graph before any publication"
publication_rule = "under one cooperatively exclusive checked parent directory, require output_namespace.root absent immediately before publication and keep it absent while staging; map each returned_root_formula/<basename> byte object back to its same-index exact output_namespace.output_paths integration path without changing its bytes or basename, copy the ordered complete 14-object flat set into a fresh staging directory using create_new, fsync files and directory, re-open and rehash every byte, and reject any incomplete staging tree as non-published scratch residue. Only the complete validated 14-file directory may become the published namespace: call std::fs::rename once from staging to the still-absent output_namespace.root, then verify the source disappeared and destination is the exact staged directory identity and byte set. Any reordered/missing/extra mapping, normalization, preexisting destination, or cooperative ownership breach fails before rename"
publication_claim_ceiling = "atomic rename plus checked absence and exclusive-cooperator discipline in the stated non-hostile-controller model; std::fs::rename is not RENAME_NOREPLACE and does not prevent an adversarial process from racing an empty destination, so adversarial no-replace publication is not claimed"
postpublication_rule = "checked_snapshot revalidates the published exact set and every direct parent hash before requesting the external integration seal; no later producer write is permitted"
failure_rule = "an existing destination, stale output, extra/missing file, cross-device or replacement rename, partial copy, hash drift, RCH return outside the exact subtree, or cleanup during an active evidence phase is Fail. Failure before the one publication rename leaves output_namespace.root absent and retains any incomplete return/staging bytes only as non-published scratch failure residue; failure after a successful rename retains the complete 14-file namespace with verdict Fail. A partial published namespace is never accepted, deleted, repaired, or promoted. Typed failure records and all residue remain; later non-evidence cleanup follows scratch_space_contract only and requires separate exact-path authority"

[scratch_space_contract]
aggregate_rule = "before any allocation or write, during every filesystem-producing phase, immediately after each tree seal, and again before use/publication, perform no-follow checked walks and checked integer sums of entry counts plus regular-file bytes for every exact active root and every enclosing group root named by root_caps. Enforce each applicable per-file maximum, each group-wide collective cap, the distinct two-root execution cap, and the collective entry cap with checked arithmetic at all four boundaries; a per-file cap alone, free-space estimate, compressed-size cap, nested-root double count, later quarantine, or newly created sibling root cannot substitute for an aggregate check"
root_caps = ["paths.run_scratch_root=.fnd01-run=bounds.max_run_scratch_total_bytes", "publication_contract.quarantine_candidates as one disjoint target fallback set=bounds.max_fallback_target_total_bytes", "target/debug/fnd-01/<run-id> bootstrap-plus-return subtree=bounds.max_transport_target_total_bytes", "publication_contract.returned_root_formula=target/debug/fnd-01/<run-id>/return=bounds.max_return_tree_total_bytes", ".fnd01-run/controller/<run-id> collectively=bounds.max_controller_scratch_total_bytes", "all producer and attester control ledgers plus acquisition spools collectively=bounds.max_control_plane_total_bytes", "all quarantine roots collectively=bounds.max_quarantine_total_bytes", "all publication staging trees collectively=bounds.max_publication_staging_total_bytes", "all producer and attester bootstrap scratch trees collectively=bounds.max_bootstrap_scratch_total_bytes", "all producer and attester local-registry materializations collectively=bounds.max_materialization_total_bytes", "all resolver-3 and resolver-2 projection roots, including all 13 resolver-2 roots, collectively=bounds.max_projection_tree_total_bytes", "all A/B package target and packing roots for all nine packages and both roles collectively=bounds.max_package_tree_total_bytes", "all producer and attester package-source staging roots, canonical source copies, package-list streams, and staged manifests collectively=bounds.max_package_source_total_bytes", "all consumer extraction and aggregate roots for both roles collectively=bounds.max_consumer_tree_total_bytes"]
run_root_rule = "bounds.max_run_scratch_total_bytes is the checked 64-GiB cap only for the exact .fnd01-run tree. The disjoint target fallback set is outside that tree and independently capped by bounds.max_fallback_target_total_bytes; within target/debug, the active target/debug/fnd-01/<run-id> bootstrap-plus-return subtree and its nested return subtree also obey their smaller caps. Every smaller cap in root_caps is a group-wide collective cap, not a per-instance multiplier, and nested group bytes are counted once in their enclosing tree total. The controller group and the role-owned control-ledger/acquisition-spool group are disjoint; all disjoint named scratch subgroup maxima therefore sum to 37.25 GiB, while acquisition Cargo-home content and any other admitted run state remain charged to the 64-GiB outer cap. Each individual member root is also checked, but creating another root never grants another copy of a group cap"
tree_entry_scope_rule = "bounds.max_tree_entry_count is one collective cap over the disjoint union of the exact .fnd01-run tree and the normalized nonoverlapping publication_contract.quarantine_candidates target fallback set for one run, with every nested group and individual member root also required not to exceed it; target/debug/fnd-01/<run-id> and its return subtree are nested target subgroups, not extra entry allowances. Entries are counted once at the outermost disjoint-root level, arithmetic is checked, and a new role, target, projection, package, controller file, ledger, spool, source-staging root, or RCH fallback output does not reset the count"
execution_footprint_rule = "bounds.max_execution_footprint_total_bytes is enforced as the checked sum of regular-file bytes in the two disjoint outer groups .fnd01-run and the publication_contract.quarantine_candidates target fallback set and equals 64 GiB plus 8 GiB. Controller records, ledgers/spools, package-source staging, quarantine, publication, materialization, projection, package, and consumer trees remain charged to .fnd01-run; the direct-rustc bootstrap, nested return tree, and any gate fallback residue remain charged to the target set before quarantine. Atomic quarantine moves transfer a byte from the target group to .fnd01-run without double counting or granting a fresh cap"
compression_rule = "bounds.max_command_stream_bundle_bytes and bounds.max_command_stream_expanded_bytes are independent compressed/expanded caps; no fixed expansion-ratio limit is claimed because bounded highly repetitive Cargo JSON may legitimately compress beyond such a ratio. bounds.max_supply_bundle_bytes applies directly to the uncompressed custom supply container. None is treated as an estimate or allocation hint"
retention_rule = "the 14 published outputs, final attestation, external authoring/integration/final seals, outer records, gate input/result, and typed quarantine/residue metadata are evidence-eligible retained records. Cargo targets, materialized registries, projection/package/consumer scratch, returned target fallback bytes, and quarantined preexisting builds are non-evidence residue after the gate"
cleanup_rule = "the verifier, producer, attester, and gate never delete. After a terminal Pass or preserved terminal failure, cleanup is a separate controller operation only when the user explicitly authorizes the exact paths and irreversible effect under AGENTS.md; it may remove only listed non-evidence roots after rechecking they are beneath the same decoded run root, are not symlinks/hardlinks/special nodes, and do not contain an evidence-eligible path. The retained residue metadata records the disposition; no policy text alone grants deletion authority"

[supply_bundle_contract]
format = "FND01SUPPLYv4"
purpose = "one deterministic custom binary containing the complete Cargo local-registry byte closure needed by every retained offline producer command and the independent offline attester plus the untouched sparse-cache inputs needed to prove how that closure was selected; it is not a tar archive, Cargo vendor tree, ambient Cargo home, or raw HTTP response"
header_encoding = "ASCII FND01SUPPLYv4 followed by NUL; u64be bootstrap-lock byte length, raw 32-byte bootstrap-lock SHA-256, exact bootstrap-lock bytes; u64be producer acquisition-root entry count, u64be producer acquisition-root total regular-file bytes, raw 32-byte producer acquisition-root FND01BOOTSTRAPTREEv1 SHA-256; u32be sparse-config path byte length, the exact fixed acquisition-CARGO_HOME-relative config.json path bytes, u64be sparse-config byte length, raw 32-byte sparse-config SHA-256, exact sparse-config bytes; then u32be entry_count, u64be total entry-payload bytes, raw 32-byte inner-entry-set SHA-256, and raw 32-byte closure_bijection_sha256 in that order. Bootstrap-lock and sparse-config bytes are dedicated header evidence payloads and are not tagged entries; sparse-config bytes are excluded from total entry-payload bytes and are never materialized into the offline local registry"
entry_kinds = ["crate-archive", "derived-local-index-file", "sparse-cache-input"]
entry_encoding = "one kind byte (0x01 crate-archive, 0x02 derived-local-index-file, 0x03 sparse-cache-input), u32be relative_path length, strict UTF-8 relative_path bytes, u64be payload length, raw 32-byte SHA-256, then exact payload bytes"
entry_order = "ascending kind byte, then ascending raw relative_path UTF-8 bytes"
inner_entry_set_digest = "SHA-256 over ASCII FND01SUPPLY-ENTRIESv1 followed by NUL, u32be entry_count, and for each entry in entry_order its kind byte, length-prefixed path, u64be payload length, raw payload SHA-256, and exact payload bytes; this digest is independent of the outer framing offsets and is recomputed before any materialization"
crate_path_rule = "crate-archive paths are one root basename exactly <case-preserved-index-package-name>-<exact-version>.crate with no slash, matching Cargo PackageId::tarball_name; only the separate registry index path lowercases the package name, and dash/underscore normalization is used solely for crates.io collision rejection, never for the archive basename. Name/version are parsed from the corresponding strict index row and archive, and raw archive SHA-256 equals the locked crates.io checksum. The only admitted acquisition source path is <acquisition-CARGO_HOME>/registry/cache/index.crates.io-1949cf8c6b5b557f/<case-preserved-index-package-name>-<exact-version>.crate; a .crate basename found anywhere else is not a candidate"
index_path_rule = "derived-local-index-file paths are exactly index/<documented-crates.io-index-crate-path> for one selected package name; Cargo local-registry roots have no index/config.json. Each payload is deterministically constructed only from selected locked sparse-cache JSON blobs for that package in their original cache order, each blob strict duplicate-key-free JSON encoded byte-for-byte followed by exactly one LF; reject a nonselected version row, missing terminal LF, reordered row, normalized JSON, a duplicate version after ignoring SemVer build metadata, or any claim that the derived file is a raw HTTP response/body"
sparse_cache_path_rule = "for the crates.io sparse source exactly sparse+https://index.crates.io/, the acquisition index root is exactly <acquisition-CARGO_HOME>/registry/index/index.crates.io-1949cf8c6b5b557f and its SummariesCache root is exactly the .cache child. Let n be the strict ASCII-lowercase index package name: dep-path is 1/<n> for byte length one, 2/<n> for byte length two, 3/<first-byte>/<n> for byte length three, and <first-two-bytes>/<next-two-bytes>/<n> for byte length at least four. A 0x03 relative_path is exactly sparse-cache/registry/index/index.crates.io-1949cf8c6b5b557f/.cache/<dep-path>. Exactly one such entry exists for each and only each selected enclosing cache file. No alternate index.crates.io-* directory, dynamically discovered registry directory, config.json, basename match, or SummariesCache-looking file elsewhere is admitted"
path_rule = "apply paths.path grammar with a stricter maximum depth and reject absolute, empty, dot, dot-dot, backslash, colon, NUL, duplicate, ASCII-case-colliding, link, hardlink, and special-file representations; binary entries cannot describe directories"
exact_set_rule = "bootstrap.resolve generates one exact control-union lock from bootstrap_manifest_contract before bundle emission; its complete bounded raw Cargo.lock byte object is retained once in the FND01SUPPLYv4 dedicated header payload and separately parsed/hashed under lockfile_producer_contract.zip_rule, except that its exact source-less package set is the singleton fastmcp-fnd01-bootstrap-control 0.0.0, never represented as an entry. The producer bookends complete acquisition-CARGO_HOME inventory with equal FND01BOOTSTRAPTREEv1 observations, requires exactly one nonempty bounded sparse config.json at the fixed path and retains its exact binding and bytes in the v4 header, and requires the acquisition crate-cache archive set to equal the lock archive set exactly. The sealed bundle package triple set is exactly the set union of crates.io package/version/checksum triples in all 28 policy-defined downstream locks and the additional control-harness-only transitive closure, requiring exactly one 0x01 crate archive per union triple, exactly one 0x02 derived local-index file per selected package name, and exactly one 0x03 untouched sparse-cache input per selected enclosing cache file. No config.json tagged entry, unreferenced archive/cache/row, alternate-registry, git, path, ambient source, raw HTTP response, or raw HTTP body is admitted"
closure_bijection_rule = "closure_bijection_sha256 is SHA-256 of the exact preimage ASCII FND01SUPPLYCLOSUREv1 followed by NUL, u32be triple count, then one row per exact crates.io name/version/checksum triple sorted lexicographically first by raw name bytes, then raw version bytes, then raw lowercase-checksum bytes. Each row encodes, in order, the exact package name, version, and lowercase checksum as u32be length/raw UTF-8 bytes; the selected 0x03 sparse-cache-input entry relative_path as u32be length/raw bytes followed by its u64be nonzero entry byte length and raw 32-byte entry SHA-256; selected JSON ordinal as u32be, selected exact JSON byte length as u64be, and raw 32-byte selected JSON SHA-256; derived-index 0x02 relative_path as u32be length/raw bytes followed by its u64be nonzero byte length/raw 32-byte SHA-256; archive 0x01 relative_path as u32be length/raw bytes followed by its u64be nonzero byte length/raw 32-byte SHA-256; and exact yanked byte 0x00. Counts and lengths use checked conversion/arithmetic and no unencoded field or trailing byte is admitted. Produce before sealing, Produce after reopening, Attest before materialization, and the ordinary final verifier independently recompute this preimage from the embedded untouched 0x03 cache payloads, dedicated bootstrap lock, embedded 0x02 derived-index bytes, and embedded 0x01 compressed archives, require lock/cache/derived-index/archive equality in both directions, and require every archive SHA-256 equal both lock checksum and selected index cksum. The raw header digest and supply-receipt field are outputs of that recomputation and never producer-only authority; no self-asserted digest, missing peer, extra peer, or normalized substitute passes"
postcommand_equality_rule = "after the 204 non-acquisition commands create the final workspace, all resolver-3, all resolver-2, and aggregate packaged-consumer locks, their sorted crates.io package/version/checksum union must be an exact subset of the bootstrap lock and bundle archive set; the exact bootstrap/bundle set equals that downstream union plus precisely the typed control-harness-only closure and no other package. Each selected derived-index row reproduces the same checksum and retained yanked boolean. Producer and attester regenerate each downstream lock in distinct fresh scratch roots and require byte-for-byte equality for every corresponding lock; every package selected by this fresh workflow must have yanked=false, unless a separately byte-bound preexisting seed lock explicitly authorized that exact already-yanked version before resolution (this workflow defines no such seed-lock exception)"
postcommand_lock_order = ["workspace", "projection.r3.workspace-baseline", "projection.r3.core-foundation", "projection.r3.asupersync-0.3.9", "projection.r3.asupersync-0.3.10-rejected", "projection.r3.serialization-uri", "projection.r3.jose-ring-direct", "projection.r3.tls-plus-jose-unified", "projection.r3.media-html5ever", "projection.r3.media-image", "projection.r3.media-resvg", "projection.r3.state-envelope", "projection.r3.state-capability-fs", "projection.r3.state-redis", "projection.r2.workspace-baseline", "projection.r2.core-foundation", "projection.r2.asupersync-0.3.9", "projection.r2.asupersync-0.3.10-rejected", "projection.r2.serialization-uri", "projection.r2.jose-ring-direct", "projection.r2.tls-plus-jose-unified", "projection.r2.media-html5ever", "projection.r2.media-image", "projection.r2.media-resvg", "projection.r2.state-envelope", "projection.r2.state-capability-fs", "projection.r2.state-redis", "consumer.aggregate"]
producer_pre_handoff_seal_path_formula = ".fnd01-run/integration-producer/<run-id>/supply-bundle.bin"
sealed_bundle_rule = "Produce finalizes the supply bundle exactly once at producer_pre_handoff_seal_path_formula using create_new, fsync of file and parent, reopen, complete strict reparse, and rehash, then keeps that scratch byte object and its acquisition Cargo home immutable and never deletes either. No role uses a seal path as a Cargo registry, writes into it, normalizes it, repairs it, or reuses a materialization; Attest does not reconstruct or reseal producer scratch and instead consumes only the integration-sealed published supply path evidence/fnd-01/integration/supply-bundle.bin"
bootstrap_validation_rule = "Produce first derives the complete candidate FND01SUPPLYv4 bytes in memory from strictly parsed acquisition inputs, checking every declared count/length/offset and applicable per-file/aggregate bound before each allocation, then parses and completely validates that in-memory candidate before bootstrap_control_input_authority_contract and before any create_new supply seal; only a frozen-authority match may permit the later create_new seal and reopened reparse. Attest performs the same validation on the integration-sealed published bytes. Before either role performs any supply materialization, control-build child, or retained-output write, std-only Phase B validates complete framing, checked bounds and offsets, exact entry order, unique paths under raw and ASCII-case-folded comparison, exact payload hashes, the nonzero bounded producer acquisition-root observation, the exact fixed sparse-config path and independently rehashed header payload, the bounds.max_sparse_cache_input_bytes cap on every 0x03 payload, and bounds.max_supply_bundle_bytes over the complete container; strict-parses the dedicated header Cargo.lock as the closed canonical Cargo v4 lexical grammar: exact generated header, one terminal LF, exact package-field order and blank separators, paired optional source/checksum, nonempty multiline dependencies only when present, raw-byte strictly ascending unique dependency rows, and PackageId package order by name then semantic SemVer then source, all under pre-allocation package/dependency/string caps; strict-parses every untouched 0x03 sparse cache under sparse_cache_input_rule and every LF-delimited 0x02 derived-index JSON row with duplicate-key rejection; proves the exact lock/cache/index/archive triple bijection and independently recomputed closure_bijection_sha256 in both directions; requires every selected row yanked=false; and requires each still-compressed 0x01 .crate SHA-256 equal both its lock checksum and index cksum. Produce additionally requires the v4 root/config observations equal the live bookended acquisition tree and file; Attest independently joins but does not claim to reobserve that producer-local tree. This std-only phase explicitly does not decompress gzip or parse tar members. Only after all those checks and the frozen authority join may it seal the supply or materialize kinds 0x01 and 0x02 into a distinct fresh no-link tree; kind 0x03 and the sparse-config header payload are retained evidence only"
ordinary_archive_validation_rule = "only after external authoring/seal authority, ordinary_tool_reprobe_rule's exactly 20 independently selected bounded probes, and the resulting complete ControlLedgerExpectation join, the dependency-backed ordinary harness uses pre/open/post checked identity snapshots to rebind the fully validated immutable control ledger, role-appropriate acquisition-spool option, and exact FND01SUPPLYv4 object including its producer acquisition-root observation and exact sparse-config header payload. The supply raw path is not ledger-chosen: Produce requires exactly the absolute repository-root join of .fnd01-run/integration-producer/<run-id>/supply-bundle.bin, Attest requires exactly the absolute repository-root join of evidence/fnd-01/integration/supply-bundle.bin, and Gate is rejected; lexical aliases, relative spellings, wrong roles, and wrong run IDs fail. Before any workspace/evidence child or returned-output write, it runs the existing full bounded gzip/tar member validator over every 0x01 compressed crate archive. It requires the exact <name>-<version> archive root, canonical member paths/types/order/checksums and all member/aggregate bounds, one complete gzip member with no concatenated member or trailing byte, and equality to the already checked archive binding. After the final archive it reopens through the same checked identity primitive, strict-reparses, and byte-rehashes the ledger and supply, plus the producer spool when present, requires exact equality to the pre-archive bindings, and performs ordinary_tool_reprobe_rule's no-child candidate/final/execution-bin revalidation. Produce additionally resnapshots the still-immutable acquisition CARGO_HOME, rereads the exact config, recomputes the fetch typed result, and finalizes the producer spool against both command expectations before generating or copying evidence. Any ordering deviation, authority failure, ledger/spool/supply/acquisition/tool drift, archive failure, or early workspace child/write is terminal before role dispatch"
bootstrap_archive_claim_ceiling = "the offline control build necessarily processes checksum-bound compressed archives before dependency-backed ordinary_archive_validation_rule can inspect their gzip/tar members. Successful control build plus the later full validation proves internal lock/index/archive closure consistency and offline usability for the accepted run; it does not prove hostile-input bootstrap safety, crates.io authenticity, registry freshness, or that pre-validation archive contents were safe against a malicious controller"
returned_bundle_rule = "ordinary Produce alone, and only after external authority, ordinary_tool_reprobe_rule's exactly 20 independent probes, the complete ledger/tool join and regular-file/tree rebind, ordinary_archive_validation_rule, the mandatory post-archive ledger/supply/spool bookend, and the no-child post-archive tool-surface revalidation have all succeeded, copies the immutable producer_pre_handoff_seal_path_formula bytes once with create_new to publication_contract.returned_root_formula/supply-bundle.bin, fsyncs file and parent, reopens and rehashes both objects, and requires equal nonzero length/SHA-256 while both remain immutable. Attest consumes evidence/fnd-01/integration/supply-bundle.bin through the external integration seal, performs the same probes-then-ledger-join-then-archive-then-bookend order, and returns no supply-bundle copy"
materialization_root_formula = ".fnd01-run/<role>/<run-id>/local-registry"
materialization_rule = "after bootstrap_validation_rule, and without claiming gzip/tar member inspection, the std-only bootstrap creates a distinct fresh per-role root and required parent directories with create_new/no-follow checks, writes only 0x01 checksum-bound compressed crate-archive relative paths directly as registry-root/*.crate and only 0x02 derived-local-index-file relative paths directly as registry-root/index/<crate-path>, and in Attest mode writes the dedicated checked bootstrap-lock payload create_new to the exact reconstructed bootstrap Cargo.lock path before the --locked control build. Every 0x03 sparse-cache-input remains evidence-only and is never materialized, copied into either Cargo home, or exposed as a registry path. Only ErrorKind::NotFound may establish that a destination or required parent is absent; every other metadata/open error fails. Before allocation/write and again after fsync/reopen/rehash and exact tree sealing, require the supply at most bounds.max_supply_bundle_bytes, each compressed archive at most bounds.max_archive_compressed_bytes, each derived-index file and bootstrap lock at most bounds.max_source_file_bytes, and enforce bounds.max_bootstrap_scratch_total_bytes, bounds.max_materialization_total_bytes, bounds.max_run_scratch_total_bytes, bounds.max_tree_entry_count, and all enclosing scratch_space_contract caps using checked sums. Require index/config.json absent; never treat the bootstrap lock or a 0x03 entry as a registry entry, strip/add a hidden prefix, invoke tar, follow a link, extract an archive into the registry root, overwrite a byte, mutate the seal, share producer and attester materializations, or delete materialized state"
cargo_config_rule = "generate the one fresh role/run config defined by cargo_config_discovery_contract and pass its absolute path explicitly; forbid all ambient discovered config and every source replacement other than the exact sealed local-registry mapping"
acquisition_rule = "the producer requires a newly created, exactly empty acquisition CARGO_HOME, then executes exactly bootstrap.resolve followed by one bootstrap.fetch --locked with no --target inside its one already-remote bootstrap using the crates.io sparse protocol solely to resolve the all-feature/all-target union lock and populate checksum-addressed archives/index cache; acquisition commands and streams are retained in process until bootstrap_control_input_authority_contract admits them, but they are not dependency-policy Pass evidence and create no availability, registry-authenticity, reproducibility, or offline claim. A pending authority-enrollment run may leave only non-evidence fresh producer bootstrap scratch, acquisition Cargo-home/target state, execution-bin links, and bounded child observations beneath its run root; it cannot seal or promote a supply, create an acquisition spool, materialize a registry, build the control harness, create a ledger or returned output, or hand off. No cleanup, publication, or successful evidence claim follows from that terminal Pending state. Candidate evidence is selected only through the exact cache and archive paths above. Cargo administrative files may exist but are never promoted through recursive basename or content sniffing; registry/src is never selected as an input"
upstream_anchor_rule = "before sealing, bind the complete exact untouched sparse config/index cache file bytes, embedded cache validators such as ETag/Last-Modified when present, every selected cached JSON blob hash, crate download bytes, Cargo version, acquisition environment, and the acquisition-root exact file-set digest. acquisition_root_set_sha256 is exactly lowercase hexadecimal snapshot_tree(acquisition_cargo_home, \"acquisition-cargo-home\").tree_sha256 under bootstrap_control_plane_contract.tree_digest_encoding FND01BOOTSTRAPTREEv1, covering every admitted directory/file row, mode, file length, and file hash in raw relative-path order; a digest over only selected anchors is forbidden. Preserve the producer-side acquisition anchors in supply-receipt; every selected sparse-cache anchor must additionally join byte-for-byte to its unique 0x03 supply entry, without claiming raw HTTP response/body recovery, authenticated upstream provenance, or an independently re-fetched snapshot. The only sparse configuration anchor is acquisition-CARGO_HOME-relative registry/index/index.crates.io-1949cf8c6b5b557f/config.json; it is not a SummariesCache file, 0x03 entry, or materialized input"
sparse_cache_input_rule = "Pinned implementation authority is Cargo commit 59800466c5c41c444d264b1010b4d57e85a7117f for SummariesCache, IndexPackage and RegistryDependency deserialization and recovery, index_package_to_summary and registry_dependency_into_dep, cargo-platform target parsing, and Summary::new and build_feature_map; it is not a generic or stable Cargo cache promise. The following sentence records pinned Cargo behavior rather than the stricter FND-01 admission profile. Pinned Cargo's SummariesCache parser requires cache byte 3, little-endian INDEX_V_MAX 2, a NUL-delimited strict-UTF-8 index validator, and SemVer outer version tokens; Cargo's serializer emits NUL-delimited version/JSON pairs and a terminal NUL, but its parser does not itself require a nonempty pair set or terminal NUL and parses JSON rows lazily. IndexPackage deserialization applies the non-null field defaults below and ignores unknown JSON members. Cargo treats v absent or null as one, admits v=0, classifies v above INDEX_V_MAX as Unsupported, merges a present features2 map regardless of v, recovers a fully invalid row as IndexSummary::Invalid when its minimum name/version record can be recovered, maps every dependency kind string other than dev/build to normal, and admits a parseable non-null dependency registry URL. FND-01 intentionally applies a narrower fail-closed hardening overlay: after bootstrap.fetch and before any offline command, std-only parsing requires byte 0 exactly 3; bytes 1..5 exactly the four-byte little-endian u32 value 2; a strict-UTF-8 index-file validator of at most bounds.max_record_string_bytes bytes terminated by NUL; then one or more complete pairs consisting of a nonempty strict-SemVer version terminated by NUL followed by a nonempty exact duplicate-key-free JSON object terminated by NUL; and therefore a final byte exactly NUL. Every outer cache version token and every JSON vers string is at most 4096 decoded UTF-8 bytes. A missing partner, empty version or JSON, embedded or trailing material, invalid UTF-8, invalid SemVer, duplicate JSON key, count/offset/length overflow, ignored field, or alternate version/schema fails. Every cache JSON object, including every historical or otherwise unselected row, must have exactly the registered top-level and nested dependency allowed/required fields and types and must survive the pinned Cargo semantic Summary conversion; duplicate or unknown keys, recovered Invalid or Unsupported rows, and semantic validation deferred until row selection all fail. Only effective schema versions one and two pass: absent, null, or integer one v means version one and integer two means version two; zero and values above two fail. Version one requires features2 absent or null, while version two admits it absent, null, or a non-null object. Both admitted versions require artifact and bindep_target absent or null and lib absent or false. A missing optional defaults to false, but a present optional must be a JSON boolean: optional=null fails full pinned RegistryDependency deserialization and is recoverable by Cargo only as IndexSummary::Invalid when minimum name/version recovery succeeds; this policy rejects that recovered-invalid row. Missing or null public becomes false, and missing or null kind becomes normal. Missing features defaults to an empty array, missing default_features defaults to true, and missing lib defaults to false; when any of those non-Option fields is present, including optional, it must have its declared non-null JSON type. A non-null dependency kind is exactly normal, dev, or build; optional dev dependencies fail, optional normal and build dependencies pass, and public=true is admitted only for normal dependencies. Dependency registry is absent or null because the enclosing source is already the frozen crates.io authority; every non-null registry fails. Every top-level package name, dependency alias, and non-null dependency package name uses the frozen crates.io subset of one through 64 ASCII bytes, leading ASCII alphabetic, then only ASCII alphanumeric, hyphen, or underscore. A dependency target is a nonempty bounded cargo-platform subset: either a named target containing only Unicode alphanumeric, underscore, hyphen, or dot, or cfg(...) whose interior uses only ASCII-space skipping, ASCII identifiers including raw r# identifiers, quoted strings without escape interpretation, key equals string predicates, not with exactly one expression, and all or any with zero or more comma-separated expressions and an optional trailing comma; nesting above 128, leftover tokens, any control character including tab/newline/CR even inside a quoted string, malformed raw identifiers, missing delimiters, and malformed strings fail. Version-two features2 values append to same-name features values before validation. Each feature key uses the frozen subset leading ASCII alphanumeric or underscore followed by ASCII alphanumeric, underscore, plus, hyphen, or dot; each feature value is nonempty, control-free, and at most 4096 bytes. Feature values split at the first slash into dependency-feature syntax, otherwise dep: denotes an explicit optional dependency and all other values denote features. Validation uses dependency aliases rather than package names, reproduces implicit optional-dependency features, rejects missing features or dependencies, dep: on nonoptional dependencies, weak ? dependency-features on nonoptional dependencies, dep: combined with slash, and multiple slashes, and requires every optional dependency to be used by an explicit, dependency-feature, or generated implicit feature. A present pubtime is exactly the unsigned zero-padded pinned Cargo 20-byte UTC form %Y-%m-%dT%H:%M:%SZ with year 0000 through 9999 and second at most 60. Selected rows additionally require exact outer-cache-version and vers equality, exact package/path/name identity, a 64-lowercase-hex cksum equal to the lock and archive SHA-256, and an explicit JSON yanked=false. Each complete untouched selected cache file is at most 16 MiB, is retained exactly once as a 0x03 sparse-cache-input payload including the exact validator and every pair in original order, and has a receipt variant whose parallel selected_version, selected_ordinal, and selected_sha256 arrays losslessly identify every and only selected JSON row in ascending original ordinal. Produce, Attest, and the final verifier reparse those embedded raw bytes and reconstruct all selected JSON hashes; cache bytes never masquerade as raw HTTP bodies and are never materialized as local-registry inputs. These FND requirements are local hardening overlays even where they deliberately reject input that pinned Cargo would parse, recover, normalize, ignore, or classify"
