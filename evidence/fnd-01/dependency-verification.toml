final_read_only_gate_rule = "receives the root-authored final-gate seal through its one exact environment channel, reads and rehashes frozen authoring bytes, integration bytes, final attestation, and the delivered attester outer-transport record only; writes, network, dynamic rebasing, missing-output synthesis, and acceptance of a producer or attester repair are forbidden. The sole permitted evidence side effect is the one bounded final-gate stdout handshake required by gate_rule/side_effect_rule; the only other admitted process-global mutation is one scoped panic-hook take, no-op installation, and exact restoration that prevents nondeterministic panic stderr before catch_unwind. Gate never calls the entry-diagnostic renderer: every validation error or panic before handshake emission exits 3 with empty stdout/stderr and no handshake; success requires write_all plus flush to complete and then exits zero. A fallible stdout write may leave only a bounded handshake prefix before exit 3, which the root rejects because acceptance requires exit zero and the exact complete handshake; no implementation can retract bytes already accepted by an OS stream. No filesystem creates/writes/renames/deletes, network, or other process mutation is permitted. All retained input reads are exactly the checked-snapshot authoring triple, integration-seal ordered paths, producer/attester outer records, final attestation, gate input record, and gate executable binding enumerated by final_gate_seal_contract and gate entry_rule"
root_seal_authority_rule = "the root orchestrator alone computes and distributes the authoring closure, integration seal, producer outer-transport record, attester outer-transport record, and final-gate seal after their respective independent review and quiet-window rehashes; neither producer nor attester may originate, predict, or recover any post-return record or seal from repository receipts"
cross_role_failure_rule = "a write outside the active role's exact allowlist, an absent external marker/seal, a byte change owned by another role, or a receipt claiming a different role is terminal Fail"

[checked_snapshot_contract]
qualified_platform = "Linux x86_64"
path_grammar = "repository-relative POSIX UTF-8 with nonempty components; absolute paths, backslashes, NUL, drive/UNC prefixes, dot, dot-dot, empty components, overlong paths/components/depth, duplicates, and ASCII-case collisions are rejected before filesystem access"
root_rule = "open only beneath the already selected lexical repository or run root; canonicalize, current-directory discovery, PATH search, ancestor discovery, and environment-selected roots are forbidden"
component_precheck = "walk every lexical component with symlink_metadata without following it; require intermediate components to be real directories and the leaf to be one regular non-symlink file; reject symlink, hardlink when nlink is not one, socket, device, FIFO, or other special node"
open_rule = "after component precheck call std::fs::File::open on the exact lexical leaf, obtain handle metadata, read and hash only through that handle under the declared bounds, then obtain handle metadata and repeat component symlink_metadata checks"
identity_rule = "on qualified_platform compare Linux dev, ino, mode/file type, nlink, length, mtime seconds/nanoseconds, and ctime seconds/nanoseconds across pre-open leaf metadata, opened-handle metadata before read, opened-handle metadata after read, and post-read leaf metadata; require exact equality, nlink one, expected length, and complete EOF with no extra byte"
race_test_rule = "the verifier exposes deterministic injected hooks at pre-open, post-open/pre-read, post-read/pre-final-metadata, complete-first-pass, complete-second-pass/pre-consumption, and post-consumption boundaries. Tests replace/relink/remove the leaf, change a direct parent, and perform same-inode same-length content rewrites at each applicable hook; separate tests require Fail for a missing configured member, duplicate and ASCII-case-colliding configured paths, zero member/aggregate bound, N=0, declared logical-path mismatch, and direct authoring/integration revalidator drift. Every case requires the exact identity/digest or E_SET_RACE disposition without modifying retained evidence"
set_snapshot_max_members = 8
set_snapshot_max_direct_parents = 8
authoring_set_paths = ["evidence/fnd-01/dependency-verification.toml", "crates/fastmcp/tests/fnd_01_dependency_evidence.rs", "crates/fastmcp/examples/fnd_01_evidence_harness.rs"]
integration_set_paths = ["Cargo.lock", "evidence/fnd-01/integration/source-snapshot.toml", "evidence/fnd-01/integration/supply-bundle.bin", "evidence/fnd-01/integration/workspace-receipt.toml", "evidence/fnd-01/integration/integration-index.toml"]
set_snapshot_rule = "a canonical checked set contains one through eight unique nonempty paths, rejects duplicate and ASCII-case-colliding configured paths before filesystem access, has strictly positive per-member and aggregate bounds, and uses the declared raw path order. First pass completes checked_snapshot_contract for every member and retains the full CheckedSnapshot tuple: logical path, Linux device/inode/mode/nlink/mtime/ctime identity and metadata, byte length, and SHA-256. Only after the complete first pass, a second pass reopens and rehashes every member in the same order, retains that second-pass open handle, and requires the full tuple byte-for-byte equal. Any reopen/read/metadata error, disappearance, missing/extra/duplicate/reordered member, length/content/mode/inode/metadata drift, bound of zero, N=0, or other member failure during the second pass or later sealed-handle consumption is normalized to exact E_SET_RACE rather than a partial member error"
set_parent_rule = "before the first member open, snapshot the exact unique lexical direct-parent directories of all configured members in raw path order, bounded by set_snapshot_max_direct_parents, using no-follow directory metadata and Linux device/inode/mode/nlink/mtime/ctime. Revalidate every parent after the complete second pass, immediately before sealed consumption, and after consumption; require exact equality and continued containment of every lexical member. A missing, replaced, symlinked, reordered, unbounded, or changed parent is E_SET_RACE, and neither an unchanged leaf handle nor a matching content digest can waive the direct-parent check"
sealed_consumption_rule = "Phase-B and Gate consume authoring, integration, and delivered outer-record bytes only through the exact open handles retained by the immediately preceding successful second pass, seeking and bounded-reading those handles rather than reopening member paths sequentially. Before and after each consumption, require unchanged handle metadata; after all consumption, repeat member-path and direct-parent metadata checks and a full same-order rehash through the retained handles. A closed/replaced handle, path disappearance, short/extra read, digest drift, or member/parent revalidation failure is E_SET_RACE; copies used by Cargo or rustc are created only from these handles and are independently reopened and hash-compared before execution"
role_boundary_revalidation_rule = "Produce validates authoring_set_paths and their direct parents under set_snapshot_rule immediately before Phase-B dispatch and Phase-B consumes the retained handles. Attest validates authoring_set_paths, then integration_set_paths plus the separately delivered producer outer record while deciding the integration seal, immediately revalidates authoring_set_paths after that seal decision, and immediately before Phase-B role dispatch performs a fresh authoring-set pass followed by an integration-plus-outer-record pass whose retained handles are the sole Phase-B inputs. Gate repeats fresh authoring then integration-plus-outer-record revalidation and consumes only those retained handles before its decision. The authoring closure stays external and no policy self-length/hash field is introduced"
failure_platform_rule = "any mode making a retained-evidence or publication claim fails closed outside qualified_platform; portable ordinary schema-only parsing may run elsewhere but must not emit Pass evidence"
claim_ceiling = "bounded no-follow lexical checks plus pre/open/post Linux identity/timestamp consistency against ordinary accidental or concurrent replacement or rewrite; std-only File::open does not provide O_NOFOLLOW descriptor-relative traversal, so hostile-controller timestamp restoration, kernel/VFS/mount attacks, adversarial swap-and-restore between observations, namespace attacks, and general TOCTOU resistance are explicitly not claimed"

[integration_seal_contract]
environment = "FASTMCP_FND01_INTEGRATION_SEAL"
outer_record_path_environment = "FASTMCP_FND01_PRODUCER_OUTER_RECORD_PATH"
outer_record_path_formula = ".fnd01-run/controller/<run-id>/producer-outer.bin"
marker_exact_grammar = "literal FND01INTEGRATIONv1, colon, exactly 32 lowercase hexadecimal run-id characters, then for each fixed file its canonical nonzero decimal byte length and 64 lowercase hexadecimal SHA-256 separated by colons, then the canonical nonzero decimal byte length and 64 lowercase hexadecimal SHA-256 of the root-observed outer-transport record, then the 64 lowercase hexadecimal authoring-closure SHA-256 and 64 lowercase hexadecimal seal SHA-256; no whitespace, sign, leading zero, duplicate field, trailing byte, alternate encoding, or file fallback"
run_id_decoded_bytes = 16
ordered_paths = ["Cargo.lock", "evidence/fnd-01/integration/source-snapshot.toml", "evidence/fnd-01/integration/supply-bundle.bin", "evidence/fnd-01/integration/workspace-receipt.toml", "evidence/fnd-01/integration/integration-index.toml"]
outer_transport_record_encoding = "ASCII FND01OUTERv2 followed by NUL; u32be exact outer argv count and each u32be-length-prefixed argv byte string; u32be exact assignment count and each raw-key-sorted pair as u32be key length/key bytes/u32be value length/value bytes, where every nonempty key contains only ASCII A-Z, 0-9, or underscore and no value contains NUL; i32be outer exit code; u64be stdout length/exact raw stdout; u64be stderr length/exact raw stderr; u32be final-simple-command argv count and each u32be-length-prefixed argv byte string; u32be parsed-rustc-cfg row count and each row in raw-byte lexical order as u32be key length/key bytes, one 0x00/0x01 optional-value tag, and when present u32be value length/value bytes; then u64be nonzero lifecycle-tail byte length and exactly one bare canonical tagged 0x06 outer-lifecycle record value dispatched at producer-outer or attester-outer, with no FND01RECv2 prefix, record-count word, or inner record-length word. The mandatory controller-owned lifecycle tail has exactly phase, controller_rch, controller_invocation, daemon_pre, and daemon_post in that order. Counts, lengths, offsets, additions, and the total record size including the lifecycle length/bytes are checked before allocation/conversion; no trailing byte"
outer_transport_bound_rule = "outer argv/assignment/final argv counts and every argument/key/value obey their dedicated bounds; stdout and stderr each obey their lowered 32-MiB cap; the canonical cfg encoding obeys max_outer_transport_cfg_entries and max_outer_transport_cfg_bytes; the lifecycle tail obeys every recursive record bound; and a checked-sum over header, all count/length words, every payload, exit code, tags, cfg rows, and lifecycle bytes must be <= max_outer_transport_record_bytes. Per-field caps can never substitute for the aggregate checked sum"
seal_preimage = "ASCII FND01INTEGRATIONv1 followed by NUL and raw 16-byte run_id, then for each ordered_paths row: u32be path length, exact path bytes, u64be nonzero file length, and raw 32-byte SHA-256, followed by u64be outer-transport-record length and raw 32-byte SHA-256, followed by raw 32-byte authoring-closure SHA-256"
authority_rule = "after the producer transaction has returned, the producer has published the exact 14-output set, and all producer writes have stopped, the root orchestrator checks the authoring marker, exact output namespace, ownership, prescribed quiet window, and exact outer invocation/result; it independently rehashes the five ordered paths, encodes the bounded post-return outer-transport record, writes it once with create_new beneath outer_record_path_formula, fsyncs/reopens/checked-snapshot verifies it, computes the seal over its exact length/hash, and supplies both exact environment values to the .1.15 attester"
outer_record_delivery_rule = "the attester requires outer_record_path_environment exactly once and equal the lexical path formula for the run; whole-tree RCH upload is only a transport and provides no byte-authenticity or residue/reuse claim, so before dependent Cargo the remote bootstrap checked-snapshot opens and rehashes the delivered regular nlink-one no-link file, enforces bounds.max_outer_transport_record_bytes plus every nested argv/assignment/stdout/stderr/record bound, strict-parses the complete FND01OUTERv2 record and mandatory producer-outer lifecycle tail with no trailing byte, and requires its length/hash and decoded run invocation/result/lifecycle equal the integration seal; after the attester returns root rechecks the local file unchanged; a digest without these delivered record bytes fails"
attester_entry_rule = "the std-only bootstrap parses and validates the external integration seal and delivered producer outer-record bytes before compiling or invoking any dependent Cargo command; every later attester phase repeats all five checked-snapshot bindings, the outer-record binding, and the authoring closure binding"
no_fallback_rule = "the seal is never read from or reconstructed using a repository receipt, Git, producer receipt, command stream, unnamed scratch path, environment other than the exact named channels, or producer-controlled configuration; the delivered outer-record file is root-owned scratch evidence, never one of the 14 outputs and never embedded as raw bytes in a producer receipt"
claim_ceiling = "external orchestration binding of five exact producer/workspace objects, one exact post-return controller-observed outer transaction, and the authoring closure; a child-generated receipt never claims its own eventual exit or outer streams, and no signature, public identity, Git-history, remote-worker, or hostile-controller authenticity claim is made"

[final_gate_seal_contract]
environment = "FASTMCP_FND01_FINAL_GATE_SEAL"
attester_outer_record_path_environment = "FASTMCP_FND01_ATTESTER_OUTER_RECORD_PATH"
attester_outer_record_path_formula = ".fnd01-run/controller/<run-id>/attester-outer.bin"
returned_attestation_path_formula = "target/debug/fnd-01/<run-id>/return/final-attestation.toml"
gate_executable_path_formula = ".fnd01-run/controller/<run-id>/final-gate"
returned_gate_executable_path_formula = "target/debug/fnd-01/<run-id>/return/final-gate"
gate_input_record_path_formula = ".fnd01-run/controller/<run-id>/final-gate-input.bin"
gate_result_record_path_formula = ".fnd01-run/controller/<run-id>/final-gate-result.bin"
marker_exact_grammar = "literal FND01FINALGATEv1, colon, exactly 32 lowercase hexadecimal run-id characters, colon, canonical nonzero decimal final-attestation byte length, colon, its 64 lowercase hexadecimal SHA-256, colon, canonical nonzero decimal producer-outer-record byte length, colon, its 64 lowercase hexadecimal SHA-256, colon, canonical nonzero decimal attester-outer-record byte length, colon, its 64 lowercase hexadecimal SHA-256, colon, canonical nonzero decimal gate-executable byte length, colon, its 64 lowercase hexadecimal SHA-256, colon, canonical nonzero decimal gate-input-record byte length, colon, its 64 lowercase hexadecimal SHA-256, colon, the 64 lowercase hexadecimal authoring-closure SHA-256, colon, the 64 lowercase hexadecimal integration-seal SHA-256, colon, the 64 lowercase hexadecimal final-gate-seal SHA-256; no whitespace, sign, leading zero, duplicate field, trailing byte, alternate encoding, or file fallback"
seal_preimage = "ASCII FND01FINALGATEv1 followed by NUL and raw 16-byte run_id; u32be final-attestation path length/exact path bytes/u64be length/raw SHA-256; u32be producer-outer-record path length/exact path bytes/u64be length/raw SHA-256 as decoded from that final attestation and required equal integration_seal_contract.outer_record_path_formula; u32be attester-outer-record path length/exact path bytes/u64be length/raw SHA-256; u32be gate-executable path length/exact path bytes/u64be length/raw SHA-256; u32be gate-input-record path length/exact path bytes/u64be length/raw SHA-256; raw authoring-closure SHA-256; raw integration-seal SHA-256. The integration-seal digest is an already externally fixed value and is never recomputed from this preimage; the final-gate-seal digest itself is intentionally absent from its own preimage and equals SHA-256 of this exact preimage"
authority_rule = "only after the attester RCH transaction and its controller-owned daemon post-observation return, root checked-snapshot validates the exact returned_attestation_path_formula byte object, requires final_attestation_contract.path absent, copies unchanged bytes with create_new to exactly final_attestation_contract.path, fsyncs file/parent, reopens/rehashes, and proves returned/published length and SHA-256 equality without repair. Root then encodes the actual attester post-return FND01OUTERv2 transaction with its mandatory attester-outer lifecycle tail, writes it once at attester_outer_record_path_formula, starts the distinct private gate daemon and records its controller-owned daemon_pre, constructs and writes the pre-seal typed FND01GATEINPUTv1 record once at gate_input_record_path_formula with every final-marker slot represented only by its fixed placeholder, fsyncs/reopens/checks all published non-target inputs and the prebound gate executable through the quiet window, computes the seal including direct FileBindings for the producer outer record, attester outer record, gate input, gate executable, and published final attestation, and supplies the exact marker/outer-path/authoring channels plus named gate-input argv path to the final gate"
record_rule = "the attester outer record uses integration_seal_contract.outer_transport_record_encoding and every outer bound and ends in exactly one attester-outer lifecycle record. The final attestation cannot contain or predict its own eventual exit/status/stdout/stderr or controller lifecycle; those fields exist only in the post-return controller-owned FND01OUTERv2 record and are never repaired into child evidence"
gate_rule = "root invokes the separate serialized RCH transaction in final_gate_executable_contract exactly once; the gate process strict-parses the marker, its named gate-input record, the delivered attester outer-record bytes, and the delivered producer outer-record bytes at integration_seal_contract.outer_record_path_formula as independently bound by both the marker and final attestation. It requires every such object's exact lexical path formula, regular nlink-one no-link identity, complete bounds, exact published final-attestation/gate-executable/input identities, exact length/hash/run/authoring/integration equality, zero producer and attester outer exits, and a valid unchanged final attestation. Returned target objects are not present or consulted by the gate: their returned-to-published equality was a prior root publication fact and all target residue is quarantined/non-evidence. The gate executable itself opens no Cargo/RCH/network channel and performs no write other than its one canonical stdout handshake; RCH's external synchronization effects remain separately bounded transport behavior"
gate_result_rule = "after the gate RCH transaction returns and the controller completes the mandatory gate daemon_post teardown/reap observation, root alone writes gate_result_record_path_formula create_new under final_gate_record_contract as the exact typed FND01GATERESULTv3 record; fsync/reopen/strict parse is required, the single controller-observed rch_exit_code is zero, stdout is one exact bounded raw-stream-blob containing the FND01GATEPASSv1 handshake, stderr is one exact empty raw-stream-blob, every non-target gate input recheck is byte-identical, every fallback-synced target candidate has exactly one quarantine disposition row, and any absent/extra invocation, lifecycle field, input, residue row, or changed input is Fail"
no_fallback_rule = "a marker digest without delivered record bytes, an attester-authored marker/record, a repository receipt substituting for either external channel, a reconstructed outer result, or any post-seal byte change is terminal Fail"
claim_ceiling = "root-controller binding of the completed attester transaction to the immutable final attestation and prior external identities; no signature, public provenance, hostile-controller resistance, or attester self-attestation is claimed"

[final_gate_executable_contract]
source_path = "crates/fastmcp/tests/fnd_01_dependency_evidence.rs"
mode = "gate"
build_origin_rule = "the exact qualified-Linux-x86_64 dependency-backed ordinary executable reached by the attester's required same-PID handoff is the sole gate build; it is the exact checked control-build executable independently rebound at ordinary entry and then joined to the immutable ledger, not a second build or inferred equivalent, and its nonzero regular-file length must be at most bounds.max_gate_executable_bytes independently of source/harness bounds. Only after ordinary handoff has established external authoring and Attest seal authority, completed all 20 independently selected bounded tool reprobes, completed the full ControlLedgerExpectation join, completed full supply archive validation and the post-archive ledger/supply/tool-surface bookend, and performed a final current-executable path/length/SHA-256 rebind may ordinary Attest copy those exact current-executable bytes create_new to returned_gate_executable_path_formula, fsync/reopen/rehash them, and record source/rustc/target/byte bindings in the final attestation. No pre-validation bootstrap copy, controller-local build, second attester build, Cargo build, or inferred equivalence is admitted"
return_publication_rule = "installed RCH returns the exact target/debug/fnd-01/<run-id>/return/final-gate object; after attester return root checked-snapshot validates its nonzero length <= bounds.max_gate_executable_bytes and copies unchanged bytes create_new to gate_executable_path_formula outside target/, fsyncs/reopens/rehashes, and requires returned/published length and SHA-256 equality under the same cap. This non-target controller path is the source-sync upload object for the separate gate RCH transaction; target upload or cache residence is never assumed"
target_rule = "ELF OS/architecture are exactly Linux/x86_64 and the attester records interpreter/required ABI metadata; the later actual gate worker is independently required Linux/x86_64 and successful checked execution, with no same-worker, RCH_WORKER pinning, cache, hostname, or cross-worker ABI inference"
outer_rch_controller_environment = ["RCH_NO_SELF_HEALING=1", "RCH_QUIET=1", "RCH_REQUIRE_REMOTE=1", "RCH_SOCKET_PATH=<exact-private-gate-socket>"]
outer_rch_argv = ["<exact-absolute-bound-rch-path>", "exec", "--", "/usr/bin/env", "-i", "FASTMCP_FND01_AUTHORING_CLOSURE=<exact-marker>", "FASTMCP_FND01_ATTESTER_OUTER_RECORD_PATH=.fnd01-run/controller/<run-id>/attester-outer.bin", "FASTMCP_FND01_FINAL_GATE_SEAL=<exact-marker>", "FASTMCP_FND01_RUN_ID=<run-id>", "LANG=C", "LC_ALL=C", "PATH=<prevalidated-empty-lookup-directory>", "TZ=UTC", ".fnd01-run/controller/<run-id>/final-gate", "gate", ".", "<run-id>", "evidence/fnd-01/final-attestation.toml", ".fnd01-run/controller/<run-id>/attester-outer.bin", ".fnd01-run/controller/<run-id>/final-gate-input.bin"]
outer_rch_rule = "invoke exactly once with outer_rch_controller_environment applied in raw-key order as the four controller-process assignment prefixes and outer_rch_argv as argv, under the controller timeout; RCH_SOCKET_PATH is the typed private daemon socket at <controller-os-temp>/fnd01/<run-id>/s/g/rch.sock (phase-code g for gate) and is never inherited from ambient state; the long rch-daemon/gate evidence directory is not a Unix socket path. The typed controller-invocation plan records these as two distinct ordered fields and forbids duplicating the RCH assignments inside remote /usr/bin/env. Bind installed RCH and controller /usr/bin/env plan before invocation and actual remote /usr/bin/env plus worker identity after start. Installed stock RCH exposes no cryptographically authenticated per-file upload manifest, so no log line, rsync inventory, source-sync report, cache key, or upload enumeration is accepted as byte evidence. Whole-tree source synchronization is transport only: the remote gate must independently checked-snapshot and rehash every named non-target input against the root-authored marker and typed gate-input record before use, and root repeats the pre/post local checks. Because unknown/non-Cargo commands use installed RCH's canonical fallback target/debug/**, target/doc/**, and target/release/** artifact sync-down order, root quarantines those exact local candidates before invocation, records every post-return candidate in the closed fallback-residue set, treats every returned target byte as untrusted non-evidence, and never uses or rechecks one as final-gate input"
argv = [".fnd01-run/controller/<run-id>/final-gate", "gate", ".", "<run-id>", "evidence/fnd-01/final-attestation.toml", ".fnd01-run/controller/<run-id>/attester-outer.bin", ".fnd01-run/controller/<run-id>/final-gate-input.bin"]
working_directory_token = "."
working_directory_rule = "stock RCH selects the remote synchronized repository CWD and does not rewrite controller-known absolute argv paths. The literal argv[2] dot is the sole repository token; gate mode calls current_dir once, requires a physical absolute no-symlink directory whose repository sentinels and bound authoring/input paths match, requires dot resolve to that same directory, and reports the decoded remote path only in its post-return handshake/result"
environment_exact_keys = ["FASTMCP_FND01_AUTHORING_CLOSURE", "FASTMCP_FND01_ATTESTER_OUTER_RECORD_PATH", "FASTMCP_FND01_FINAL_GATE_SEAL", "FASTMCP_FND01_RUN_ID", "LANG", "LC_ALL", "PATH", "TZ"]
environment_rule = "clear the inherited environment; set the authoring, attester-outer, final-seal, and run-id channels exactly once plus LANG=C, LC_ALL=C, TZ=UTC, and PATH to one prevalidated empty lookup directory. No CARGO_HOME, Cargo, RCH, proxy, registry, credential, temp, dynamic-library override, or network-related variable is admitted"
entry_rule = "the final executable is the dependency-backed ordinary control executable, but exact raw argv item one `gate` is classified before every ordinary audit/controller/handoff branch and permanently selects a reachable Gate subgraph containing only bootstrap plus shared trust_std code; later malformed Gate fields remain stderr-silent Gate failures and cannot fall through. That subgraph requires argv/CWD/environment exactness, checked-snapshot rehashes the complete three-file authoring closure, the five integration-seal ordered paths, the producer outer record at its fixed formula, its argv[0] executable binding, final attestation, attester outer record, and the named gate-input record, validates every marker-bound input hash, strict-parses both outer records, and performs final_gate_seal_contract gate_rule"
stdout_handshake_encoding = "exactly ASCII FND01GATEPASSv1 followed by NUL, u32be worker-id length/bytes, u32be OS length/bytes, u32be architecture length/bytes, u32be kernel-release length/bytes, u32be hostname length/bytes, raw 32-byte SHA-256 of exact /etc/machine-id bytes, u64be process id, u64be parent process id, u32be physically checked remote repository-root length/bytes, and raw 32-byte validated gate-input SHA-256; worker-id, kernel-release, and hostname are each nonempty and at most 1024 bytes, OS and architecture are each nonempty and at most 32 bytes, repository-root is bounded by the absolute-path grammar, both process IDs are nonzero, every value is locally observed by the gate, total stdout obeys bounds.max_final_gate_stdout_bytes, OS=linux, architecture=x86_64, and there is no trailing byte"
side_effect_rule = "static inspection of the exact Gate-reachable bootstrap/trust_std subgraph admits only bounded File::open, metadata/symlink_metadata, retained-handle Read and Seek::seek, bounded fs::read_dir enumeration, environment/argv/current_dir/current_exe/process-identity reads, hashing/parsing, one scoped panic-hook take/no-op-install/restore sequence, exactly one terminal write_all attempt of stdout_handshake_encoding followed by flush only after a completed write, and process exit. Gate never reaches FND01ENTRYv1 rendering; validation error or panic before emission exits 3 with empty stdout/stderr and no handshake. Completed handshake write plus flush is required for exit zero; a fallible stdout operation may leave only a bounded handshake prefix before exit 3, which is categorically rejected by the root's exact exit/status/stdout join. Any stderr write, other stdout byte, file creation/truncation/rename/removal, child process creation, sockets, DNS, Cargo, RCH, network API, or other process mutation is absent from that subgraph. Root checked-snapshot compares every bound input before and after invocation"
result_rule = "root captures the exact one invocation; after return it strict-parses the one bounded raw stdout blob as the handshake to obtain actual gate-worker identity, requires the raw stderr blob empty and the single controller-observed RCH exit zero, completes and binds gate daemon_post, ignores/quarantines all synced-down target residue, checked-snapshot revalidates only the already published non-target evidence/ and .fnd01-run gate inputs, and writes the post-return gate-result record defined by final_gate_seal_contract. The handshake asserts only the completed internal gate checks and worker observation, not its eventual process/outer exit; no gate-result record is an input to its own decision"
claim_ceiling = "one RCH-built and RCH-executed sealed dependency-backed control executable whose exact Gate-reachable subgraph is std-only, source-audited, checked against non-target input identity, and run under a closed gate-process environment; the complete executable is not claimed std-only. RCH source upload and fallback artifact sync-down may both write controller/worker transport state and target residue. No outer-transaction write-free claim, target-return authenticity claim, OS sandbox, syscall trace, filesystem write denial, child-process denial, physical network denial, hostile-runtime resistance, same-worker guarantee, or proof about unobserved side effects is made"

[final_gate_record_contract]
input_schema_id = "final-gate-input"
result_schema_id = "final-gate-result"
input_exact_fields = ["format", "schema_version", "run_id", "controller_rch", "controller_invocation", "daemon_pre", "gate_executable", "argv", "remote_working_directory_token", "environment", "final_attestation", "attester_outer_transport", "authoring_closure_sha256", "integration_seal_sha256", "input_set_sha256"]
result_exact_fields = ["format", "schema_version", "run_id", "gate_input_sha256", "actual_worker", "rch_exit_code", "stdout", "stderr", "daemon_post", "input_recheck_count", "input_recheck", "fallback_residue_count", "fallback_residue", "final_gate_seal_sha256", "evidence_verdict"]
input_recheck_exact_fields = ["id", "before", "after", "byte_equal"]
fallback_residue_exact_fields = ["path", "preexisting_disposition", "postreturn_disposition", "node_kind", "byte_length", "sha256", "evidence_eligible"]
input_format = "FND01GATEINPUTv1"
result_format = "FND01GATERESULTv3"
fallback_candidate_paths = ["target/debug", "target/doc", "target/release"]
fallback_preexisting_disposition = "absent-or-moved-to-run-quarantine-before-rch"
fallback_postreturn_disposition = "absent-or-moved-to-run-quarantine-after-rch"
fallback_node_kinds = ["absent", "regular-file", "directory", "symlink", "special"]
canonical_input_encoding = "ASCII FND01GATEINPUTv1 followed by NUL and the recursively tagged exact input_exact_fields under record_schema_contract; controller_invocation.argv, controller_invocation.remote_environment, and top-level environment contain fixed literal `<final-gate-marker>` in every final-seal marker slot rather than the not-yet-computed value, while controller_invocation.controller_environment and daemon_pre contain no such slot. After the seal is computed, the one actual invocation plan is derived only by replacing each exact placeholder slot once with the complete computed marker in all three named fields, every other byte/value/order must equal the sealed plan, and the stored gate-input bytes remain unchanged. daemon_pre is the completed controller-owned gate pre-observation fixed before sealing; remote_working_directory_token is literal dot, input_set_sha256 is omitted from its own preimage and equals SHA-256 of all preceding encoded fields, and the completed FileBinding of these bytes is then included in final_gate_seal_contract.seal_preimage"
canonical_result_encoding = "ASCII FND01GATERESULTv3 followed by NUL and the recursively tagged exact result_exact_fields under record_schema_contract; stdout and stderr are complete raw-stream-blob child records, daemon_post is the completed controller-owned gate post-observation, and input_recheck is an exact 13-row set for the three authoring-closure paths, five integration-seal ordered paths, producer outer record, final attestation, attester outer record, gate executable, and gate-input record sorted by raw lexical path bytes. Each input_recheck id equals the exact common before.path and after.path, so no separate or ambiguous name registry exists. Every input_recheck row and every fallback_residue row is included in canonical path order and no digest substitutes for its rows"
named_parser_contract = "the gate argv is exactly final_gate_executable_contract.argv; zero-based argv[4] names final_attestation_contract.path, argv[5] names final_gate_seal_contract.attester_outer_record_path_formula, and argv[6] names final_gate_seal_contract.gate_input_record_path_formula. The gate opens and strict-parses that exact third named input, requires its marker-bound length/SHA-256 and all decoded bindings, and accepts no implicit, stdin, environment-only, reconstructed, or alternate parser path"
upload_authentication_rule = "RCH source synchronization has no authenticated upload manifest. Root input bindings plus remote checked-snapshot rehashes and root post-return rehashes are the complete byte-identity proof; an RCH log, rsync listing, cache observation, path-presence observation, or transport success cannot satisfy or weaken any FileBinding"
fallback_residue_rule = "before the gate RCH call root records each exact fallback_candidate_paths candidate as absent or moves the whole candidate unchanged beneath the run-specific quarantine root; after return it performs the same no-follow classification and move for every reappearing candidate. Each path has exactly one typed fallback_residue row even when absent; the required byte_length and sha256 explicit-option fields are both empty arrays for absent, directory, symlink, or special nodes and are both singleton arrays carrying the exact length and lowercase digest for a regular file, evidence_eligible is always false, quarantined bytes are never reopened as an evidence input, and no missing/extra candidate or unrecorded target path is permitted"
evidence_boundary_rule = "gate_input, gate_result, input_recheck, and fallback_residue are controller scratch records outside the 14-output integration namespace and final attestation. They prove orchestration bindings only, are not MCP support evidence, are never a parent of a producer receipt, and cannot authorize, repair, substitute for, or be hashed into the gate's own decision"
ordinary_final_audit_rule = "the read-only ordinary final audit treats an absent gate_result_record_path_formula as Pending with exactly pending_contract.gate_result_pending_code, a present malformed/truncated/unknown-version/unknown-field result as terminal Fail, and only one strict FND01GATERESULTv3 record as eligible to remove Pending. A valid result must join gate_input_sha256 to the exact sealed FND01GATEINPUTv1 bytes; join controller_rch, controller_invocation, and daemon_pre to that gate input; join final_gate_seal_sha256 to the external seal; reparse stdout as the sole FND01GATEPASSv1 handshake and match actual_worker; require stderr empty and rch_exit_code zero; recheck every named input and fallback residue; and validate daemon_post against the same phase/run-directory/socket/retained Child transition. The result is never an input to the gate or its own seal"
non_self_reference_rule = "FND01GATERESULTv3, its byte length, hash, path, daemon_post, raw streams, and audit disposition are absent from FND01GATEINPUTv1, final_gate_seal_contract.seal_preimage, the gate process decision, and every producer/attester receipt. Post-return audit may validate but never retroactively authorize, repair, or self-hash the result"

[bootstrap_rch_contract]
same_source_path = "crates/fastmcp/tests/fnd_01_dependency_evidence.rs"
ordinary_harness_path = "crates/fastmcp/examples/fnd_01_evidence_harness.rs"
bootstrap_cfg = "fnd01_bootstrap"
bootstrap_modes = ["produce", "attest", "gate"]
ordinary_controller_mode = "controller"
toolchain = "nightly-2026-07-11"
edition = "2024"
std_only_rule = "under cfg(fnd01_bootstrap), same_source_path has one std-only main and no reference to an external crate; the ordinary test implementation and example adapter remain separately compile-checked but are cfg-excluded from this rustc bootstrap. Each failed, pending, or panicked bootstrap role, ordinary role-handoff, controller, and malformed-arity entry path makes one best-effort terminal write_all attempt, with no retry, of one operational stderr line having grammar FND01ENTRYv1|<bootstrap|ordinary|controller>|<produce|attest|controller|unknown>|<E_-code>|<escaped-detail> followed by one LF and bounded to 4096 total bytes, then attempts flush only after a completed write. If stderr accepts the complete write, exactly that one line is emitted; a fallible stderr operation may instead leave zero bytes or only a bounded prefix before exit 3, which the controller treats as terminal transaction failure rather than evidence. The separately specified argc-one read-only local audit retains its report diagnostics and is outside this entry-attempt rule. Codes contain E_ plus one through 62 ASCII uppercase, digit, or underscore bytes; an invalid code becomes E_ENTRY_CODE. Detail is ASCII: printable bytes are literal except reverse solidus, vertical bar, and tilde; vertical bar is exactly \\x7C so detail contains no raw field delimiter, reverse solidus is doubled, tilde is \\x7E, LF/CR/tab use \\n/\\r/\\t, and all other controls, DEL, and every non-ASCII UTF-8 byte use uppercase \\xHH. A sole terminal unescaped tilde before LF marks truncation. Panic payload, location, and thread are suppressed in favor of fixed E_ENTRY_PANIC detail. Successful role/controller entry is diagnostic-silent, and the operational attempt is never evidence, a seal input, or a success criterion"
bootstrap_test_argv = ["rustc", "--edition=2024", "--cfg", "fnd01_bootstrap", "--test", "crates/fastmcp/tests/fnd_01_dependency_evidence.rs", "-o", "/tmp/fastmcp-fnd01-bootstrap-tests-<run-id>"]
bootstrap_test_rule = "two complementary serialized RCH lanes are mandatory. First, from the physical repository root and pinned nightly-2026-07-11 selected by rust-toolchain.toml, substitute one nonzero lowercase run ID into bootstrap_test_argv and require direct rustc compile success; its run-scoped /tmp parent exists on the remote worker and proves the cfg(fnd01_bootstrap) test source compiles with no Cargo dependency linkage, but installed RCH does not return an arbitrary /tmp executable so this lane makes no execution claim. Second, execute `RUSTFLAGS=--cfg fnd01_bootstrap cargo test -p fastmcp-rust --test fnd_01_dependency_evidence -- --nocapture` through RCH to run the phase_b_std and shared trust_std tests; this Cargo lane proves execution but does not replace the raw-rustc no-external-linkage proof. A normal Cargo test omitting cfg(fnd01_bootstrap), a compile-only Cargo check, or an unpinned/local rustc is not a substitute"
producer_argv = ["target/debug/fnd-01/<run-id>/bootstrap", "produce", ".", "<run-id>"]
attester_argv = ["target/debug/fnd-01/<run-id>/bootstrap", "attest", ".", "<run-id>", ".fnd01-run/controller/<run-id>/producer-outer.bin"]
