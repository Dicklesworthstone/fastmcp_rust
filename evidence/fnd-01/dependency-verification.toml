source_snapshot_rule = "before the first package-list command, before package A, before package B, after package B, and independently during final attestation, checked_snapshot validates exactly the selected 163 workspace snapshot logical paths with identical lengths and hashes; every one of the four producer and four attester observations retains all 163 complete workspace-file-binding rows with exact command-boundary anchors. Each role's four scans preserve identical staging file identities and metadata while source-to-staging and producer-to-attester filesystem identities are intentionally independent; only the ordered path/length/SHA-256 byte authority crosses those boundaries. For pinned Cargo commit 59800466c5c41c444d264b1010b4d57e85a7117f, package Git discovery is modeled exactly as gix::discover(package_root): for every one of the nine generated package roots, record the raw-UTF-8-sorted union of that root and all lexical ancestors through POSIX /, probe each exact .git candidate with std::fs::symlink_metadata, and accept absence only from ErrorKind::NotFound. A present directory, regular file, Git worktree file, symlink including dangling symlink, special node, permission or other I/O error, missing/reordered probe, or emitted .cargo_vcs_info.json fails. This proves only pinned-Cargo Git-discovery absence along those paths, not universal VCS absence or absence of unrelated entries in the staging subtree; RCH transport behavior is not inferred"
manifest_path_formula = ".fnd01-run/<role>/<run-id>/package-source/Cargo.toml"
target_dir_a_formula = ".fnd01-run/<role>/<run-id>/package-target/a"
target_dir_b_formula = ".fnd01-run/<role>/<run-id>/package-target/b"
target_dir_rule = "each repository-relative workspace-wide target directory is fresh, absent, unique to exactly one A/B package command, no-follow contained beneath .fnd01-run, and never shared between A/B, roles, or runs"
command_rule = "package-list plus both package builds use the exact staging manifest, omit --allow-dirty and --no-verify, include --locked and --offline, and run only after every exact package-root-to-POSIX-root .git probe proves the pinned Cargo Git-discovery result absent-not-found; package-list is non-building membership discovery with no target-dir, while A/B use their unique --target-dir and perform Cargo's normal package verification; .cargo_vcs_info.json is forbidden"
command_output_formula = "<workspace-wide-package-target-dir>/package/<package-id>-0.3.2.crate"
command_output_rule = "after each passing workspace-wide A/B command, exactly nine regular no-link files exist at command_output_formula, one for every package_artifacts_contract.package_ids member keyed by package_id and in that declared order; no other `.crate` file may exist under that command's package output directory, and no glob, newest-file, or index-based package-ID inference is allowed. Hash/copy/fsync/reopen every file to its distinct retained A/B entry and require source/destination byte equality"
archive_root_formula = "<package-id>-0.3.2"
member_mapping_rule = "let L be the exact authoritative command-results package-listing for package_id: every raw_row other than exact Cargo.toml, Cargo.toml.orig, and Cargo.lock maps through its canonical source_row bijectively to one same-path package-receipt source_listing member whose bytes equal its package-root or exact package_relocated_source workspace binding; every such ordinary archive member must occur in L; the three generated rows follow manifest_member_rules; no unlisted workspace byte, missing listed row, ambient Cargo rule, external file, or additional generated/relocated exception is admitted"
manifest_member_rules = ["the Cargo.toml row must occur exactly once in L; archive Cargo.toml is strict duplicate-key-free TOML with exact package name/version, forbids workspace/patch/replace roots, and recursively forbids path/git/workspace source selectors in ordinary and target-specific dependency tables; its archive bytes may differ only as Cargo-normalized publish metadata and remain bound to the listed source-manifest provenance", "Cargo.toml.orig occurs exactly once, is classed cargo-original-manifest, and its bytes exactly equal the staged source package Cargo.toml", "Cargo.lock is optional, is classed cargo-generated-lock when present, binds workspace_source_path exact logical Cargo.lock plus the command-results workspace postcommand-lock SHA-256, parses under lockfile_producer_contract.zip_rule with the exact singleton source-less identity <package-id> 0.3.2, and has a complete crates.io name/version/checksum triple set that is an exact subset of the retained staged workspace lock triple set; its generated bytes need not equal the staged workspace lock", "the complete archive member set after removing its one root equals the mapped ordinary L rows plus exactly one normalized Cargo.toml, exactly one Cargo.toml.orig, and zero or one generated Cargo.lock, with no other generated member"]
forbidden_members = [".cargo_vcs_info.json", ".git"]
member_exception_rule = "only normalized Cargo.toml and an optional normalized Cargo.lock are generated-byte exceptions; Cargo.toml.orig is a name-generation exception but its bytes must equal the bound listed source manifest; every other regular member, including license/readme files, must match one listed bound staging input byte-for-byte"
archive_member_binding_rule = "strict archive parsing emits one package_archive_member for every regular member beneath the sole archive root, with path always root-relative and workspace_source_path always nonempty: ordinary-source and manifest classes use the exact repository-relative workspace_snapshot path, while cargo-generated-lock alone uses exact logical Cargo.lock joined to command-results' retained workspace postcommand lock. ordinary-source and relocated-source rows bind bijectively to the exact package_source_row and require equal source/archive length and SHA-256; cargo-original-manifest binds Cargo.toml.orig to the canonical source-manifest row and requires equal bytes; cargo-normalized-manifest binds archive Cargo.toml to that source row but permits different bytes only after manifest_member_rules validation; cargo-generated-lock permits different bytes only after the exact strict subset comparison. Every row records one mapping_rule_id plus archive identity and nonempty source provenance; no sentinel, aggregate-only tree digest, untyped generated exception, missing/extra/duplicate mapping, VCS member, verifier source, or unbound member can pass"
archive_member_classes = ["ordinary-source", "relocated-source", "cargo-original-manifest", "cargo-normalized-manifest", "cargo-generated-lock"]
mapping_rule_ids = ["PKG-MAP-IDENTITY", "PKG-MAP-RELOCATION", "PKG-MAP-ORIGINAL-MANIFEST", "PKG-MAP-NORMALIZED-MANIFEST", "PKG-MAP-GENERATED-LOCK"]
mapping_rule_binding = "ordinary-source uses PKG-MAP-IDENTITY, relocated-source uses PKG-MAP-RELOCATION, cargo-original-manifest uses PKG-MAP-ORIGINAL-MANIFEST, cargo-normalized-manifest uses PKG-MAP-NORMALIZED-MANIFEST, and cargo-generated-lock uses PKG-MAP-GENERATED-LOCK; every member records exactly one mapping ID and no default, inferred, wildcard, or reused mapping is allowed"
