coordinate_rule = "the only external-input coordinates have exact grammar `{input-root:<root-id>.path}` or `{input-root:<root-id>.tree}` with root-id from root_ids. A `.path` coordinate may expand once to the checked absolute path recorded in producer-environment.external_input_root, either as one whole command value or as the one embedded coordinate in a selected cflags-exact/rustflags-exact field. A `.tree` coordinate names the same row's typed id/path/device/inode/mode/nlink/entry_count/total_regular_file_bytes/tree_sha256 tuple for evidence joins only and is forbidden in every argv/environment/CWD string. Substitution is byte-for-byte before command hashing, names use pinned-rust-sysroot exactly, and legacy pinned-sysroot, darwin-sdk-root, arbitrary *-binding, an embedded direct token, or undeclared coordinate name fails"
aggregate_bound_rule = "walk all five logical external roots without following unadmitted links and enforce bounds.max_external_input_entry_count and bounds.max_external_input_total_bytes once over their union, while each member length is at most bounds.max_external_input_member_bytes and each root independently fits the same entry/total ceilings. Check every length/count/addition before allocation or hashing and require the five regular-file device/inode identity sets pairwise disjoint; an overlap, second spelling, hardlink alias, post-snapshot discovery, or new compiler search directory fails rather than being deduplicated or resetting a cap"
registry_rule = "these five rows are the complete external directory roots that may supply target rustlib, headers, libraries, startup objects, or SDK metadata to a compile cell; each selected absolute root is recorded once in producer-environment with Linux dev/ino/mode identity, entry count, total regular-file bytes, and canonical tree SHA-256, then rechecked before/after every consuming command and independently rebound by the attester. No placeholder, ambient compiler search root, implicit host default, unlisted include/library directory, or descendant outside its bound root is admitted"

