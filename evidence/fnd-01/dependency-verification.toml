controller_os_temp_rule = "controller-os-temp is an absolute lexical temporary root compiled as exactly /private/tmp on macOS controllers and exactly /tmp on Linux controllers; macOS /tmp is a symlink to /private/tmp and is never accepted as the lexical root, while Linux /tmp must not be a symlink. After external controller build authority succeeds, the controller requires <controller-os-temp>/fnd01/<run-id> absent solely by ErrorKind::NotFound, creates that shared run parent exactly once with mode 0700, binds its portable Unix directory identity, and reuses the same identity through producer, attester, and gate. Each phase creates only its distinct fresh ev/<phase> and s/<phase-code> leaves beneath that parent. All private daemon evidence and socket paths are formed only under this shared parent and never under the repository checkout or .fnd01-run inside the workspace"
