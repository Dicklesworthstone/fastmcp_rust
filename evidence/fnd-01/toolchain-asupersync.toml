$ObservedManifest = (Get-FileHash -Algorithm SHA256 $ChannelManifest).Hash.ToLowerInvariant()
if ($ObservedManifest -cne $ExpectedManifestSha256) {
  throw "dated channel manifest checksum mismatch: $ObservedManifest"
}
$UpdateHashLines = @(Get-Content -LiteralPath $ChannelUpdateHash)
if (
  $UpdateHashLines.Count -ne 1 -or
  [string]::IsNullOrWhiteSpace($UpdateHashLines[0])
) {
  throw 'invalid dated channel update-hash file'
}
$ObservedUpdateHash = (($UpdateHashLines[0] -split '\s+')[0]).ToLowerInvariant()
if ($ObservedUpdateHash -cne $ExpectedManifestSha256) {
  throw "dated channel update-hash mismatch: $ObservedUpdateHash"
}
