unix_recipe = '''
set -eu
export FASTMCP_HOST_TRIPLE=REPLACE_WITH_ONE_OF_THE_UNIX_HOSTS_IN_THIS_RECORD
export FASTMCP_RUSTUP_INIT_SHA256=REPLACE_WITH_MATCHING_INSTALLER_SHA256_FROM_THIS_RECORD
export FASTMCP_RUSTUP_HOME=/absolute/new/empty/fastmcp-rustup
export FASTMCP_CARGO_HOME=/absolute/new/empty/fastmcp-cargo
FASTMCP_RUSTUP_INIT=/absolute/new/empty/rustup-init
FASTMCP_CHANNEL_MANIFEST=/absolute/new/empty/channel-rust-nightly-2026-07-11.toml
FASTMCP_CHANNEL_UPDATE_HASH=/absolute/new/empty/channel-rust-nightly-2026-07-11.toml.sha256
FASTMCP_EXPECTED_MANIFEST_SHA256=63fcf718955abd22b266dc8fb3e44ea1fd83b5a58023f0644785bd9dd0f01b7f

if [ "${RUSTUP_DIST_SERVER+x}" = x ]; then
  printf 'refusing inherited RUSTUP_DIST_SERVER\n' >&2
  exit 1
fi
for path in \
  "$FASTMCP_RUSTUP_HOME" \
  "$FASTMCP_CARGO_HOME" \
  "$FASTMCP_RUSTUP_INIT" \
  "$FASTMCP_CHANNEL_MANIFEST" \
  "$FASTMCP_CHANNEL_UPDATE_HASH"
do
  if [ -e "$path" ] || [ -L "$path" ]; then
    printf 'refusing existing clean-install path: %s\n' "$path" >&2
    exit 1
  fi
done
if [ "$FASTMCP_RUSTUP_HOME" = "$FASTMCP_CARGO_HOME" ]; then
  printf 'RUSTUP_HOME and CARGO_HOME must be distinct\n' >&2
  exit 1
fi

export RUSTUP_DIST_SERVER=https://static.rust-lang.org
export RUSTUP_HOME="$FASTMCP_RUSTUP_HOME"
export CARGO_HOME="$FASTMCP_CARGO_HOME"

verify_sha256() {
  expected=$1
  file=$2
  case "$(uname -s)" in
    Darwin) output=$(shasum -a 256 "$file") || exit 1 ;;
    Linux) output=$(sha256sum "$file") || exit 1 ;;
    *) printf 'unsupported checksum platform\n' >&2; exit 64 ;;
  esac
  actual=${output%% *}
  if [ "$actual" != "$expected" ]; then
    printf 'SHA-256 mismatch for %s\nexpected: %s\nactual:   %s\n' \
      "$file" "$expected" "$actual" >&2
    exit 1
  fi
}

curl --proto '=https' --tlsv1.2 -fsSLo "$FASTMCP_CHANNEL_MANIFEST" \
  "$RUSTUP_DIST_SERVER/dist/2026-07-11/channel-rust-nightly.toml"
curl --proto '=https' --tlsv1.2 -fsSLo "$FASTMCP_CHANNEL_UPDATE_HASH" \
  "$RUSTUP_DIST_SERVER/dist/2026-07-11/channel-rust-nightly.toml.sha256"
curl --proto '=https' --tlsv1.2 -fsSLo "$FASTMCP_RUSTUP_INIT" \
  "$RUSTUP_DIST_SERVER/rustup/archive/1.29.0/$FASTMCP_HOST_TRIPLE/rustup-init"

verify_sha256 "$FASTMCP_EXPECTED_MANIFEST_SHA256" "$FASTMCP_CHANNEL_MANIFEST"
if ! observed_update_hash=$(
  awk 'NR == 1 { value = $1 } END { if (NR != 1) exit 1; print value }' \
    "$FASTMCP_CHANNEL_UPDATE_HASH"
); then
  printf 'invalid dated channel update-hash file\n' >&2
  exit 1
fi
if [ "$observed_update_hash" != "$FASTMCP_EXPECTED_MANIFEST_SHA256" ]; then
  printf 'dated channel update-hash mismatch\nexpected: %s\nactual:   %s\n' \
    "$FASTMCP_EXPECTED_MANIFEST_SHA256" "$observed_update_hash" >&2
  exit 1
fi
verify_sha256 "$FASTMCP_RUSTUP_INIT_SHA256" "$FASTMCP_RUSTUP_INIT"

chmod 0755 "$FASTMCP_RUSTUP_INIT"
"$FASTMCP_RUSTUP_INIT" -y --no-modify-path --profile minimal --default-toolchain none
"$CARGO_HOME/bin/rustup" toolchain install nightly-2026-07-11 \
  --profile minimal --component rustfmt,clippy,llvm-tools-preview \
  --target aarch64-apple-darwin,aarch64-unknown-linux-gnu,x86_64-apple-darwin,x86_64-pc-windows-msvc,x86_64-unknown-linux-gnu \
  --no-self-update
'''
