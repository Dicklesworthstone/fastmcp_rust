$env:CARGO_HOME = $env:FASTMCP_CARGO_HOME
[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

Invoke-WebRequest -UseBasicParsing -SslProtocol Tls12 `
  -Uri "$env:RUSTUP_DIST_SERVER/dist/2026-07-11/channel-rust-nightly.toml" `
  -OutFile $ChannelManifest
Invoke-WebRequest -UseBasicParsing -SslProtocol Tls12 `
