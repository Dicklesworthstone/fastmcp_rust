$Expected = '86478e53f769379d7f0ebfa7c9aa97cb76ca92233f79aa2cc0dbee2efaac73c7'
if ($Observed -ne $Expected) { throw "rustup-init checksum mismatch: $Observed" }
& $RustupInit -y --no-modify-path --profile minimal --default-toolchain none
if ($LASTEXITCODE -ne 0) { throw "rustup-init exited with code $LASTEXITCODE" }
& "$env:CARGO_HOME\bin\rustup.exe" toolchain install nightly-2026-07-11 `
  --profile minimal --component rustfmt,clippy,llvm-tools-preview `
  --target aarch64-apple-darwin,aarch64-unknown-linux-gnu,x86_64-apple-darwin,x86_64-pc-windows-msvc,x86_64-unknown-linux-gnu `
  --no-self-update
if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install exited with code $LASTEXITCODE" }
