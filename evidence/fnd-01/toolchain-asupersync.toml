[[asupersync.candidate.fnd_04_prerequisites]]
id = "FND-04-P2"
name = "ambient-Cx-guaranteed-non-inline-bounded-blocking"
required = "From the ambient &Cx available to FastMCP, a public, detectable bounded blocking facility must guarantee that blocking closures cannot run inline on the async worker."
status = "unresolved"
disposition = "fails candidate qualification"
evidence = "Cx::spawn_blocking and spawn_blocking_in explicitly execute f(child) inline when no pool handle exists; Cx::blocking_pool_handle is crate-private, so a consumer holding only ambient &Cx cannot preflight this condition. Runtime-level pool APIs do not repair the ambient-Cx contract."
source_ranges = ["src/cx/cx.rs:4142-4223"]

