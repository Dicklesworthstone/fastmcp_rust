[update_procedure]
baseline_is_append_only = true
steps = [
  "Fetch the commit-addressed catalog URL and reject redirects to an unpinned source.",
  "Verify exact catalog byte length and SHA-256 before parsing any row.",
  "Parse all SDK rows, reject duplicate or unknown IDs, and compare exact Tier sets and tier assignments.",
  "Fetch the live main-branch catalog only as a drift observation and produce a reviewed semantic diff.",
  "For each frozen Tier-1 peer, re-resolve tag objects/commits and registry artifact bytes independently.",
  "Regenerate each isolated native lock using its recorded resolver and target.",
  "Stage the checked-in inputs under each ecosystem's native filenames in fresh online and offline directories.",
  "Run the online resolution into an empty cache, then run the recorded offline resolution in a fresh consumer directory using only that populated cache or wheelhouse and an OS-level deny-network sandbox.",
  "For Go, resolve from the external consumer module and require the go-sdk v1.7.0 root artifact itself to appear in go.sum and the stable download projection.",
  "For C#, compare both the exact packages.lock.json and the stable path-independent projection of the offline project.assets.json closure.",
  "Compare lock bytes or the explicitly recorded canonical representation and compare complete closure digests.",
  "Bind and run the declared harnesses through bd-mcp-2026-07-28-support-ahet.1.14B or the serialized batch lane before accepting any execution result.",
  "On any reviewed release or catalog change, mint a new evidence baseline; never silently mutate the 2026-07-28 freeze.",
]

