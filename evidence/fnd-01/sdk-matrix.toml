reproduction_script = '''
set -eu
set -o pipefail
repo_root=$(pwd -P)
go_tool="$GO_1_25/bin/go"
test "$("$go_tool" version)" = "go version go1.25.0 darwin/arm64"
go_cache=$(mktemp -d /tmp/fastmcp-fnd01-go-proof-mod-cache.XXXXXX)
go_build_cache=$(mktemp -d /tmp/fastmcp-fnd01-go-proof-build-cache.XXXXXX)
go_online=$(mktemp -d /tmp/fastmcp-fnd01-go-proof-online.XXXXXX)
go_offline=$(mktemp -d /tmp/fastmcp-fnd01-go-proof-offline.XXXXXX)
install -m 0644 "$repo_root/evidence/fnd-01/sdk-locks/go-consumer.mod" "$go_online/go.mod"
(
  cd "$go_online"
  GOENV=off GOTOOLCHAIN=local GOCACHE="$go_build_cache" GOMODCACHE="$go_cache" GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org GOVCS='*:all' "$go_tool" mod download -json all > download.jsonl
  jq -s 'map({GoModSum, Origin: (.Origin // null), Path, Sum, Version}) | sort_by(.Path)' download.jsonl > modules.lock.json
  GOENV=off GOTOOLCHAIN=local GOCACHE="$go_build_cache" GOMODCACHE="$go_cache" GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org GOVCS='*:all' "$go_tool" list -mod=readonly -m all | LC_ALL=C sort > modules.sorted.txt
)
cmp "$go_online/go.sum" "$repo_root/evidence/fnd-01/sdk-locks/go-consumer.sum"
cmp "$go_online/modules.lock.json" "$repo_root/evidence/fnd-01/sdk-locks/go-consumer-modules.lock.json"
install -m 0644 "$repo_root/evidence/fnd-01/sdk-locks/go-consumer.mod" "$go_offline/go.mod"
install -m 0644 "$repo_root/evidence/fnd-01/sdk-locks/go-consumer.sum" "$go_offline/go.sum"
(
  cd "$go_offline"
  sandbox-exec -p '(version 1) (allow default) (deny network*)' /usr/bin/env GOENV=off GOTOOLCHAIN=local GOCACHE="$go_build_cache" GOMODCACHE="$go_cache" GOPROXY=off GOSUMDB=off GOVCS='*:off' "$go_tool" mod download -json all > download.jsonl
  jq -s 'map({GoModSum, Origin: (.Origin // null), Path, Sum, Version}) | sort_by(.Path)' download.jsonl > modules.lock.json
  sandbox-exec -p '(version 1) (allow default) (deny network*)' /usr/bin/env GOENV=off GOTOOLCHAIN=local GOCACHE="$go_build_cache" GOMODCACHE="$go_cache" GOPROXY=off GOSUMDB=off GOVCS='*:off' "$go_tool" list -mod=readonly -m all | LC_ALL=C sort > modules.sorted.txt
)
cmp "$go_online/modules.lock.json" "$go_offline/modules.lock.json"
cmp "$go_online/modules.sorted.txt" "$go_offline/modules.sorted.txt"
test "$(shasum -a 256 "$go_offline/modules.lock.json" | awk '{print $1}')" = "ca8c375c4090d64f8658a081a4c815206ccfef126ed28692ca446eb504e73b61"
test "$(shasum -a 256 "$go_offline/modules.sorted.txt" | awk '{print $1}')" = "5636d9bd1a83b90257b366339f1b31f58bf17f57926f4a4e9bba899bbd074465"
jq -e '.[] | select(.Path == "github.com/modelcontextprotocol/go-sdk" and .Version == "v1.7.0" and .Sum == "h1:yqjY2dsbKAC0LSuWZVBMrHgiG8ukXv6NRo0JiALay44=")' "$go_offline/modules.lock.json" >/dev/null
if sandbox-exec -p '(version 1) (allow default) (deny network*)' /usr/bin/curl --silent --show-error --max-time 2 https://proxy.golang.org/ >/dev/null; then
  exit 97
fi
'''

