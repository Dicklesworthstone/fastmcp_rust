reacceptance = "Phase B must recompute baseline_sha256 from this exact v2 preimage before semantic validation. A changed byte-bound row, an altered row order, or an altered row field requires independent typed reacceptance; it never inherits registry, advisory, target, workspace, or RCH credit."
production_validator_contract = "The production validator loads this source contract, recomputes the v2 baseline, then validates every byte-bound component before semantic joins. Byte-absent rows remain typed-unverified and cannot be promoted by copied metadata, nonzero byte counts, or equal copied constants."
planted_feature_policy_negative = "The ordinary::fnd_01_serialization_uri_dependencies_planted_negative test first proves the accepted source-contract wrapper baseline unchanged, then mutates only crate[name=jsonschema].prohibited_features[0] from default to default-drift in memory and requires the same production validator to emit FND01|Error|E_SERIALIZATION_URI_FEATURE_POLICY|serialization-uri-dependencies|crate[name=jsonschema].prohibited_features."
archive_metadata_rule = "archive_bytes, archive checksums, registry/API values, and publisher-lock values recorded in [[crate]] are historical copied metadata only in Phase A. A nonzero archive_bytes value, an equal copied constant, or a recorded checksum is not archive, registry, API, or publisher-lock proof."

