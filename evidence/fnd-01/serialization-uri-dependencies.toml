claim = "the checked-in isolated consumer lock and recorded historical registry, advisory, and target-graph metadata are frozen; registry/archive, advisory execution, target-graph execution, workspace integration, and RCH proof remain unverified downstream gates, so the aggregate stays fail-closed"

[handoff]
evidence_child_complete_when = "Every direct registry/source/declaration record, the checked-in resolver-2 consumer lock, materialization recipe, dev-edge proof, target-graph hash, advisory binding, and negative assertion in this artifact independently validates."
integration_owner = "bd-mcp-2026-07-28-support-ahet.1.1"
verification_owner = "bd-mcp-2026-07-28-support-ahet.1.14"
integration_owned_pending = [
  "apply the missing jsonschema and argon2 dependencies and planned ownership to shared workspace manifests",
  "converge the shared Cargo.lock",
  "run all compilation through RCH",
]
verification_owned_pending = [
  "independently verify registry/archive and advisory observations rather than treating recorded metadata as proof",
  "capture and compare canonical target-graph output bytes from a clean materialized consumer",
  "run packaged-consumer compilation and prohibited-package checks",
  "turn the three workspace/RCH gate fields above true only after observed success",
]
closure_boundary = "This evidence child may close before integration only after independent review of its owned records. Its closure is not a workspace dependency-support claim and cannot make any aggregate FND-01 gate pass."

