[reproduction]
materialization_precondition = "FASTMCP_FND01_PROBE_DIR names a new nonexistent path outside every source checkout; never point it at a workspace or user-home directory."
materialization_recipe = '''
export FASTMCP_FND01_PROBE_DIR=/absolute/new/fastmcp-fnd01-dependency-probe
test ! -e "$FASTMCP_FND01_PROBE_DIR"
mkdir -p "$FASTMCP_FND01_PROBE_DIR/src"
yq -p toml -o json '.consumer_probe.manifest' evidence/fnd-01/serialization-uri-dependencies.toml | jq -j -r '.' > "$FASTMCP_FND01_PROBE_DIR/Cargo.toml"
yq -p toml -o json '.consumer_probe.source' evidence/fnd-01/serialization-uri-dependencies.toml | jq -j -r '.' > "$FASTMCP_FND01_PROBE_DIR/src/lib.rs"
install -m 0644 evidence/fnd-01/serialization-uri-consumer.lock "$FASTMCP_FND01_PROBE_DIR/Cargo.lock"
test "$(wc -c < "$FASTMCP_FND01_PROBE_DIR/Cargo.toml" | tr -d ' ')" = 578
test "$(shasum -a 256 "$FASTMCP_FND01_PROBE_DIR/Cargo.toml" | cut -d ' ' -f 1)" = 1131b5d2403f5ce9bce00014c0fc70ecdf3a0c595180b32e5f9daeca214d32d0
test "$(shasum -a 256 "$FASTMCP_FND01_PROBE_DIR/src/lib.rs" | cut -d ' ' -f 1)" = 31d7843263bb4b61502b7ae9d92ac7b121b8d70e4f1421afd719bffc5e898f55
test "$(shasum -a 256 "$FASTMCP_FND01_PROBE_DIR/Cargo.lock" | cut -d ' ' -f 1)" = c13836da46ef5637de3a16a025fbd51e00ae063f24434d121d60b6f73b7b15ef
'''
archive_hash = "curl -fsSL <archive_url> | shasum -a 256"
archive_length = "curl -fsSL <archive_url> | wc -c"
vcs_info = "curl -fsSL <archive_url> | tar -xzOf - <crate-version>/.cargo_vcs_info.json"
publisher_manifest_normalized = "curl -fsSL <archive_url> | tar -xzOf - <crate-version>/Cargo.toml"
publisher_manifest_original = "curl -fsSL <archive_url> | tar -xzOf - <crate-version>/Cargo.toml.orig"
registry_record = "curl -fsSL <index_url> | jq -c 'select(.vers == \"<version>\")'"
lock_projection = "yq -p=toml -o=json '.' Cargo.lock | jq -r '.package | sort_by(.name,.version)[] | [.name,.version,(.checksum // \"path\")] | @tsv'"
normal_build_graph = "cargo tree --locked --target <target> --edges normal,build --prefix depth --format '{p}' | sed -E 's#fastmcp_fnd01_dep_probe v0.1.0 \\([^)]*\\)#fastmcp_fnd01_dep_probe v0.1.0#; s/[[:space:]]+$//'"
feature_graph = "cargo tree --locked --target <target> --edges features --prefix depth --format '{p} {f}' | sed -E 's#fastmcp_fnd01_dep_probe v0.1.0 \\([^)]*\\)#fastmcp_fnd01_dep_probe v0.1.0#; s/[[:space:]]+$//'"
dev_graph = "cargo tree --locked --edges dev --prefix depth --format '{p}' | sed -E 's#fastmcp_fnd01_dep_probe v0.1.0 \\([^)]*\\)#fastmcp_fnd01_dep_probe v0.1.0#; s/[[:space:]]+$//'"
target_graph_prerequisites = "Run from FASTMCP_FND01_PROBE_DIR with the exact dated Cargo, checked-in lock, and registry archives whose checksums Cargo verifies against that lock. The recorded hashes are not claimed reproducible from the lock bytes alone."
advisory_database_verify = "test \"$(git -C \"$FASTMCP_RUSTSEC_DB\" rev-parse HEAD)\" = 7c7ccac53056b87f69ac677f15ea2d9a98a6f8e2 && test -z \"$(git -C \"$FASTMCP_RUSTSEC_DB\" status --porcelain)\""
advisory_check = "cargo audit --db \"$FASTMCP_RUSTSEC_DB\" --file \"$FASTMCP_FND01_PROBE_DIR/Cargo.lock\" --no-fetch --json"

[current_workspace_gap]
serde_json_lock = "1.0.151 is present and the read-only root declaration is exact with arbitrary_precision"
url_lock = "2.5.8 is present and the read-only root declaration is exact with default-features=false and std; both fastmcp-core and fastmcp-server directly consume the workspace edge, contrary to the planned core-sole-owner integration"
zeroize_lock = "1.9.0 is present and the read-only root declaration is exact with default-features=false and alloc,derive; both fastmcp-core and fastmcp-server directly consume the workspace edge, contrary to the planned core-sole-owner integration"
jsonschema_lock = "absent"
argon2_lock = "absent"
shared_files_owner = "bd-mcp-2026-07-28-support-ahet.1.1"
required_integration = [
  "add the missing exact jsonschema and argon2 declarations and ownership in shared Cargo manifests",
  "converge Cargo.lock after those two declarations are integrated",
  "run the isolated and workspace package-consumer checks through RCH",
