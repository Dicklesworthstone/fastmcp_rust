domain_separator_rule = "The first preimage bytes are the ASCII bytes of domain_separator_text followed by one actual ASCII NUL byte (0x00); the hexadecimal value above is normative. The TOML value contains no escaped or literal backslash-u sequence."
string_encoding = "Every field value is UTF-8 encoded without normalization, including the ASCII token absent."
row_field_order = ["id", "kind", "byte_presence", "content_sha256", "verification_status"]
row_encoding = "For each immutable_input in declaration order, append each row_field_order value as u32 big-endian UTF-8 byte length followed immediately by its UTF-8 bytes. No newline, separator, implicit terminator, TOML serialization, or omitted field is permitted."
preimage = "domain_separator_bytes followed by the encoded immutable_input rows only. The source-contract row encodes its typed self-exclusion, while the format, baseline_sha256 field, explanatory prose, and this manifest's enclosing bytes are not recursively serialized into the preimage."
manifest_source_contract = "This TOML document is the byte-present source contract that defines the ordered rows and validation policy. Its source-contract row deliberately records content_sha256=self-excluded rather than a recursive manifest self-hash. Phase B must load this exact source contract before recomputing the non-self baseline."
