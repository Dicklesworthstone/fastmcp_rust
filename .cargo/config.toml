# Parallel rustc front-end (nightly). Added by build-settings sweep.
[build]
rustflags = ["-Z", "threads=4"]
# Source overlays can preserve timestamps older than pooled build outputs.
# Compare Rust source contents so a different overlay cannot reuse stale code.
fingerprint = "content"

[unstable]
checksum-freshness = true

# FND-02: resolve the traceability checker by package so the command never
# depends on an ambient `cargo-xtask` executable or on PATH.
# `cargo xtask plan-tracker-check all` and
# `cargo run --locked --quiet -p fastmcp-xtask -- plan-tracker-check all`
# are the same invocation.
[alias]
xtask = "run --locked --quiet -p fastmcp-xtask --"
